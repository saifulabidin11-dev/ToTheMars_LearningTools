njang."}, {"id": "ms7", "category": "Bangun Ruang", "difficulty": "FOUNDATION", "reasoning": "R1", "question": "Bentuk dari sebuah bola basket disebut bangun ruang...", "options": ["Tabung", "Kerucut", "Kubus", "Bola (Sphere)"], "correct": 3, "explanation": "Basket berbentuk bola bulat sempurna.", "hint": "Tidak bersudut."}, {"id": "ms8", "category": "Geometri Segi", "difficulty": "STANDARD", "reasoning": "R2", "question": "Sebuah segienam (heksagon) memiliki berapa buah sisi?", "options": ["4", "5", "6", "8"], "correct": 2, "explanation": "Heksagon memiliki 6 sisi.", "hint": "Namanya sudah menunjukkan jumlah."}, {"id": "ms9", "category": "Jaring-jaring", "difficulty": "ADVANCED", "reasoning": "R4", "question": "Berapa banyak kotak persegi minimal untuk membuat sebuah kubus tertutup?", "options": ["4", "5", "6", "8"], "correct": 2, "explanation": "Kubus punya 6 sisi (atas, bawah, depan, belakang, kiri, kanan).", "hint": "Ingat jumlah sisi pada dadu."}, {"id": "ms10", "category": "Rotasi", "difficulty": "STANDARD", "reasoning": "R3", "question": "Panah menunjuk ke Atas. Jika diputar 90 derajat searah jarum jam, panah menunjuk ke?", "options": ["Bawah", "Kanan", "Kiri", "Atas"], "correct": 1, "explanation": "Putar ke kanan 90 derajat akan mengarah ke Kanan.", "hint": "Bayangkan jarum jam jam 12 bergerak ke jam 3."}, {"id": "ms11", "category": "Pencerminan", "difficulty": "STANDARD", "reasoning": "R3", "question": "Huruf kecil 'p' dicerminkan akan tampak seperti huruf...", "options": ["b", "d", "q", "p"], "correct": 2, "explanation": "Lengkungan 'p' (kanan atas) pindah ke (kiri atas) menjadi 'q'.", "hint": "Dibalik kiri-kanan."}, {"id": "ms12", "category": "Sifat Bangun", "difficulty": "FOUNDATION", "reasoning": "R1", "question": "Bangun datar manakah yang TIDAK memiliki sudut sama sekali?", "options": ["Segitiga", "Trapesium", "Lingkaran", "Layang-layang"], "correct": 2, "explanation": "Lingkaran hanya berupa garis lengkung tertutup tanpa sudut tajam.", "hint": "Bentu ", "options": ["Kubus", "Tabung", "Kerucut", "Bola"], "correct": 2, "explanation": "Cone adalah bentuk kerucut.", "hint": "Bawahnya lancip, atasnya bundar."}, {"id": "ms19", "category": "Logika Kertas", "difficulty": "STANDARD", "reasoning": "R3", "question": "Selembar kertas persegi panjang digulung ujung ke ujung. Akan membentuk bangun ruang apa?", "options": ["Kubus", "Bola", "Kerucut", "Tabung (Silinder)"], "correct": 3, "explanation": "Menggulung kertas lurus akan menghasilkan tabung berongga.", "hint": "Seperti pipa pralon."}, {"id": "ms20", "category": "Bayangan Benda", "difficulty": "STANDARD", "reasoning": "R2", "question": "Sebuah bola disinari senter ke arah tembok. Bentuk bayangan bola di tembok adalah?", "options": ["Persegi", "Lingkaran", "Segitiga", "Kubus"], "correct": 1, "explanation": "Proyeksi bayangan dari bola (3D) ke bidang datar adalah lingkaran (2D).", "hint": "Bayangan bentuk datar."}, {"id": "ms21", "category": "Sudut Jam", "difficulty": "ADVANCED", "reasoning": "R4", "question": "Pada pukul 03:00 tepat, sudut terkecil yang dibentuk oleh jarum jam dan jarum menit adalah...", "options": ["45 derajat", "90 derajat (Siku-siku)", "180 derajat", "360 derajat"], "correct": 1, "explanation": "Jarum pendek di 3, panjang di 12. Sudutnya persis 90 derajat siku-siku.", "hint": "Membentuk huruf L tegak."}, {"id": "ms22", "category": "Pencerminan Huruf", "difficulty": "FOUNDATION", "reasoning": "R2", "question": "Huruf kapital 'M' jika dicerminkan kiri-kanan akan tampak seperti huruf...", "options": ["W", "N", "M", "E"], "correct": 2, "explanation": "M simetris secara vertikal, cerminannya tetap M.", "hint": "Bentuknya simetris (sama sisi)."}, {"id": "ms23", "category": "Rusuk Bangun", "difficulty": "ADVANCED", "reasoning": "R4", "question": "Sebuah kotak sepatu (balok) memiliki berapa banyak rusuk (garis tepi)?", "options": ["6", "8", "10", "12"], "correct": 3, "explanation": "Balok punya 12 rusuk (4 atas, 4 bawah, 4 tiang berdiri).", "hint": "Hitung semua garis kerangkanya."}, {"id": "ms24", "category": "Susun Balok", "difficulty": "STANDARD", "reasoning": "R3", "question": "Kamu punya 4 kubus kecil. Jika disusun membentuk persegi besar di lantai, berapa kubus yang dipakai?", "options": ["2", "4", "6", "8"], "correct": 1, "explanation": "2x2 kubus membentuk persegi lantai.", "hint": "Bentuk 2 baris 2 kolom."}, {"id": "ms25", "category": "Bentuk Sehari-hari", "difficulty": "FOUNDATION", "reasoning": "R1", "question": "Pintu rumah pada umumnya memiliki bentuk dasar geometri berupa...", "options": ["Lingkaran", "Segitiga", "Persegi panjang", "Trapesium"], "correct": 2, "explanation": "Pintu punya 4 sisi dengan sisi tegak lebih panjang dari sisi mendatar.", "hint": "Tinggi dan lebarnya tidak sama panjang."}],
            
            science_ksnr: [{"id": "sk_1", "category": "Biologi Hewan", "difficulty": "STANDARD", "reasoning": "R3", "question": "Ikan yang diangkat dari kolam dan dibiarkan di daratan terbuka lama-kelamaan akan mati. Hal utama yang menyebabkan ikan tidak dapat bertahan hidup di darat adalah...", "options": ["Udara di darat tidak memiliki oksigen sama sekali", "Insang ikan saling menempel dan mengering sehingga tidak bisa mengambil oksigen", "Ikan tidak dapat bergerak mencari makan di darat", "Kulit ikan mengeras dan menolak udara luar"], "correct": 1, "explanation": "Insang butuh air untuk memisahkan lembarannya. Di darat, insang mengering dan menempel sehingga gagal mengikat oksigen.", "hint": "Pikirkan apa yang terjadi pada alat pernapasan ikan jika tidak ada air."}, {"id": "sk_2", "category": "Pertumbuhan Tanaman", "difficulty": "FOUNDATION", "reasoning": "R2", "question": "Dua pot tanaman diletakkan di halaman yang terik. Pot A disiram setiap pagi dan sore, sedangkan pot B tidak disiram selama dua minggu. Akibat yang terjadi pada tanaman pot B adalah...", "options": ["Tumbuh lebih tinggi karena menyerap banyak sinar", "Layu dan daunnya mengering karena kekurangan air", "Berbunga lebat karena tanahnya kering", "Akarnya membusuk karena kekurangan udara"], "correct": 1, "explanation": "Tanpa air, tanaman akan mengalami dehidrasi sehingga batang dan daun menjadi layu, mengering, lalu mati.", "hint": "Tanaman sangat membutuhkan air sebagai 'minumannya'."}, {"id": "sk_3", "category": "Sistem Pencernaan", "difficulty": "ADVANCED", "reasoning": "R4", "question": "Sapi merupakan hewan pemamah biak (ruminansia) yang memiliki sistem pencernaan khusus untuk mencerna rumput. Lambung pada tubuh sapi terbagi menjadi...", "options": ["Dua ruang lambung", "Tiga ruang lambung", "Empat ruang lambung", "Lima ruang lambung"], "correct": 2, "explanation": "Lambung ruminansia terbagi menjadi 4 ruang: rumen, retikulum, omasum, dan abomasum.", "hint": "Hewan pemamah biak punya banyak 'kamar' di perutnya."}, {"id": "sk_4", "category": "Panca Indera", "difficulty": "FOUNDATION", "reasoning": "R1", "question": "Saat kita mencicipi es krim atau permen, lidah kita dapat merasakan manis karena adanya tonjolan-tonjolan kecil di permukaan lidah yang dinamakan...", "options": ["Pori-pori", "Papila", "Kelenjar ludah", "Gigi seri"], "correct": 1, "explanation": "Papila adalah tonjolan kecil berisi kuncup pengecap untuk merasakan rasa manis, asin, asam, dan pahit.", "hint": "Bintik-bintik kecil yang terlihat jika kita menjulurkan lidah di depan cermin."}, {"id": "sk_5", "category": "Lingkungan", "difficulty": "STANDARD", "reasoning": "R3", "question": "Setelah botol selai kaca di dapur habis isinya, Ibu mencucinya sampai bersih lalu mengisinya kembali dengan gula pasir. Kebiasaan Ibu memanfaatkan kembali botol bekas merupakan tindakan...", "options": ["Reduce (Mengurangi)", "Reuse (Menggunakan kembali)", "Recycle (Mendaur ulang)", "Replace (Mengganti)"], "correct": 1, "explanation": "Menggunakan kembali barang bekas secara langsung tanpa mengubah bentuk aslinya disebut Reuse.", "hint": "Barangnya tidak dihancurkan, tapi dipakai lagi (re-use)."}, {"id": "sk_6", "category": "Daur Hidup", "difficulty": "STANDARD", "reasoning": "R3", "question": "Katak adalah hewan amfibi. Waktu masih kecil (berudu) ia bernapas menggunakan insang. Setelah mengalami metamorfosis menjadi katak dewasa, alat pernapasannya berubah menjadi...", "options": ["Insang dan paru-paru", "Paru-paru dan kulit", "Trakea dan insang", "Kulit dan pundi-pundi udara"], "correct": 1, "explanation": "Katak dewasa bernapas menggunakan paru-paru dan kulitnya yang selalu basah/berlendir.", "hint": "Kulit katak selalu basah untuk membantu proses ini."}, {"id": "sk_7", "category": "Energi", "difficulty": "STANDARD", "reasoning": "R3", "question": "Alat pendingin ruangan (AC) menggunakan listrik untuk memutar motor kompresor yang memompa cairan pendingin. Perubahan energi utama pada kompresor tersebut adalah...", "options": ["Listrik menjadi gerak (kinetik)", "Listrik menjadi panas", "Listrik menjadi cahaya", "Gerak menjadi listrik"], "correct": 0, "explanation": "Mesin kompresor berputar dan bergerak memompa cairan, yang berarti energi listrik diubah menjadi gerak.", "hint": "Motor di dalam AC harus berputar."}, {"id": "sk_8", "category": "Benda & Bayangan", "difficulty": "FOUNDATION", "reasoning": "R2", "question": "Pada pukul 16.00 sore, matahari berada di sebelah barat. Jika tiang bendera berdiri tegak, ke arah manakah bayangan tiang tersebut akan terbentuk memanjang?", "options": ["Timur", "Barat", "Utara", "Selatan"], "correct": 0, "explanation": "Bayangan selalu terbentuk di arah yang berlawanan dengan datangnya cahaya (Matahari di Barat, bayangan di Timur).", "hint": "Arah bayangan selalu berlawanan dengan posisi matahari."}, {"id": "sk_9", "category": "Penguapan", "difficulty": "STANDARD", "reasoning": "R3", "question": "Tiga saputangan basah dijemur bersamaan: (A) dilipat 4, (B) dilipat 2, (C) dibentangkan lebar tanpa dilipat. Saputangan manakah yang akan paling cepat kering?", "options": ["Saputangan A", "Saputangan B", "Saputangan C", "Semuanya kering bersamaan"], "correct": 2, "explanation": "Semakin luas permukaan yang terkena sinar matahari dan angin, semakin cepat proses penguapan air terjadi.", "hint": "Kain yang paling banyak terkena panas akan lebih cepat kering."}, {"id": "sk_10", "category": "Suhu & Panas", "difficulty": "STANDARD", "reasoning": "R3", "question": "Cangkir A berwarna hitam kusam, dan cangkir B berwarna putih mengilap. Jika keduanya dijemur di bawah matahari selama 1 jam, suhu air di cangkir manakah yang lebih panas?", "options": ["Cangkir A (Hitam)", "Cangkir B (Putih)", "Suhu keduanya sama", "Cangkir B akan mendidih"], "correct": 0, "explanation": "Warna gelap/hitam memiliki sifat menyerap panas matahari jauh lebih baik daripada warna terang yang memantulkan cahaya.", "hint": "Warna gelap lebih menyerap panas."}, {"id": "sk_11", "category": "Energi Alam", "difficulty": "FOUNDATION", "reasoning": "R2", "question": "Bahan Bakar Minyak (BBM) yang digunakan pada kendaraan bermotor berasal dari minyak bumi. Minyak bumi digolongkan sebagai sumber energi yang...", "options": ["Tidak dapat diperbarui", "Dapat diperbarui", "Ramah lingkungan", "Tersedia tanpa batas"], "correct": 0, "explanation": "Minyak bumi terbentuk dari fosil jutaan tahun lalu dan jumlahnya terbatas, sehingga tidak dapat diperbarui dengan cepat.", "hint": "Jika habis, kita butuh jutaan tahun untuk membuatnya lagi."}, {"id": "sk_12", "category": "Adaptasi Hewan", "difficulty": "ADVANCED", "reasoning": "R4", "question": "Iguana adalah hewan berdarah dingin (poikiloterm). la secara rutin berjemur di bawah sinar matahari pagi. Tujuan utama iguana berjemur adalah untuk...", "options": ["Mengeringkan sisiknya setelah mandi", "Menyerap panas untuk menaikkan suhu tubuh (termoregulasi)", "Bersembunyi dari pemangsa", "Mengubah warna kulitnya menjadi terang"], "correct": 1, "explanation": "Termoregulasi hewan berdarah dingin bergantung pada panas lingkungan. Mereka berjemur agar suhu tubuh naik dan bisa beraktivitas.", "hint": "Hewan berdarah dingin butuh kehangatan dari luar tubuhnya."}, {"id": "sk_13", "category": "Kesehatan Lingkungan", "difficulty": "STANDARD", "reasoning": "R2", "question": "Rumah yang sehat memerlukan ventilasi dan jendela yang cukup agar udara yang kaya karbon dioksida keluar, dan digantikan oleh udara segar dari luar yang kaya akan...", "options": ["Karbon monoksida", "Nitrogen", "Oksigen", "Helium"], "correct": 2, "explanation": "Udara segar dari luar sangat dibutuhkan oleh manusia karena mengandung banyak oksigen (O2) untuk bernapas.", "hint": "Gas yang sangat dibutuhkan manusia untuk bernapas."}, {"id": "sk_14", "category": "Konduktor Panas", "difficulty": "STANDARD", "reasoning": "R3", "question": "Mengapa bagian wadah utama wajan penggorengan sengaja dibuat dari bahan logam (seperti aluminium)?", "options": ["Karena logam tidak mudah meleleh", "Karena logam sangat ringan", "Karena logam adalah isolator yang baik", "Karena logam adalah konduktor panas yang sangat baik"], "correct": 3, "explanation": "Logam menghantarkan panas dari api kompor ke masakan dengan cepat dan merata, sehingga masakan cepat matang.", "hint": "Logam cepat sekali menyalurkan panas."}, {"id": "sk_15", "category": "Respon Tubuh", "difficulty": "ADVANCED", "reasoning": "R4", "question": "Ketika tubuh berada di daerah bersalju, tubuh akan otomatis merespon dengan cara menggigil. Apa tujuan tubuh mengalami menggigil saat kedinginan?", "options": ["Untuk menakuti hewan liar", "Kontraksi otot dengan cepat menghasilkan panas untuk menghangatkan tubuh", "Untuk membuang sisa air dari kulit", "Agar darah berhenti mengalir"], "correct": 1, "explanation": "Menggigil adalah respon otot yang berkontraksi dengan cepat tanpa sadar untuk memproduksi energi panas tambahan.", "hint": "Otot yang terus bergerak akan menghasilkan kehangatan."}, {"id": "sk_16", "category": "Perubahan Wujud", "difficulty": "STANDARD", "reasoning": "R3", "question": "Saat merebus telur, volume air dalam panci perlahan-lahan berkurang padahal panci tidak bocor. Ke manakah perginya air tersebut?", "options": ["Air diserap ke dalam cangkang telur", "Air berubah wujud menjadi gas (menguap) dan terbang ke udara", "Air membeku karena panas", "Air berubah menjadi benda padat"], "correct": 1, "explanation": "Air yang mendidih (100\u00b0C) akan mengalami perubahan wujud menjadi uap air (gas) yang lepas ke udara.", "hint": "Lihatlah asap putih yang naik ke atas saat air mendidih."}, {"id": "sk_17", "category": "Pemeliharaan Hewan", "difficulty": "FOUNDATION", "reasoning": "R2", "question": "Agar ikan peliharaan di akuarium tertutup dapat hidup sehat dan bernapas dengan baik, alat tambahan yang sangat penting untuk dipasang di dalam air adalah...", "options": ["Lampu pemanas", "Aerator (penghasil gelembung oksigen)", "Pohon mainan plastik", "Batu karang"], "correct": 1, "explanation": "Aerator berfungsi memecah permukaan air untuk melarutkan lebih banyak oksigen ke dalam air bagi ikan.", "hint": "Alat yang membuat gelembung-gelembung udara di dalam air."}, {"id": "sk_18", "category": "Tata Surya", "difficulty": "FOUNDATION", "reasoning": "R2", "question": "Di antara benda-benda langit berikut, manakah yang TIDAK menghasilkan cahayanya sendiri melainkan hanya memantulkan cahaya dari Matahari?", "options": ["Bintang", "Matahari", "Meteor", "Bulan"], "correct": 3, "explanation": "Bulan adalah satelit bumi yang gelap dan hanya tampak bersinar karena memantulkan pancaran sinar matahari.", "hint": "Benda ini muncul di malam hari tapi bukan bintang."}, {"id": "sk_19", "category": "Perbedaan Hewan", "difficulty": "STANDARD", "reasoning": "R3", "question": "Penyu adalah hewan yang menghabiskan hampir seluruh hidupnya di laut, namun ia BUKAN tergolong ikan. Perbedaan utama penyu dengan ikan adalah...", "options": ["Ikan memiliki sisik, penyu memiliki bulu", "Ikan hidup di air tawar, penyu di laut", "Ikan bernapas dengan insang, penyu bernapas dengan paru-paru", "Ikan tidak bertelur, penyu bertelur"], "correct": 2, "explanation": "Penyu adalah hewan reptil purba. Mereka memiliki paru-paru dan harus naik ke permukaan air untuk mengambil napas.", "hint": "Cara mereka bernapas sangat berbeda meskipun sama-sama di air."}, {"id": "sk_20", "category": "Material & Alat", "difficulty": "FOUNDATION", "reasoning": "R1", "question": "Ayah ingin membuat sebuah meja belajar dari balok kayu. Alat manakah yang TIDAK bisa digunakan untuk memotong kayu tersebut?", "options": ["Gergaji tangan", "Kapak", "Gergaji mesin", "Gunting kertas"], "correct": 3, "explanation": "Gunting kertas tidak memiliki ketajaman dan kekuatan untuk membelah material padat seperti balok kayu.", "hint": "Alat ini biasa kamu temukan di kotak pensil."}, {"id": "sk_21", "category": "Sifat Benda", "difficulty": "FOUNDATION", "reasoning": "R2", "question": "Air yang dituang dari botol ke dalam mangkuk bundar akan berubah bentuk menjadi bundar. Hal ini membuktikan sifat benda cair yaitu...", "options": ["Bentuk dan volumenya selalu berubah-ubah", "Bentuknya berubah mengikuti wadahnya", "Dapat ditarik seperti karet", "Ukurannya menyusut saat dipindah"], "correct": 1, "explanation": "Sifat utama benda cair adalah volumenya tetap, namun bentuknya fleksibel dan selalu menyesuaikan ruang wadahnya.", "hint": "Air selalu menyerupai tempatnya berada."}, {"id": "sk_22", "category": "Siklus Energi", "difficulty": "FOUNDATION", "reasoning": "R1", "question": "Pakaian yang basah kuyup sehabis dicuci akan menjadi kering saat dijemur di halaman. Pakaian bisa kering karena mendapat energi dari...", "options": ["Gaya tarik bumi", "Panas Matahari", "Baterai", "Angin kencang saja"], "correct": 1, "explanation": "Energi panas dan radiasi dari matahari membantu menguapkan air yang terperangkap pada serat-serat pakaian.", "hint": "Benda langit yang paling terang di siang hari."}, {"id": "sk_23", "category": "Benda Langit", "difficulty": "STANDARD", "reasoning": "R2", "question": "Saat malam yang cerah, Maya melihat ke langit dan menemukan bintang berkelap-kelip. Bintang termasuk benda langit karena...", "options": ["Dibuat oleh manusia dan diterbangkan ke atas", "Menghasilkan cahaya dan panasnya sendiri secara alami di alam semesta", "Memantulkan cahaya lampu dari bumi", "Berada sangat dekat dengan awan"], "correct": 1, "explanation": "Bintang (seperti Matahari) adalah bola gas raksasa bercahaya di alam semesta yang menghasilkan energinya sendiri.", "hint": "Sama seperti matahari, ia bersinar secara alami."}, {"id": "sk_24", "category": "Adaptasi Tumbuhan", "difficulty": "STANDARD", "reasoning": "R2", "question": "Tanaman eceng gondok dapat mengapung dan hidup dengan baik di ekosistem perairan seperti danau atau kolam. Bagian tubuhnya yang membantunya mengapung adalah...", "options": ["Akarnya yang menancap kuat di lumpur", "Batangnya yang menggembung berisi rongga udara", "Bunganya yang berwarna cerah", "Daunnya yang sangat berduri"], "correct": 1, "explanation": "Batang eceng gondok memiliki rongga-rongga udara (seperti pelampung) yang membuatnya ringan dan bisa mengapung di air.", "hint": "Ada sesuatu seperti pelampung berisi udara di badannya."}, {"id": "sk_25", "category": "Anatomi Hewan", "difficulty": "STANDARD", "reasoning": "R3", "question": "Hewan karnivora seperti harimau dan buaya memiliki susunan gigi yang sangat tajam dan runcing di bagian depan mulutnya. Gigi tajam ini disebut gigi taring dan berfungsi untuk...", "options": ["Mengunyah rumput perlahan", "Mencabik dan merobek daging mangsanya", "Menghancurkan buah-buahan keras", "Menakuti hewan lain saja"], "correct": 1, "explanation": "Gigi taring yang runcing berevolusi khusus pada predator karnivora untuk menembus, menahan, dan merobek serat daging.", "hint": "Gigi ini sangat tajam seperti pisau untuk daging."}],
            science_iksc: [{"id": "si_1", "category": "Astronomi", "difficulty": "STANDARD", "reasoning": "R3", "question": "Apa profesi atau sebutan bagi seorang ilmuwan yang khusus mempelajari ruang angkasa, planet, dan bintang-bintang?", "options": ["Fisikawan", "Astronom", "Matematikawan", "Pilot"], "correct": 1, "explanation": "Seorang Astronom (astronomer) adalah ilmuwan yang meneliti benda-benda langit dan fenomena di luar angkasa.", "hint": "Pekerjaan yang namanya mirip dengan kata astronot."}, {"id": "si_2", "category": "Tata Surya", "difficulty": "FOUNDATION", "reasoning": "R1", "question": "Di dalam sistem tata surya kita, planet apakah yang ukurannya paling kecil dan letaknya paling dekat dengan Matahari?", "options": ["Bumi", "Mars", "Jupiter", "Merkurius"], "correct": 3, "explanation": "Merkurius adalah planet pertama dan terkecil di tata surya kita.", "hint": "Planet ini berada di urutan pertama."}, {"id": "si_3", "category": "Tata Surya", "difficulty": "FOUNDATION", "reasoning": "R2", "question": "Planet ini dijuluki sebagai planet raksasa karena merupakan planet yang paling besar di seluruh Tata Surya. Planet apakah ini?", "options": ["Uranus", "Neptunus", "Venus", "Jupiter"], "correct": 3, "explanation": "Jupiter adalah planet gas raksasa dan merupakan planet terbesar dalam tata surya kita.", "hint": "Planet ini memiliki badai merah besar."}, {"id": "si_4", "category": "Biologi (Hewan)", "difficulty": "STANDARD", "reasoning": "R2", "question": "Kanguru adalah mamalia khas yang berasal dari benua Australia. Apa fungsi utama dari kantung yang ada di perut kanguru betina?", "options": ["Untuk menyimpan makanan musim dingin", "Untuk membawa air minum", "Untuk membesarkan dan melindungi bayi mereka", "Untuk mengumpulkan ranting sarang"], "correct": 2, "explanation": "Kanguru tergolong marsupial; bayinya yang sangat kecil lahir prematur lalu merangkak masuk ke kantung ibu untuk menyusu dan tumbuh.", "hint": "Kantung ini sangat nyaman untuk anak-anaknya."}, {"id": "si_5", "category": "Biologi (Serangga)", "difficulty": "FOUNDATION", "reasoning": "R2", "question": "Laba-laba merupakan predator kecil yang hebat. Apakah makanan utama laba-laba untuk bertahan hidup di alam bebas?", "options": ["Serangga (seperti lalat dan nyamuk)", "Biji-bijian dan buah", "Daun-daun hijau", "Nektar bunga"], "correct": 0, "explanation": "Laba-laba adalah karnivora yang memangsa serangga yang terperangkap dalam jaring mereka.", "hint": "Hewan yang sering beterbangan di sekitar rumah."}, {"id": "si_6", "category": "Perilaku Hewan", "difficulty": "STANDARD", "reasoning": "R3", "question": "Bagaimana cara kebanyakan laba-laba menangkap mangsanya di udara yang terbuka?", "options": ["Mereka melompat tinggi menyambar burung", "Mereka memintal jaring lengket yang rumit (spin webs)", "Mereka berlari sangat cepat di tanah", "Mereka menggali lubang jebakan di pasir"], "correct": 1, "explanation": "Laba-laba memproduksi sutra (jaring) lengket dari tubuhnya untuk menjebak serangga terbang.", "hint": "Mereka membuat 'perangkap' transparan di antara ranting pohon."}, {"id": "si_7", "category": "Sejarah Manusia", "difficulty": "STANDARD", "reasoning": "R3", "question": "Di zaman purba sebelum manusia menemukan cara menyalakan api, bagaimana cara mereka mengawetkan daging hasil buruan agar tidak cepat busuk?", "options": ["Dimasukkan ke dalam gua es", "Direbus dengan air panas", "Dibiarkan saja di luar", "Dikeringkan (dijemur) berhari-hari"], "correct": 3, "explanation": "Tanpa api, metode utama pengawetan makanan adalah dengan mengeringkannya di bawah sinar matahari.", "hint": "Dibiarkan sampai tidak ada airnya lagi."}, {"id": "si_8", "category": "Sejarah Alam", "difficulty": "STANDARD", "reasoning": "R2", "question": "Bencana kebakaran hutan pada masa purba bisa terjadi secara alami tanpa campur tangan manusia. Apa penyebab alami utama terjadinya kebakaran tersebut?", "options": ["Matahari yang terbenam", "Gesekan daun yang ditiup angin sepoi", "Petir yang menyambar atau erupsi letusan gunung berapi", "Banjir bandang dari hulu sungai"], "correct": 2, "explanation": "Petir dan lahar gunung berapi adalah sumber api alami pertama yang disaksikan oleh manusia purba.", "hint": "Sesuatu yang turun dari langit saat badai ekstrem."}, {"id": "si_9", "category": "Profesi & Alat", "difficulty": "ADVANCED", "reasoning": "R4", "question": "Setelah api ditemukan, manusia bisa memanaskan logam yang keras menjadi cair dan mengubahnya menjadi bentuk pedang, palu, atau kapak. Profesi apakah yang melakukan pekerjaan ini?", "options": ["Pembuat tembikar (Potter)", "Tukang Besi (Ironsmith/Blacksmith)", "Tukang Jagal (Butcher)", "Penjahit Kulit"], "correct": 1, "explanation": "Tukang besi atau ironsmith menggunakan perapian bersuhu sangat tinggi (forge) untuk melunakkan logam dan menempanya.", "hint": "Pekerjaan memukul logam panas dengan palu raksasa."}, {"id": "si_10", "category": "Keterampilan Purba", "difficulty": "STANDARD", "reasoning": "R3", "question": "Urutan langkah kerja yang benar saat seorang pembuat tembikar (potter) zaman dulu ingin membuat kendi dari tanah liat adalah...", "options": ["Membakar pot, membuat bentuk, lalu mengecat", "Mengecat, membakar, lalu membentuk", "Membentuk model dari tanah, membakarnya di oven, lalu mengecat", "Mengecat tanah liat, dibiarkan kering, lalu dibakar"], "correct": 2, "explanation": "Tanah liat yang basah harus dibentuk (model) terlebih dahulu, dikeraskan dengan panas (burn), baru diberi warna (paint).", "hint": "Tanah liat yang basah belum bisa dicat. Harus dikeraskan dulu."}, {"id": "si_11", "category": "Cuaca Ekstrem", "difficulty": "FOUNDATION", "reasoning": "R2", "question": "Badai angin berbentuk corong yang berputar dengan sangat cepat dari awan hingga menyentuh tanah dan bisa menghancurkan rumah disebut...", "options": ["Hujan Meteor", "Tornado (Angin Puting Beliung)", "Tsunami", "Aurora"], "correct": 1, "explanation": "Tornado adalah pusaran udara mematikan yang sangat kuat dan bisa mencabut pohon serta bangunan.", "hint": "Angin yang berputar menyerupai corong abu-abu."}, {"id": "si_12", "category": "Energi Alternatif", "difficulty": "STANDARD", "reasoning": "R2", "question": "Saat ini manusia menggunakan angin untuk memutar kincir raksasa (turbin angin). Tujuan utama memutar kincir raksasa ini adalah untuk...", "options": ["Meniup awan hujan agar tidak banjir", "Menghasilkan energi listrik yang bersih (tanpa polusi)", "Menarik pesawat terbang agar turun", "Memompa air laut ke darat"], "correct": 1, "explanation": "Turbin angin modern merupakan pembangkit listrik yang ramah lingkungan karena tidak membakar bahan bakar fosil.", "hint": "Untuk menyalakan lampu di kota tanpa asap hitam."}, {"id": "si_13", "category": "Kekuatan Alam", "difficulty": "STANDARD", "reasoning": "R3", "question": "Pada abad pertengahan sebelum mesin uap ditemukan, bagaimana cara perahu layar berukuran raksasa bisa bergerak menyeberangi lautan?", "options": ["Ditarik oleh sekawanan lumba-lumba", "Layar kain dikembangkan agar menangkap gaya dorong angin", "Para pelaut mendayung 24 jam penuh", "Menggunakan mesin yang diputar dengan air hujan"], "correct": 1, "explanation": "Kain layar (sails) menangkap hembusan angin yang kemudian memberikan dorongan besar pada kapal.", "hint": "Kain raksasanya berfungsi seperti layang-layang di atas air."}, {"id": "si_14", "category": "Keadaan Materi", "difficulty": "FOUNDATION", "reasoning": "R1", "question": "Air di bumi ada dalam tiga wujud: cair, gas, dan padat. Manakah yang merupakan contoh air dalam bentuk wujud padat (solid)?", "options": ["Salju, es, dan hujan es (hail)", "Awan gelap dan embun pagi", "Uap panas dari cerek", "Genangan air hujan di jalan"], "correct": 0, "explanation": "Suhu yang sangat rendah (di bawah 0\u00b0C) membekukan air cair menjadi benda padat.", "hint": "Bentuk air ini sangat dingin dan keras."}, {"id": "si_15", "category": "Sumber Energi", "difficulty": "STANDARD", "reasoning": "R2", "question": "Bendungan yang menampung aliran sungai deras (PLTA) dibangun oleh manusia dengan tujuan utama untuk...", "options": ["Membuat tempat berenang raksasa", "Menghasilkan listrik dengan memutarkan turbin air", "Menangkap lebih banyak ikan", "Menyimpan air untuk memadamkan gunung berapi"], "correct": 1, "explanation": "Pembangkit Listrik Tenaga Air (PLTA) menggunakan gaya kinetik air terjun/aliran deras untuk memutar generator.", "hint": "Ujung dari alat ini menghasilkan listrik."}, {"id": "si_16", "category": "Bahaya Alam", "difficulty": "ADVANCED", "reasoning": "R4", "question": "Jika terjadi kebakaran di hutan yang kering, hembusan angin kencang justru sangat berbahaya karena...", "options": ["Angin dapat mendinginkan api terlalu cepat", "Angin menyuplai oksigen segar dan meniupkan api ke wilayah baru yang belum terbakar", "Angin akan mematikan api secara mendadak", "Angin membuat asapnya turun kembali ke tanah"], "correct": 1, "explanation": "Oksigen sangat dibutuhkan oleh api (pembakaran). Angin menambah suplai oksigen dan menyebarkan percikan api ke sekitarnya.", "hint": "Api sangat menyukai udara segar."}, {"id": "si_17", "category": "Pengukuran Waktu", "difficulty": "STANDARD", "reasoning": "R3", "question": "Orang-orang zaman dahulu mengamati fase perubahan bentuk Bulan dari 'Bulan Baru' hingga 'Bulan Purnama' untuk menghitung...", "options": ["Berapa jumlah bintang di langit", "Berapa lama waktu untuk hitungan minggu dan bulan (Kalender)", "Kedalaman laut saat itu", "Kapan gunung berapi akan meletus"], "correct": 1, "explanation": "Siklus perputaran bulan (sekitar 29,5 hari) adalah dasar dari penanggalan kalender (bulan dan minggu).", "hint": "Dari mana asal kata 'Bulan' pada Januari atau Februari?"}, {"id": "si_18", "category": "Pengukuran Waktu", "difficulty": "FOUNDATION", "reasoning": "R2", "question": "Bumi memerlukan waktu tertentu untuk melakukan satu putaran penuh yang menciptakan siklus siang dan malam. Berapa lama waktu yang dibutuhkan untuk 1 hari penuh?", "options": ["12 Jam", "24 Jam", "30 Jam", "48 Jam"], "correct": 1, "explanation": "Rotasi Bumi pada porosnya membutuhkan waktu 24 jam (yang kita sebut sebagai 1 hari).", "hint": "Ada 12 jam di jam dinding, putar 2 kali."}, {"id": "si_19", "category": "Keselamatan", "difficulty": "FOUNDATION", "reasoning": "R1", "question": "Api bisa sangat berbahaya dan menghanguskan rumah. Di manakah anak-anak kecil diperbolehkan bermain dengan korek api?", "options": ["Di dalam rumah", "Di taman", "Di sekolah", "Tidak di mana pun (sangat dilarang)"], "correct": 3, "explanation": "Api bukan mainan. Kelalaian kecil dengan korek api dapat memicu kebakaran mematikan, jadi anak-anak dilarang bermain korek api di mana pun.", "hint": "Api bukan sebuah mainan!"}, {"id": "si_20", "category": "Benda Langit", "difficulty": "STANDARD", "reasoning": "R2", "question": "Manakah musim yang ditandai dengan ciri-ciri dedaunan di pohon menguning, berubah warna menjadi oranye/merah, lalu rontok berguguran ke tanah?", "options": ["Musim Semi (Spring)", "Musim Panas (Summer)", "Musim Dingin (Winter)", "Musim Gugur (Autumn)"], "correct": 3, "explanation": "Pada musim gugur (autumn/fall), pohon-pohon deciduous menggugurkan daunnya untuk persiapan menghemat energi di musim dingin.", "hint": "Musim ketika daun-daun berguguran (fall)."}, {"id": "si_21", "category": "Astronomi Dasar", "difficulty": "STANDARD", "reasoning": "R3", "question": "Bulan terkadang terlihat berbentuk sabit, lalu dua minggu kemudian menjadi bulat penuh. Apa penyebab asli perubahan bentuk bulan yang kita lihat dari bumi?", "options": ["Awan menutupi sebagian bulan", "Bulan membesar dan mengecil", "Perubahan posisi antara Bumi, Bulan, dan pantulan cahaya Matahari", "Ada bayangan bintang di depan bulan"], "correct": 2, "explanation": "Bentuk (fase) bulan yang kita lihat tergantung seberapa banyak permukaan bulan yang memantulkan sinar matahari dari sudut pandang kita di Bumi.", "hint": "Posisi bulan yang berputar mengubah pantulan
