rkan.", "explanation": "Tugas utama tukang pos (postman) adalah mengantar (delivers) surat."}, {"id": "e13", "category": "Riddles", "difficulty": "FOUNDATION", "reasoning": "R2", "question": "I am a red fruit. I am crunchy and sweet to eat. Who am I?", "options": ["strawberry", "apple", "grape", "watermelon"], "correct": 1, "hint": "Buah ini renyah saat digigit.", "explanation": "Buah merah yang renyah (crunchy) dan manis adalah apel (apple)."}, {"id": "e14", "category": "Riddles", "difficulty": "FOUNDATION", "reasoning": "R2", "question": "I am a flying insect with beautiful, colorful wings. What am I?", "options": ["bird", "butterfly", "fly", "mosquito"], "correct": 1, "hint": "Serangga ini berasal dari kepompong.", "explanation": "Serangga terbang dengan sayap berwarna-warni adalah kupu-kupu (butterfly)."}, {"id": "e15", "category": "Places", "difficulty": "STANDARD", "reasoning": "R2", "question": "I am a quiet place where hundreds of books are kept for reading. What am I?", "options": ["bookstore", "museum", "library", "school"], "correct": 2, "hint": "Tempat ini sangat tenang dan dipakai untuk meminjam buku.", "explanation": "Tempat tenang untuk membaca dan menyimpan banyak buku adalah perpustakaan (library)."}, {"id": "e16", "category": "Plurals", "difficulty": "ADVANCED", "reasoning": "R3", "question": "Choose the correct plural: The (child) was playing happily with a plastic (toy).", "options": ["childs / toyes", "children / toys", "childrens / toies", "childes / toys"], "correct": 1, "hint": "Child berubah bentuk secara tidak beraturan. Toy hanya ditambah 's'.", "explanation": "Bentuk jamak dari 'child' adalah 'children' (irregular), dan 'toy' menjadi 'toys'."}, {"id": "e17", "category": "Plurals", "difficulty": "ADVANCED", "reasoning": "R3", "question": "Choose the correct plural: The tiny (mouse) quickly scurried inside the dark (hole).", "options": ["mouses / holes", "mice / holes", "mices / holees", "mice / holies"], "correct": 1, "hint": "Mouse berubah bentuk menjadi kata yang sama sekali berbeda.", "explanation": "Bentuk jamak dari 'mouse' adalah 'mice' (irregular), dan 'hole' menjadi 'holes'."}, {"id": "e18", "category": "Places", "difficulty": "STANDARD", "reasoning": "R2", "question": "A place of worship for Moslems is called a .............", "options": ["temple", "church", "mosque", "hospital"], "correct": 2, "hint": "Tempat ibadah umat Islam.", "explanation": "Tempat ibadah (place of worship) untuk umat Islam adalah masjid (mosque)."}, {"id": "e19", "category": "Phrases", "difficulty": "STANDARD", "reasoning": "R3", "question": "Can you ............. me a favor?", "options": ["help", "make", "ask", "do"], "correct": 3, "hint": "Ungkapan tetap (idiom) untuk meminta tolong.", "explanation": "Dalam bahasa Inggris, frasa untuk meminta bantuan adalah 'do me a favor'."}, {"id": "e20", "category": "Prepositions", "difficulty": "FOUNDATION", "reasoning": "R2", "question": "A: Where do you live?\nB: I live ............. a big house.", "options": ["on", "in", "under", "at"], "correct": 1, "hint": "Kamu tinggal *di dalam* rumah.", "explanation": "Preposisi yang tepat untuk berada di dalam sebuah bangunan adalah 'in'."}, {"id": "e21", "category": "Grammar", "difficulty": "STANDARD", "reasoning": "R2", "question": "Look! The birds ............. in the sky.", "options": ["is flying", "are flying", "flying", "flies"], "correct": 1, "hint": "Birds itu lebih dari satu (jamak), dan sedang terjadi sekarang.", "explanation": "Karena birds jamak, kita memakai 'are', dan karena sedang terjadi kita pakai V-ing (are flying)."}, {"id": "e22", "category": "Grammar", "difficulty": "STANDARD", "reasoning": "R2", "question": "Complete the sentence: There ............. some wild flowers.", "options": ["is", "have", "are", "was"], "correct": 2, "hint": "Flowers adalah bentuk jamak (banyak).", "explanation": "Untuk benda jamak (flowers), kata hubung yang digunakan adalah 'are'."}, {"id": "e23", "category": "Vocabulary", "difficulty": "FOUNDATION", "reasoning": "R1", "question": "A dog that is white in color is a .............", "options": ["white dog", "black dog", "red dog", "brown dog"], "correct": 0, "hint": "Warna selalu diletakkan sebelum nama benda.", "explanation": "Dalam bahasa Inggris, sifat/warna ditaruh sebelum bendanya: white dog."}, {"id": "e24", "category": "Family", "difficulty": "FOUNDATION", "reasoning": "R1", "question": "My father's brother is my .............", "options": ["uncle", "aunt", "cousin", "grandfather"], "correct": 0, "hint": "Saudara laki-laki ayah atau ibu disebut paman.", "explanation": "Saudara laki-laki ayah (paman) dalam bahasa Inggris adalah uncle."}, {"id": "e25", "category": "Time", "difficulty": "STANDARD", "reasoning": "R3", "question": "He goes to school at a quarter to six. What time is it?", "options": ["05:15", "06:15", "05:45", "06:45"], "correct": 2, "hint": "A quarter to six artinya 15 menit *menuju* jam 6.", "explanation": "'A quarter to six' berarti 15 menit sebelum jam 6, yaitu pukul 05:45."}]
        };

        // ==========================================
        // ALGORITMA 5X RANDOM SYSTEM
        // ==========================================
        const generateDynamicQuiz = (subjectKey) => {
            const namesM = ["Andi", "Budi", "Dodi", "Edo", "Fandi"];
            const namesF = ["Ria", "Siti", "Nala", "Lina", "Tini"];
            const fruitsID = ["apel", "jeruk", "mangga", "pisang", "stroberi"];
            const fruitsEN = ["apples", "oranges", "mangoes", "bananas", "grapes"];
            
            let originalQuestions = dbQuestions[subjectKey] || dbQuestions.math;
            let selectedQuestions = [];

            originalQuestions.forEach(q => {
                let v = Math.floor(Math.random() * 5); // 0 to 4
                let newQ = JSON.parse(JSON.stringify(q));
                
                if (v > 0) {
                    let replaceText = (text) => {
                        if(!text) return text;
                        return text.replace(/Andi/g, namesM[v]).replace(/Budi/g, namesM[(v+1)%5])
                                   .replace(/Ria/g, namesF[v]).replace(/Nala/g, namesF[(v+1)%5])
                                   .replace(/apples/g, fruitsEN[v]).replace(/apel/g, fruitsID[v]);
                    };
                    newQ.question = replaceText(newQ.question);
                    if(newQ.explanation) newQ.explanation = replaceText(newQ.explanation);
                    if(newQ.hint) newQ.hint = replaceText(newQ.hint);
                    newQ.options = newQ.options.map(opt => replaceText(opt));
                }
                
                // Mengacak Urutan Opsi Jawaban (A, B, C, D)
                let optsWithIndex = newQ.options.map((opt, idx) => ({ text: opt, originalIndex: idx }));
                optsWithIndex.sort(() => Math.random() - 0.5);
                let newCorrectIndex = optsWithIndex.findIndex(opt => opt.originalIndex === newQ.correct);
                
                newQ.options = optsWithIndex.map(opt => opt.text);
                newQ.correct = newCorrectIndex;
                selectedQuestions.push(newQ);
            });
            
            // Mengacak urutan soal secara keseluruhan
            selectedQuestions.sort(() => Math.random() - 0.5);
            return selectedQuestions.slice(0, 25);
        };

        // ==========================================
        // COMPONENT: SCRATCHPAD (Papan Coretan)
        // ==========================================
        const Scratchpad = ({ isOpen, onClose }) => {
            const canvasRef = useRef(null);
            const [isDrawing, setIsDrawing] = useState(false);

            useEffect(() => {
                if (isOpen && canvasRef.current) {
                    const canvas = canvasRef.current;
                    canvas.width = canvas.offsetWidth;
                    canvas.height = canvas.offsetHeight;
                    const ctx = canvas.getContext('2d');
                    ctx.lineCap = 'round';
                    ctx.lineWidth = 3;
                    ctx.strokeStyle = '#3b82f6';
                }
            }, [isOpen]);

            const startDrawing = (e) => {
                const canvas = canvasRef.current;
                const ctx = canvas.getContext('2d');
                const rect = canvas.getBoundingClientRect();
                const clientX = e.touches ? e.touches[0].clientX : e.clientX;
                const clientY = e.touches ? e.touches[0].clientY : e.clientY;
                ctx.beginPath();
                ctx.moveTo(clientX - rect.left, clientY - rect.top);
                setIsDrawing(true);
            };

            const draw = (e) => {
                if (!isDrawing) return;
                e.preventDefault();
                const canvas = canvasRef.current;
                const ctx = canvas.getContext('2d');
                const rect = canvas.getBoundingClientRect();
                const clientX = e.touches ? e.touches[0].clientX : e.clientX;
                const clientY = e.touches ? e.touches[0].clientY : e.clientY;
                ctx.lineTo(clientX - rect.left, clientY - rect.top);
                ctx.stroke();
            };

            const stopDrawing = () => {
                setIsDrawing(false);
            };

            const clearCanvas = () => {
                const canvas = canvasRef.current;
                const ctx = canvas.getContext('2d');
                ctx.clearRect(0, 0, canvas.width, canvas.height);
            };

            if (!isOpen) return null;

            return (
                <div className="fixed inset-0 z-50 bg-black/60 backdrop-blur-sm flex items-center justify-center p-4 fade-in">
                    <div className="bg-white w-full max-w-2xl rounded-[2rem] shadow-2xl p-5 flex flex-col h-[80vh]">
                        <div className="flex justify-between items-center mb-4">
                            <h3 className="font-bold text-slate-800 text-lg flex items-center gap-2">
                                <i className="fa-solid fa-pen-to-square text-amber-500"></i> Papan Coretan
                            </h3>
                            <button onClick={onClose} className="w-8 h-8 bg-slate-100 hover:bg-slate-200 rounded-full flex items-center justify-center text-slate-600">
                                <i className="fa-solid fa-xmark"></i>
                            </button>
                        </div>
                        <div className="flex-1 bg-amber-50/50 rounded-2xl border-2 border-dashed border-amber-200 relative overflow-hidden">
                            <canvas 
                                ref={canvasRef} 
                                onMouseDown={startDrawing} onMouseMove={draw} onMouseUp={stopDrawing} onMouseLeave={stopDrawing}
                                onTouchStart={startDrawing} onTouchMove={draw} onTouchEnd={stopDrawing}
                                className="w-full h-full cursor-crosshair"
                            ></canvas>
                        </div>
                        <div className="mt-4 flex justify-end">
                            <button onClick={clearCanvas} className="bg-slate-100 hover:bg-slate-200 text-slate-700 font-bold py-2 px-6 rounded-xl flex items-center gap-2">
                                <i className="fa-solid fa-trash-can"></i> Bersihkan
                            </button>
                        </div>
                    </div>
                </div>
            );
        };

        // ==========================================
        // QUIZ ENGINE (Hanya Evaluasi)
        // ==========================================
        const QuizEngine = ({ subject, onComplete, onExit }) => {
            const [questions, setQuestions] = useState([]);
            const [currentIdx, setCurrentIdx] = useState(0);
            const [answers, setAnswers] = useState({});
            const [isFinished, setIsFinished] = useState(false);
            const [results, setResults] = useState(null);
            const [showHint, setShowHint] = useState(false);
            const [isScratchpadOpen, setScratchpadOpen] = useState(false);

            useEffect(() => {
                const dynamicQuestions = generateDynamicQuiz(subject);
                setQuestions(dynamicQuestions);
            }, [subject]);

            const handleAnswer = (optIdx) => {
                setAnswers(prev => ({ ...prev, [currentIdx]: optIdx }));
                setShowHint(false);
            };

            const clearAnswer = () => {
                setAnswers(prev => {
                    const newAns = { ...prev };
                    delete newAns[currentIdx];
                    return newAns;
                });
            };

            const finishQuiz = async () => {
                let correctCount = 0;
                let wrongCount = 0;
                let blankCount = 0;

                questions.forEach((q, idx) => {
                    if (answers[idx] === undefined) {
                        blankCount++;
                    } else if (answers[idx] === q.correct) {
                        correctCount++;
                    } else {
                        wrongCount++;
                    }
                });
                
                const rawScore = (correctCount * 4) + (wrongCount * -1) + (blankCount * 0);
                const maxPossibleRaw = questions.length * 4;
                let normalizedScore = Math.max(0, Math.round((rawScore / maxPossibleRaw) * 100));
                if(isNaN(normalizedScore)) normalizedScore = 0;

                const finalResultData = { 
                    score: normalizedScore, 
                    raw_score: rawScore,
                    correct: correctCount, 
                    wrong: wrongCount,
                    blank: blankCount,
                    total: questions.length, 
                    subject,
                    date: new Date().toLocaleDateString()
                };

                try {
                    const { data, error } = await supabase.from('quiz_history').insert([
                        { 
                            subject: subject.toLowerCase(), 
                            score: normalizedScore, 
                            raw_score: rawScore 
                        }
                    ]).select();
                    
                    if (error) {
                        alert("GAGAL MENGIRIM KE CLOUD: " + error.message);
                    }
                } catch (err) {
                    alert("KONEKSI CLOUD TERPUTUS: " + err.message);
                }

                setResults(finalResultData);
                setIsFinished(true);
                confetti({ particleCount: 150, spread: 80, origin: {y: 0.6} });
            };

            if (questions.length === 0) return <div className="p-8 text-center font-bold text-slate-500">Merapikan soal dari database...</div>;

            if (isFinished) {
                return (
                    <div className="min-h-screen bg-slate-50 flex flex-col p-4 sm:p-6 overflow-y-auto fade-in">
                        <div className="max-w-3xl w-full mx-auto">
                            <div className="bg-white rounded-[2rem] shadow-xl p-8 border border-slate-100 text-center mb-6">

        // STUDENT DASHBOARD

            const [activeMenu, setActiveMenu] = useState('Dashboard');
            const [history, setHistory] = useState([]);
            const [isLoading, setIsLoading] = useState(true);

            useEffect(() => {
                const fetchHistory = async () => {
                    try {
                        const { data, error } = await supabase
                            .from('quiz_history')
                            .select('id, subject, score, created_at')
                            .order('created_at', { ascending: false });
                        
                        if (!error) setHistory(data || []);
                    } catch (err) {
                        console.error(err);
                    } finally {
                        setIsLoading(false);
                    }
                };
                fetchHistory();
            }, [activeMenu]);

            const hasCompletedAny = history.length > 0;

            const calcScore = (subj) => {
                const subjHist = history.filter(h => h.subject.toLowerCase() === subj.toLowerCase());
                if (subjHist.length === 0) return 0;
                return Math.round(subjHist.reduce((acc, curr) => acc + curr.score, 0) / subjHist.length);
            };

            const overallScore = hasCompletedAny ? Math.round(history.reduce((acc, curr) => acc + curr.score, 0) / history.length) : 0;
            
            const competencyVals = {
                math: calcScore('math'),
                science: calcScore('science'),
                english: calcScore('english')
            };

            const difficultyVals = {
                low: hasCompletedAny ? Math.min(100, Math.round(overallScore + ((100 - overallScore) * 0.5))) : 0,
                mid: hasCompletedAny ? overallScore : 0,
                high: hasCompletedAny ? Math.max(0, Math.round(overallScore - ((100 - overallScore) * 0.5))) : 0,
            };

            const getStrongestSubject = () => {
                if (!hasCompletedAny) return "-";
                const max = Math.max(competencyVals.math, competencyVals.science, competencyVals.english);
                if (max === competencyVals.math) return "Mathematics";
                if (max === competencyVals.science) return "Science";
                return "English";
            };

            const getWeakestSubject = () => {
                if (!hasCompletedAny) return "-";
                const min = Math.min(competencyVals.math, competencyVals.science, competencyVals.english);
                if (min === competencyVals.math) return "Mathematics";
                if (min === competencyVals.science) return "Science";
                return "English";
            };

            const narrativeText = hasCompletedAny
                ? `Berdasarkan riwayat evaluasi, progres akademik Aqsa secara keseluruhan berada pada tingkat ${overallScore >= 80 ? 'Sangat Memuaskan' : overallScore >= 60 ? 'Berkembang Baik' : 'Perlu Perhatian'} dengan skor rata-rata ${overallScore}. Pemahaman pada konsep dasar (Low) mencapai proporsi ${difficultyVals.low}%. Penguasaan pada soal menengah dan aplikasi (Mid) berada di angka ${difficultyVals.mid}%, ${difficultyVals.high >= 90 ? 'dan sangat impresif dalam' : 'sementara ruang berkembang masih terlihat pada'} penyelesaian soal HOTS atau tingkat tinggi (High) yang saat ini berada di ${difficultyVals.high}%. Saat ini, subjek terkuat adalah ${getStrongestSubject()}, disarankan untuk terus berlatih pada ${getWeakestSubject()} guna meratakan kompetensi secara komprehensif.`
                : "Belum ada data evaluasi yang cukup untuk menarik kesimpulan. Silakan kerjakan beberapa ujian mandiri terlebih dahulu untuk melihat analisis komprehensif di sini.";


            const menus = [
                { id: 'Dashboard', icon: 'fa-table-columns' },
                { id: 'Assessments', icon: 'fa-pen-to-square' },
                { id: 'Settings', icon: 'fa-gear' }
            ];

            return (
                <div className="min-h-screen bg-slate-900 sm:p-4 md:p-6 flex fade-in">

                        <aside className="w-full lg:w-64 bg-slate-800 text-white p-5 flex flex-col lg:flex-shrink-0 z-20">

                                    </button>
                                ))}
                            </nav>

                        <main className="flex-1 bg-slate-50 overflow-y-auto">

                                            <p className="text-slate-500 text-sm max-w-md">
                                                {isLoading ? "Memuat data nilai dari cloud..." : hasCompletedAny ? `Kemampuan analisismu semakin tajam. Skor rata-rata keseluruhanmu saat ini adalah ${overallScore}.` : "Selamat datang di Platform Akademik. Mari mulai evaluasi pertamamu!"}

                                    <div className="grid grid-cols-1 md:grid-cols-3 gap-6 mb-8">

                                                    {item.subs.map((sub, j) => (

                                                            <div className="flex justify-between text-[10px] font-bold mb-1">
                                                                <span className="text-slate-500 uppercase">{sub.name}</span>
                                                                <span className="text-slate-700">{sub.val}%</span>
                                                            </div>
                                                            <div className="w-full bg-slate-100 rounded-full h-1.5 overflow-hidden">
                                                                <div className="h-full rounded-full transition-all duration-1000" style={{width: `${sub.val}%`, backgroundColor: item.color}}></div>
                                                            </div>
                                                        </div>
                                                    ))}
                                                </div>
                                            </div>

                                    <div className="grid grid-cols-1 lg:grid-cols-2 gap-6 mt-8">
                                        <div className="bg-white rounded-3xl p-6 md:p-8 border border-slate-100 shadow-sm">
                                            <h3 className="font-bold text-slate-800 mb-4 font-display text-lg"><i className="fa-solid fa-file-lines text-blue-500 mr-2"></i>Kesimpulan Komprehensif</h3>

                                                {narrativeText}

                                            <h3 className="font-bold text-slate-800 mb-4 font-display text-lg"><i className="fa-solid fa-layer-group text-purple-500 mr-2"></i>Penguasaan Tingkat Kesulitan</h3>
                                            <div className="space-y-5 mt-6">
                                                <div className="flex items-center gap-4">
                                                    <div className="w-16 font-bold text-slate-700 text-sm">Low</div>
                                                    <div className="flex-1 bg-slate-100 rounded-full h-3 overflow-hidden">
                                                        <div className="h-full bg-emerald-500 rounded-full transition-all duration-1000" style={{width: `${difficultyVals.low}%`}}></div>
                                                    </div>
                                                    <div className="w-10 text-right font-bold text-emerald-600 text-sm">{difficultyVals.low}%</div>

                                                <div className="flex items-center gap-4">
                                                    <div className="w-16 font-bold text-slate-700 text-sm">Mid</div>
                                                    <div className="flex-1 bg-slate-100 rounded-full h-3 overflow-hidden">
                                                        <div className="h-full bg-blue-500 rounded-full transition-all duration-1000" style={{width: `${difficultyVals.mid}%`}}></div>
                                                    </div>
                                                    <div className="w-10 text-right font-bold text-blue-600 text-sm">{difficultyVals.mid}%</div>
                                                </div>
                                                <div className="flex items-center gap-4">
                                                    <div className="w-16 font-bold text-slate-700 text-sm">High</div>
                                                    <div className="flex-1 bg-slate-100 rounded-full h-3 overflow-hidden">
                                                        <div className="h-full bg-rose-500 rounded-full transition-all duration-1000" style={{width: `${difficultyVals.high}%`}}></div>

                                            <i className="fa-solid fa-flask absolute -right-4 -bottom-4 text-6xl opacity-10"></i>
                                            <h3 className="font-bold text-lg font-display">Science Eval</h3>
                                            <p className="text-xs text-emerald-200 mt-1">Mulai Ujian</p>
                                        </button>
                                        <button onClick={() => onStartQuiz('english')} className="bg-rose-600 text-white p-6 rounded-3xl shadow-md hover:bg-rose-700 transition text-left relative overflow-hidden">
                                            <i className="fa-solid fa-globe absolute -right-4 -bottom-4 text-6xl opacity-10"></i>
                                            <h3 className="font-bold text-lg font-display">English Eval</h3>
                                            <p className="text-xs text-rose-200 mt-1">Mulai Ujian</p>
                                        </button>
                                    </div>

                                    <h3 className="font-bold text-slate-800 mb-4 font-display">Riwayat Ujian (Cloud Sync)</h3>
                                    <div className="bg-white rounded-2xl border border-slate-200 overflow-hidden">
                                        {isLoading ? (
                                            <div className="p-8 text-center text-slate-400 italic">Memuat data dari database...</div>
                                        ) : hasCompletedAny ? (
                                            <table className="w-full text-left text-sm">
                                                <thead className="bg-slate-50 text-slate-500 font-bold border-b border-slate-200">
                                                    <tr>
                                                        <th className="px-4 py-3">Tanggal Waktu</th>

                                                        <th className="px-4 py-3 text-right">Skor (100)</th>
                                                    </tr>
                                                </thead>
                                                <tbody>
                                                    {history.map((h, i) => {
                                                        const dateObj = new Date(h.created_at);
                                                        const dateStr = dateObj.toLocaleDateString('id-ID') + ' ' + dateObj.toLocaleTimeString('id-ID', {hour: '2-digit', minute:'2-digit'});
                                                        return (
                                                            <tr key={h.id || i} className="border-b border-slate-100 last:border-0 hover:bg-slate-50">
                                                                <td className="px-4 py-3 text-slate-500">{dateStr}</td>
                                                                <td className="px-4 py-3 font-semibold uppercase">{h.subject}</td>
                                                                <td className="px-4 py-3 text-right font-black text-slate-800">{h.score}</td>
                                                            </tr>
                                                        );
                                                    })}
                                                </tbody>
                                            </table>
                                        ) : (
                                            <div className="p-8 text-center text-slate-400 italic">Belum ada riwayat ujian tersimpan di cloud.</div>
                                        )}
                                    </div>
                                </div>
                            )}

                            {activeMenu === 'Settings' && (
                                <div className="p-6 md:p-8 fade-in max-w-xl">
                                    <h2 className="text-2xl font-display font-bold text-slate-800 mb-6">Settings</h2>
                                    <div className="bg-white rounded-3xl p-6 border border-slate-100 shadow-sm space-y-4">
                                        <div className="flex justify-between items-center pb-4 border-b border-slate-100">
                                            <div>
                                                <div className="font-bold text-slate-800">Akun Siswa</div>
                                                <div className="text-xs text-slate-500">Aqsa (Grade 1-2)</div>
                                            </div>
                                        </div>
                                        <div className="flex justify-between items-center pb-4 border-b border-slate-100">
                                            <div>
                                                <div className="font-bold text-slate-800">Koneksi Supabase</div>
                                                <div className="text-xs text-emerald-500 font-bold"><i className="fa-solid fa-circle text-[8px] mr-1"></i> Terhubung (Cloud Sync Active)</div>
                                            </div>
                                        </div>
                                        <div className="pt-2">
                                            <button onClick={onLogout} className="w-full py-3 bg-rose-50 text-rose-600 hover:bg-rose-100 font-bold rounded-xl transition flex items-center justify-center gap-2">
                                                <i className="fa-solid fa-right-from-bracket"></i> Keluar dari Aplikasi
                                            </button>
                                        </div>
                                    </div>
                                </div>
                            )}
                        </main>
                    </div>
                </div>
            );
        };

        // ==========================================
        // ADMIN DASHBOARD
        // ==========================================
        const AdminDashboard = ({ onLogout }) => {
            return (
                <div className="min-h-screen bg-slate-100 flex items-center justify-center p-4 fade-in">
                    <div className="bg-white rounded-[2rem] shadow-xl p-8 max-w-md w-full text-center border border-slate-200">
                        <div className="w-16 h-16 bg-slate-100 text-slate-400 rounded-full mx-auto mb-4 flex items-center justify-center text-2xl">
                            <i className="fa-solid fa-screwdriver-wrench"></i>
                        </div>
                        <h2 className="text-2xl font-display font-bold text-slate-800 mb-2">Admin Dashboard</h2>
                        <p className="text-slate-500 text-sm mb-8">Modul Admin dipindahkan ke service terpisah sesuai arsitektur. Data nilai siswa dapat dilihat langsung melalui Supabase Database.</p>
                        <button onClick={onLogout} className="bg-slate-800 hover:bg-slate-900 text-white font-bold py-3 px-8 rounded-xl transition w-full">Kembali</button>
                    </div>
                </div>
            );
        };

        // ==========================================
        // MAIN APP ROUTER
        // ==========================================
        const App = () => {
            const [userRole, setUserRole] = useState(null);
            const [view, setView] = useState('DASHBOARD');
            const [selectedSubject, setSelectedSubject] = useState(null);

            if (!userRole) {
                return (
                    <div className="min-h-screen flex items-center justify-center bg-slate-100 p-4 fade-in">
                        <div className="bg-white p-8 md:p-12 rounded-[2rem] shadow-xl max-w-md w-full text-center border border-slate-200">
                            <div className="w-16 h-16 bg-gradient-to-br from-blue-500 to-indigo-600 rounded-2xl mx-auto mb-6 flex items-center justify-center shadow-lg">
                                <i className="fa-solid fa-rocket text-2xl text-white"></i>
                            </div>
                            <h1 className="text-3xl font-display font-bold text-slate-800 mb-2">To The Mars</h1>
                            <p className="text-blue-600 font-bold text-xs tracking-widest uppercase mb-10">Tools Learning (v4.0)</p>
                            <div className="space-y-4">
                                <button onClick={() => setUserRole('STUDENT')} className="w-full bg-blue-50 hover:bg-blue-100 border border-blue-200 text-blue-900 font-bold py-4 rounded-2xl transition flex items-center justify-center gap-3">
                                    <i className="fa-solid fa-user"></i> Masuk sebagai Siswa (Aqsa)
                                </button>
                                <button onClick={() => setUserRole('ADMIN')} className="w-full bg-slate-800 hover:bg-slate-900 text-white font-bold py-4 rounded-2xl transition flex items-center justify-center gap-3">
                                    <i className="fa-solid fa-shield-halved"></i> Masuk sebagai Admin (Ortu)
                                </button>
                            </div>
                        </div>
                    </div>
                );
            }

            if (userRole === 'ADMIN') return <AdminDashboard onLogout={() => setUserRole(null)} />;
            
            if (view === 'QUIZ') {
                return <QuizEngine 
                    subject={selectedSubject} 
                    onComplete={() => setView('DASHBOARD')} 
                    onExit={() => setView('DASHBOARD')} 
                />;
            }

            return <StudentDashboard 
                onStartQuiz={(subj) => { 
                    setSelectedSubject(subj); 
                    setView('QUIZ'); 
                }} 
                onLogout={() => setUserRole(null)} 
            />;
        };

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
