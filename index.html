                { id: "e16", category: "Profession (EF)", difficulty: "STANDARD", reasoning: "R2", question: "He is a postman. He ............. letters everyday.", options: ["delivers", "mails", "puts", "writes"], correct: 0, explanation: "Tugas tukang pos (postman) adalah mengantar (delivers) surat." },
                { id: "e17", category: "Greeting (EF)", difficulty: "STANDARD", reasoning: "R2", question: "Mimi: 'Susi, this is Nina.'\nSusi: 'Hi, Nina. How do you do?'\nNina: '.............'", options: ["Are you all right?", "How do you do?", "How are you?", "Thank you"], correct: 1, explanation: "Balasan untuk sapaan 'How do you do?' saat pertama kali bertemu adalah 'How do you do?' juga." },

                { id: "e19", category: "Grammar (OSI)", difficulty: "ADVANCED", reasoning: "R3", question: "A small kitten was trapped on a tall tree. Which word is an adjective describing the tree?", options: ["small", "trapped", "tall", "tree"], correct: 2, explanation: "Kata sifat (adjective) yang menjelaskan kondisi pohon (tree) dalam kalimat tersebut adalah 'tall' (tinggi)." },
                { id: "e20", category: "Grammar (IKLC)", difficulty: "STANDARD", reasoning: "R2", question: "Complete the sentence: There ............. a bad wolf in the forest.", options: ["are", "is", "have", "do"], correct: 1, explanation: "Karena subjeknya tunggal ('a bad wolf'), to be yang tepat adalah 'is'." },
                { id: "e21", category: "Pronouns (IKLC)", difficulty: "STANDARD", reasoning: "R2", question: "The woman is holding a broomstick in ............. hands.", options: ["his", "its", "her", "their"], correct: 2, explanation: "Kata ganti kepemilikan untuk perempuan tunggal (woman) adalah 'her'." },
                { id: "e22", category: "Opposites (IKLC)", difficulty: "FOUNDATION", reasoning: "R1", question: "The opposite of 'hot' is .............", options: ["warm", "sweet", "cold", "dirty"], correct: 2, explanation: "Lawan kata dari panas (hot) adalah dingin (cold)." },
                { id: "e23", category: "Plurals (OSI)", difficulty: "ADVANCED", reasoning: "R3", question: "Choose the correct plural: The child was playing with a toy.", options: ["childs, toyes", "children, toys", "childrens, toies", "childes, toys"], correct: 1, explanation: "Bentuk jamak yang benar dari 'child' adalah 'children' (irregular), dan jamak dari 'toy' adalah 'toys'." },
                { id: "e24", category: "Plurals (OSI)", difficulty: "ADVANCED", reasoning: "R3", question: "Choose the correct plural for: knife, fork", options: ["knifes, forks", "knives, forks", "knivies, forkies", "knives, forkes"], correct: 1, explanation: "Kata yang berakhiran '-fe' berubah menjadi '-ves' untuk bentuk jamaknya (knives). Sedangkan 'fork' sekadar ditambah s menjadi 'forks'." },
                { id: "e25", category: "Count Nouns (OSI)", difficulty: "STANDARD", reasoning: "R2", question: "How many nouns are in this sentence: 'The teacher gave the student a new pen.'", options: ["two", "three", "four", "five"], correct: 1, explanation: "Ada 3 kata benda (noun) di kalimat tersebut yaitu: teacher, student, dan pen." },
                { id: "e26", category: "Vocabulary (IKLC)", difficulty: "FOUNDATION", reasoning: "R1", question: "How many shoes are there in a pair?", options: ["twelve", "thirteen", "two", "ten"], correct: 2, explanation: "Sepasang (a pair) selalu menunjuk pada jumlah dua buah (two)." },
                { id: "e27", category: "Vocabulary (EF)", difficulty: "STANDARD", reasoning: "R2", question: "Susan wears an accessory on her ears. The accessory is called ....", options: ["ring", "bracelet", "brooch", "earring"], correct: 3, explanation: "Perhiasan yang lazim dipakai di telinga (ears) adalah anting (earring)." },
                { id: "e28", category: "Vocabulary (OSI)", difficulty: "FOUNDATION", reasoning: "R1", question: "I am a flying insect with beautiful, colorful wings. What am I?", options: ["butterfli", "butterfly", "flutterby", "butterfley"], correct: 1, explanation: "Serangga terbang bersayap indah adalah kupu-kupu yang ejaannya tepat adalah 'butterfly'." },
                { id: "e29", category: "Spelling (OSI)", difficulty: "STANDARD", reasoning: "R2", question: "My grandmother baked a delicious, sweet strawberry ...", options: ["cak", "kaik", "cake", "cakee"], correct: 2, explanation: "Ejaan bahasa Inggris yang benar untuk kue adalah 'cake'." },
                { id: "e30", category: "Plurals (OSI)", difficulty: "ADVANCED", reasoning: "R4", question: "The beautiful white goose swam gracefully. What is the plural of 'goose'?", options: ["gooses", "geese", "geeses", "goosies"], correct: 1, explanation: "Bentuk jamak dari angsa (goose) bukanlah gooses, melainkan 'geese' (irregular plural noun)." }
            ]
        };

        // ==========================================
        // 2. ALGORITMA DINAMIS VARIANT KUIS AQSA
        // ==========================================
        const generateDynamicQuiz = (subjectKey, maxQuestions = 25) => {
            const namesM = ["Andi", "Budi", "Dodi", "Edo", "Fandi"];
            const namesF = ["Ria", "Siti", "Nala", "Lina", "Tini"];
            const fruitsID = ["apel", "jeruk", "mangga", "pisang", "stroberi"];
            
            let originalQuestions = dbQuestions[subjectKey] || dbQuestions.science;
            let selectedQuestions = [];

            // Duplicate array lightly to ensure we have enough questions if the DB is small (For prototype)
            while(originalQuestions.length < maxQuestions && originalQuestions.length > 0) {
                originalQuestions = [...originalQuestions, ...originalQuestions];
            }
            originalQuestions = originalQuestions.slice(0, maxQuestions);

            originalQuestions.forEach(q => {
                let v = Math.floor(Math.random() * 5);
                let newQ = JSON.parse(JSON.stringify(q));
                
                if (v > 0 && subjectKey !== 'english') {
                    let replaceText = (text) => {
                        if(!text) return text;
                        return text.replace(/Andi/g, namesM[v]).replace(/Budi/g, namesM[(v+1)%5])
                                   .replace(/Ria/g, namesF[v]).replace(/Siti/g, namesF[(v+1)%5])
                                   .replace(/apel/g, fruitsID[v]);
                    };
                    newQ.question = replaceText(newQ.question);
                    newQ.explanation = replaceText(newQ.explanation);
                    newQ.options = newQ.options.map(opt => replaceText(opt));
                }
                
                let optsWithIndex = newQ.options.map((opt, idx) => ({ text: opt, originalIndex: idx }));
                optsWithIndex.sort(() => Math.random() - 0.5);
                let newCorrectIndex = optsWithIndex.findIndex(opt => opt.originalIndex === newQ.correct);
                
                newQ.options = optsWithIndex.map(opt => opt.text);
                newQ.correct = newCorrectIndex;
                selectedQuestions.push(newQ);
            });
            
            selectedQuestions.sort(() => Math.random() - 0.5);
            return selectedQuestions;
        };

        // ==========================================
        // 3. LEARNING MODULE (Practice Mode w/ Pembahasan)
        // ==========================================
        const LearningModule = ({ subject, onExit }) => {
            const [questions, setQuestions] = useState([]);
            const [currentIdx, setCurrentIdx] = useState(0);
            const [selectedOpt, setSelectedOpt] = useState(null);
            const [showExplanation, setShowExplanation] = useState(false);

            useEffect(() => {
                setQuestions(generateDynamicQuiz(subject, 10)); // 10 soal untuk latihan
            }, [subject]);

            const handleOptionClick = (idx) => {
                if (selectedOpt !== null) return; // Lock answer
                setSelectedOpt(idx);
                setShowExplanation(true);
            };

            const nextQuestion = () => {
                if (currentIdx < questions.length - 1) {
                    setSelectedOpt(null);
                    setShowExplanation(false);
                    setCurrentIdx(currentIdx + 1);
                } else {
                    confetti({ particleCount: 100, spread: 70 });
                    onExit(); // Balik ke dashboard setelah selesai
                }
            };

            if (questions.length === 0) return <div className="p-8 text-center font-bold text-slate-500">Menyiapkan modul belajar...</div>;

            const q = questions[currentIdx];
            const isCorrect = selectedOpt === q.correct;

            return (
                <div className="min-h-screen bg-slate-900 flex flex-col fade-in">
                    <header className="bg-slate-800 border-b border-slate-700 px-6 py-4 flex justify-between items-center sticky top-0 z-10">
                        <div className="flex items-center gap-3">
                            <button onClick={onExit} className="p-2 bg-slate-700 text-slate-300 rounded-lg hover:bg-slate-600 transition"><i className="fa-solid fa-xmark w-4 h-4"></i></button>
                            <span className="font-bold text-white">{subject.toUpperCase()} Learning Mode</span>
                        </div>
                        <div className="font-mono font-bold bg-slate-700 text-blue-300 px-4 py-2 rounded-lg">Latihan {currentIdx + 1} / {questions.length}</div>
                    </header>
                    
                    <main className="flex-1 max-w-3xl w-full mx-auto p-4 sm:p-6 flex flex-col justify-center slide-up">
                        <div className="bg-white rounded-3xl p-6 sm:p-8 shadow-2xl border border-slate-100">
                            <div className="flex gap-2 mb-6">
                                <span className="text-[10px] font-bold px-2.5 py-1 bg-slate-100 text-slate-500 rounded uppercase">{q.category}</span>
                                <span className="text-[10px] font-bold px-2.5 py-1 bg-blue-50 text-blue-600 rounded uppercase border border-blue-100">{q.difficulty}</span>
                            </div>
                            <h2 className="text-xl sm:text-2xl font-semibold text-slate-800 mb-8 leading-relaxed">{q.question}</h2>
                            
                            <div className="space-y-3">
                                {q.options.map((opt, idx) => {
                                    let btnClass = "border-slate-200 hover:border-blue-400 bg-white text-slate-700";
                                    let icon = null;

                                    if (showExplanation) {
                                        if (idx === q.correct) {
                                            btnClass = "border-emerald-500 bg-emerald-50 text-emerald-800";
                                            icon = <i className="fa-solid fa-check text-emerald-600"></i>;
                                        } else if (idx === selectedOpt) {
                                            btnClass = "border-rose-500 bg-rose-50 text-rose-800";
                                            icon = <i className="fa-solid fa-xmark text-rose-600"></i>;
                                        } else {
                                            btnClass = "border-slate-200 opacity-40 bg-slate-50";
                                        }
                                    }

                                    return (
                                        <button key={idx} onClick={() => handleOptionClick(idx)} disabled={showExplanation}
                                            className={`w-full text-left p-4 rounded-2xl border-2 transition-all flex items-start gap-4 ${btnClass}`}>
                                            <div className="flex-1 text-base font-medium">{opt}</div>
                                            {icon && <div className="mt-1">{icon}</div>}
                                        </button>
                                    );
                                })}
                            </div>

                            {showExplanation && (
                                <div className={`mt-6 p-5 rounded-2xl border-l-4 slide-up ${isCorrect ? 'bg-emerald-50 border-emerald-500' : 'bg-amber-50 border-amber-500'}`}>
                                    <h4 className={`font-bold flex items-center gap-2 mb-2 ${isCorrect ? 'text-emerald-800' : 'text-amber-800'}`}>
                                        <i className={`fa-solid ${isCorrect ? 'fa-face-smile-beam' : 'fa-lightbulb'}`}></i> 
                                        {isCorrect ? 'Tepat Sekali! Berikut penjelasannya:' : 'Pelajari pembahasannya yuk:'}
                                    </h4>
                                    <p className="text-slate-700 text-sm leading-relaxed">{q.explanation}</p>
                                </div>
                            )}
                        </div>

                        {showExplanation && (
                            <div className="mt-6 flex justify-end slide-up">
                                <button onClick={nextQuestion} className="px-8 py-3 bg-blue-600 text-white font-bold rounded-2xl shadow-lg hover:bg-blue-700 transition">
                                    {currentIdx === questions.length - 1 ? 'Selesai Belajar' : 'Soal Selanjutnya'} <i className="fa-solid fa-arrow-right ml-2"></i>
                                </button>
                            </div>
                        )}
                    </main>
                </div>
            );
        };

        // ==========================================
        // 4. QUIZ ENGINE (+4, -1, 0) & Pembahasan Akhir
        // ==========================================
        const QuizEngine = ({ subject, onExit }) => {
            const [questions, setQuestions] = useState([]);
            const [currentIdx, setCurrentIdx] = useState(0);
            const [answers, setAnswers] = useState({});
            const [isFinished, setIsFinished] = useState(false);
            const [results, setResults] = useState(null);

            useEffect(() => {
                setQuestions(generateDynamicQuiz(subject, 25)); // 25 soal evaluasi
            }, [subject]);

            const handleAnswerSelect = (optIdx) => {
                setAnswers(prev => ({ ...prev, [currentIdx]: optIdx }));
            };

            const finishQuiz = () => {
                let correct = 0, wrong = 0, blank = 0, rawScore = 0;
                
                questions.forEach((q, idx) => {
                    const ans = answers[idx];
                    if (ans === q.correct) {
                        correct++;
                        rawScore += 4;
                    } else if (ans !== undefined && ans !== null) {
                        wrong++;
                        rawScore -= 1;
                    } else {
                        blank++;
                    }
                });
                
                // Max raw score = total questions * 4
                const maxRaw = questions.length * 4;
                // Convert to 100-scale accuracy for easy dashboard reading
                let accuracy = Math.round((correct / questions.length) * 100);
                
                let strength = accuracy > 50 ? "Pemahaman Dasar Kuat" : "Kecepatan Analisis";
                
                const finalResultData = { 
                    score: accuracy, // using accuracy as main 0-100 score for UI
                    rawScore: rawScore,
                    correct, wrong, blank, 
                    total: questions.length, 
                    strength, subject 
                };
                
                const existingHistory = JSON.parse(localStorage.getItem('aqsa_quiz_history')) || [];
                existingHistory.push(finalResultData);
                localStorage.setItem('aqsa_quiz_history', JSON.stringify(existingHistory));

                setResults(finalResultData);
                setIsFinished(true);
                confetti({ particleCount: 150, spread: 80, origin: {y: 0.6} });
            };

            if (questions.length === 0) return <div className="p-8 text-center font-bold text-slate-500">Menyiapkan 25 soal evaluasi...</div>;

            if (isFinished) {
                return (
                    <div className="min-h-screen bg-slate-50 p-4 sm:p-6 fade-in overflow-y-auto">
                        <div className="max-w-4xl mx-auto space-y-6">
                            {/* Summary Card */}
                            <div className="bg-white rounded-[2rem] shadow-xl p-8 border border-slate-100 text-center relative overflow-hidden">
                                <div className="absolute top-0 left-0 w-full h-2 bg-gradient-to-r from-blue-500 to-emerald-500"></div>
                                <div className="inline-flex items-center justify-center w-20 h-20 bg-emerald-100 rounded-full mb-4 mt-2">
                                    <i className="fa-solid fa-award text-3xl text-emerald-600"></i>
                                </div>
                                <h2 className="text-3xl font-display font-bold text-slate-800 mb-2">Evaluasi Selesai!</h2>
                                <p className="text-slate-500 mb-8">Berikut adalah rincian performa dan pembahasan soalmu.</p>
                                
                                <div className="grid grid-cols-2 sm:grid-cols-4 gap-4 mb-8">
                                    <div className="bg-blue-50 p-4 rounded-2xl border border-blue-100">
                                        <span className="text-[10px] font-bold text-blue-500 uppercase">Skor Murni (+4, -1, 0)</span>
                                        <div className="text-2xl font-black text-blue-700">{results.rawScore}</div>
                                    </div>
                                    <div className="bg-emerald-50 p-4 rounded-2xl border border-emerald-100">
                                        <span className="text-[10px] font-bold text-emerald-500 uppercase">Benar (+4)</span>
                                        <div className="text-2xl font-black text-emerald-700">{results.correct}</div>
                                    </div>
                                    <div className="bg-rose-50 p-4 rounded-2xl border border-rose-100">
                                        <span className="text-[10px] font-bold text-rose-500 uppercase">Salah (-1)</span>
                                        <div className="text-2xl font-black text-rose-700">{results.wrong}</div>
                                    </div>
                                    <div className="bg-amber-50 p-4 rounded-2xl border border-amber-100">
                                        <span className="text-[10px] font-bold text-amber-500 uppercase">Kosong (0)</span>
                                        <div className="text-2xl font-black text-amber-700">{results.blank}</div>
                                    </div>
                                </div>
                                <button onClick={onExit} className="px-8 py-3 bg-slate-800 text-white font-bold rounded-2xl hover:bg-slate-900 transition-colors shadow-md">Kembali ke Dashboard</button>
                            </div>

                            {/* Review Pembahasan */}
                            <div className="bg-white rounded-3xl p-6 sm:p-8 shadow-sm border border-slate-100">
                                <h3 className="text-xl font-display font-bold text-slate-800 mb-6 border-b border-slate-100 pb-4">Review & Pembahasan Lengkap</h3>
                                <div className="space-y-8">
                                    {questions.map((q, i) => {
                                        const userAns = answers[i];
                                        const isBlank = userAns === undefined || userAns === null;
                                        const isCorrect = userAns === q.correct;
                                        
                                        let statusBadge = <span className="bg-amber-100 text-amber-700 px-2 py-1 rounded text-xs font-bold uppercase">Kosong (0)</span>;
                                        if (!isBlank && isCorrect) statusBadge = <span className="bg-emerald-100 text-emerald-700 px-2 py-1 rounded text-xs font-bold uppercase">Benar (+4)</span>;
                                        if (!isBlank && !isCorrect) statusBadge = <span className="bg-rose-100 text-rose-700 px-2 py-1 rounded text-xs font-bold uppercase">Salah (-1)</span>;

                                        return (
                                            <div key={i} className="bg-slate-50 p-5 rounded-2xl border border-slate-200">
                                                <div className="flex justify-between items-start mb-3">
                                                    <span className="text-sm font-bold text-slate-500">Soal {i+1}</span>
                                                    {statusBadge}
                                                </div>
                                                <p className="font-medium text-slate-800 mb-4">{q.question}</p>
                                                
                                                <div className="grid grid-cols-1 sm:grid-cols-2 gap-3 mb-4 text-sm">
                                                    <div className="bg-white p-3 rounded-xl border border-slate-200">
                                                        <span className="block text-[10px] uppercase font-bold text-slate-400 mb-1">Jawabanmu:</span>
                                                        <span className={`font-medium ${isBlank ? 'text-slate-400 italic' : isCorrect ? 'text-emerald-600' : 'text-rose-600'}`}>
                                                            {isBlank ? 'Tidak dijawab' : q.options[userAns]}
                                                        </span>
                                                    </div>
                                                    <div className="bg-emerald-50 p-3 rounded-xl border border-emerald-100">
                                                        <span className="block text-[10px] uppercase font-bold text-emerald-500 mb-1">Kunci Jawaban:</span>
                                                        <span className="font-medium text-emerald-800">{q.options[q.correct]}</span>
                                                    </div>
                                                </div>

                                                <div className="bg-blue-50 border-l-4 border-blue-400 p-4 rounded-r-xl">
                                                    <span className="block text-xs font-bold text-blue-800 mb-1"><i className="fa-solid fa-lightbulb text-amber-500 mr-1"></i> Pembahasan:</span>
                                                    <p className="text-sm text-blue-900">{q.explanation}</p>
                                                </div>
                                            </div>
                                        );
                                    })}
                                </div>
                            </div>
                        </div>
                    </div>
                );
            }

            const q = questions[currentIdx];
            const hasAnswered = answers[currentIdx] !== undefined && answers[currentIdx] !== null;

            return (
                <div className="min-h-screen bg-slate-50 flex flex-col">
                    <header className="bg-white border-b border-slate-200 px-6 py-4 flex justify-between items-center sticky top-0 z-10 shadow-sm">
                        <div className="flex items-center gap-3">
                            <button onClick={onExit} className="p-2 bg-slate-100 rounded-lg hover:bg-slate-200"><i className="fa-solid fa-xmark w-4 h-4"></i></button>
                            <span className="font-bold text-slate-700">{subject.toUpperCase()} Assessment</span>
                        </div>
                        <div className="font-mono font-bold bg-blue-50 text-blue-600 border border-blue-100 px-4 py-2 rounded-lg">Soal {currentIdx + 1} / {questions.length}</div>
                    </header>
                    <main className="flex-1 max-w-3xl w-full mx-auto p-4 sm:p-6 flex flex-col justify-center slide-up">
                        <div className="bg-white rounded-3xl p-6 sm:p-8 shadow-sm border border-slate-100">
                            <div className="flex gap-2 mb-6">
                                <span className="text-[10px] font-bold px-2.5 py-1 bg-slate-100 text-slate-500 rounded uppercase">{q.category}</span>
                                <span className="text-[10px] font-bold px-2.5 py-1 bg-purple-50 text-purple-600 rounded uppercase border border-purple-100">{q.reasoning}</span>
                            </div>
                            <h2 className="text-xl sm:text-2xl font-semibold text-slate-800 mb-8 leading-relaxed">{q.question}</h2>
                            <div className="space-y-3">
                                {q.options.map((opt, idx) => (
                                    <button key={idx} onClick={() => handleAnswerSelect(idx)}
                                        className={`w-full text-left p-4 rounded-2xl border-2 transition-all group flex items-start gap-4 ${answers[currentIdx] === idx ? 'border-blue-500 bg-blue-50' : 'border-slate-200 hover:border-blue-300 hover:bg-slate-50'}`}>
                                        <div className={`w-6 h-6 shrink-0 rounded-full border-2 flex items-center justify-center mt-0.5 ${answers[currentIdx] === idx ? 'border-blue-600 bg-blue-600' : 'border-slate-300'}`}>
                                            {answers[currentIdx] === idx && <div className="w-2 h-2 bg-white rounded-full"></div>}
                                        </div>
                                        <span className={`text-base font-medium ${answers[currentIdx] === idx ? 'text-blue-900' : 'text-slate-700'}`}>{opt}</span>
                                    </button>
                                ))}
                            </div>
                        </div>
                        <div className="mt-6 flex justify-between">
                            <button onClick={() => setCurrentIdx(Math.max(0, currentIdx - 1))} disabled={currentIdx === 0} className="px-6 py-3 font-bold text-slate-600 disabled:opacity-30 flex items-center gap-2 hover:bg-slate-200 rounded-xl transition">
                                <i className="fa-solid fa-arrow-left"></i> Sebelumnya
                            </button>
                            {currentIdx === questions.length - 1 ? (
                                <button onClick={finishQuiz} className="px-8 py-3 bg-emerald-600 text-white font-bold rounded-xl shadow-lg hover:bg-emerald-700 transition flex items-center gap-2">
                                    Selesai Ujian <i className="fa-solid fa-check-double"></i>
                                </button>
                            ) : (
                                <button onClick={() => setCurrentIdx(currentIdx + 1)} className={`px-8 py-3 font-bold rounded-xl shadow-md transition flex items-center gap-2 ${hasAnswered ? 'bg-blue-600 text-white hover:bg-blue-700' : 'bg-amber-100 text-amber-700 hover:bg-amber-200'}`}>
                                    {hasAnswered ? 'Selanjutnya' : 'Lewati (Kosong)'} <i className="fa-solid fa-arrow-right"></i>
                                </button>
                            )}
                        </div>
                    </main>
                </div>
            );
        };

        // ==========================================
        // 5. STUDENT DASHBOARD
        // ==========================================
        // INITIALIZE SUPABASE HERE LATER:
        // const supabase = supabase.createClient('YOUR_SUPABASE_URL', 'YOUR_SUPABASE_KEY');

        const StudentDashboard = ({ onStartQuiz, onStartLearning, onLogout }) => {
            const [activeMenu, setActiveMenu] = useState('Dashboard');
            
            // Re-calculate dynamically on every render
            const history = JSON.parse(localStorage.getItem('aqsa_quiz_history')) || [];
            const hasCompletedAny = history.length > 0;

            const overallScore = hasCompletedAny ? Math.round(history.reduce((acc, curr) => acc + curr.score, 0) / history.length) : 0;
            
            // Calculate specific subject mastery dynamically
            const getMastery = (subj) => {
                const subjHistory = history.filter(h => h.subject === subj);
                if (subjHistory.length === 0) return 0;
                return Math.round(subjHistory.reduce((acc, curr) => acc + curr.score, 0) / subjHistory.length);
            };

            const competencyVals = {
                math: getMastery('math'),
                science: getMastery('science'),
                english: getMastery('english')
            };

            const menus = [
                { id: 'Dashboard', icon: 'fa-solid fa-table-columns' },
                { id: 'Lessons', icon: 'fa-solid fa-book-open' },
                { id: 'Assessments', icon: 'fa-solid fa-pen-nib' },
                { id: 'Settings', icon: 'fa-solid fa-gear' }
            ];

            const renderContent = () => {
                if (activeMenu === 'Lessons') {
                    return (
                        <div className="flex-1 p-6 lg:p-8 space-y-6 fade-in">
                            <h2 className="text-2xl font-display font-bold text-slate-800">Modul Pembelajaran</h2>
                            <p className="text-sm text-slate-500 mb-6">Pilih subjek untuk mulai latihan. Jawaban dan pembahasan akan langsung muncul setelah kamu memilih opsi.</p>
                            <div className="grid grid-cols-1 md:grid-cols-3 gap-4">
                                <button onClick={() => onStartLearning('math')} className="bento-card flex flex-col items-center text-center hover:shadow-lg transition group border-blue-100 bg-blue-50/30 cursor-pointer">
                                    <div className="w-16 h-16 bg-blue-100 text-blue-600 rounded-2xl flex items-center justify-center text-2xl shadow-sm mb-4 group-hover:scale-110 transition-transform"><i className="fa-solid fa-calculator"></i></div>
                                    <h3 className="font-bold text-slate-800 text-lg">Nalaria Math</h3>
                                    <p className="text-xs text-slate-500 mt-2">Latihan Pola & Logika</p>
                                </button>
                                <button onClick={() => onStartLearning('science')} className="bento-card flex flex-col items-center text-center hover:shadow-lg transition group border-emerald-100 bg-emerald-50/30 cursor-pointer">
                                    <div className="w-16 h-16 bg-emerald-100 text-emerald-600 rounded-2xl flex items-center justify-center text-2xl shadow-sm mb-4 group-hover:scale-110 transition-transform"><i className="fa-solid fa-flask"></i></div>
                                    <h3 className="font-bold text-slate-800 text-lg">Realistic Science</h3>
                                    <p className="text-xs text-slate-500 mt-2">Latihan Sains & Alam</p>
                                </button>
                                <button onClick={() => onStartLearning('english')} className="bento-card flex flex-col items-center text-center hover:shadow-lg transition group border-rose-100 bg-rose-50/30 cursor-pointer">
                                    <div className="w-16 h-16 bg-rose-100 text-rose-600 rounded-2xl flex items-center justify-center text-2xl shadow-sm mb-4 group-hover:scale-110 transition-transform"><i className="fa-solid fa-globe"></i></div>
                                    <h3 className="font-bold text-slate-800 text-lg">English</h3>
                                    <p className="text-xs text-slate-500 mt-2">Latihan Vocab & Grammar</p>
                                </button>
                            </div>
                        </div>
                    );
                }

                if (activeMenu === 'Assessments') {
                    return (
                        <div className="flex-1 p-6 lg:p-8 space-y-6 fade-in">
                            <div className="mb-8">
                                <h2 className="text-2xl font-display font-bold text-slate-800 mb-4">Mulai Evaluasi Mandiri (25 Soal)</h2>
                                <p className="text-sm text-slate-500 mb-6">Skor dihitung berdasarkan sistem KMNR: Benar (+4), Salah (-1), Kosong (0).</p>
                                <div className="grid grid-cols-1 md:grid-cols-3 gap-4">
                                    <button onClick={() => onStartQuiz('math')} className="text-left bg-[#f4f7fc] p-6 rounded-[1.5rem] hover:shadow-lg transition group relative border border-blue-50">
                                        <div className="w-12 h-12 bg-[#e2eafc] text-blue-700 rounded-xl flex items-center justify-center mb-4"><i className="fa-solid fa-calculator w-6 h-6"></i></div>
                                        <h4 className="text-lg font-display font-bold text-blue-900 mb-1">Mathematics</h4>
                                    </button>
                                    <button onClick={() => onStartQuiz('science')} className="text-left bg-[#eefff4] p-6 rounded-[1.5rem] hover:shadow-lg transition group relative border border-emerald-50">
                                        <div className="w-12 h-12 bg-[#d1f4e0] text-emerald-700 rounded-xl flex items-center justify-center mb-4"><i className="fa-solid fa-flask w-6 h-6"></i></div>
                                        <h4 className="text-lg font-display font-bold text-emerald-900 mb-1">Science</h4>
                                    </button>
                                    <button onClick={() => onStartQuiz('english')} className="text-left bg-[#fff0f2] p-6 rounded-[1.5rem] hover:shadow-lg transition group relative border border-rose-50">
                                        <div className="w-12 h-12 bg-[#ffe0e6] text-rose-700 rounded-xl flex items-center justify-center mb-4"><i className="fa-solid fa-globe w-6 h-6"></i></div>
                                        <h4 className="text-lg font-display font-bold text-rose-900 mb-1">English</h4>
                                    </button>
                                </div>
                            </div>

                            <h2 className="text-xl font-display font-bold text-slate-800 border-t border-slate-100 pt-6">Riwayat Evaluasi</h2>
                            <div className="bento-card overflow-hidden p-0">
                                {hasCompletedAny ? (
                                    <div className="overflow-x-auto">
                                        <table className="w-full text-left text-sm text-slate-600">
                                            <thead className="bg-slate-50 text-slate-500 border-b border-slate-100">
                                                <tr>
                                                    <th className="p-4 font-bold">Subjek</th>
                                                    <th className="p-4 font-bold">Akurasi (%)</th>
                                                    <th className="p-4 font-bold">Skor Murni</th>
                                                    <th className="p-4 font-bold">B / S / K</th>
                                                </tr>
                                            </thead>
                                            <tbody>
                                                {history.slice().reverse().map((h, i) => (
                                                    <tr key={i} className="border-b border-slate-50 last:border-0 hover:bg-slate-50 transition">
                                                        <td className="p-4 font-bold text-slate-800 capitalize flex items-center gap-2">
                                                            <div className={`w-8 h-8 rounded-lg flex items-center justify-center text-white text-xs ${h.subject === 'math' ? 'bg-blue-500' : h.subject === 'science' ? 'bg-emerald-500' : 'bg-rose-500'}`}>
                                                                <i className={`fa-solid ${h.subject === 'math' ? 'fa-calculator' : h.subject === 'science' ? 'fa-flask' : 'fa-globe'} w-4 h-4`}></i>
                                                            </div>
                                                            {h.subject}
                                                        </td>
                                                        <td className="p-4"><span className={`px-3 py-1 rounded-full text-xs font-bold ${h.score >= 80 ? 'bg-emerald-100 text-emerald-700' : h.score >= 50 ? 'bg-blue-100 text-blue-700' : 'bg-amber-100 text-amber-700'}`}>{h.score}%</span></td>
                                                        <td className="p-4 font-bold text-blue-700">{h.rawScore}</td>
                                                        <td className="p-4 font-medium text-xs">
                                                            <span className="text-emerald-600 mr-1">{h.correct}</span>/
                                                            <span className="text-rose-600 mx-1">{h.wrong}</span>/
                                                            <span className="text-amber-600 ml-1">{h.blank}</span>
                                                        </td>
                                                    </tr>
                                                ))}
                                            </tbody>
                                        </table>
                                    </div>
                                ) : (
                                    <div className="p-16 text-center text-slate-500 italic">
                                        <i className="fa-solid fa-file-circle-xmark text-5xl mx-auto mb-3 text-slate-300"></i>
                                        <p>Belum ada evaluasi yang diselesaikan.</p>
                                    </div>
                                )}
                            </div>
                        </div>
                    );
                }

                if (activeMenu === 'Settings') {
                    return (
                        <div className="flex-1 p-6 lg:p-8 space-y-6 fade-in">
                            <h2 className="text-2xl font-display font-bold text-slate-800">Pengaturan Akun</h2>
                            <div className="max-w-xl space-y-6">
                                <div className="bento-card flex items-center gap-5">
                                    <div className="w-20 h-20 bg-gradient-to-tr from-blue-600 to-indigo-500 text-white rounded-full flex items-center justify-center text-3xl font-display font-bold shadow-md">A</div>
                                    <div>
                                        <h3 className="font-bold text-xl text-slate-800">Aqsa</h3>
                                        <p className="text-sm text-blue-600 font-bold mb-1">Siswa - Grade 1-2 Primary</p>
                                    </div>
                                </div>
                                <button onClick={onLogout} className="w-full py-4 rounded-xl border-2 border-rose-100 text-rose-600 font-bold hover:bg-rose-50 transition flex items-center justify-center gap-2 shadow-sm">
                                    <i className="fa-solid fa-right-from-bracket w-5 h-5"></i> Keluar dari Akun (Logout)
                                </button>
                            </div>
                        </div>
                    );
                }

                // Default "Dashboard"
                return (
                    <div className="flex-1 p-6 lg:p-8 space-y-8 fade-in">
                        <div className="bg-gradient-to-r from-blue-50 to-indigo-50 rounded-3xl p-6 md:p-8 flex items-center justify-between border border-blue-100">
                            <div className="relative z-10 w-full max-w-lg">
                                <h1 className="text-2xl md:text-3xl font-display font-bold text-slate-800 mb-2">Halo Aqsa! 👋</h1>
                                <p className="text-slate-600 text-sm mb-5 leading-relaxed">
                                    {hasCompletedAny ? `Akurasi rata-rata keseluruhanmu adalah ${overallScore}%. Pilih menu Assessments untuk melanjutkan evaluasi targetmu!` : "Belum ada riwayat aktivitas. Silakan mulai modul belajar atau evaluasi mandiri."}
                                </p>
                            </div>
                        </div>

                        <div className="grid grid-cols-1 md:grid-cols-2 gap-6">
                            <div className="bento-card">
                                <h3 className="font-bold text-slate-800 mb-6">Tren Akurasi Evaluasi</h3>
                                {hasCompletedAny ? (
                                    <div className="flex items-end justify-between h-32 pb-2 gap-2">
                                        {history.slice(-6).map((h, i) => (
                                            <div key={i} className="flex flex-col items-center flex-1">
                                                <span className="text-[10px] font-bold text-slate-400 mb-1">{h.score}%</span>
                                                <div className="w-full max-w-[32px] bg-blue-50 rounded-t-lg relative h-full">
                                                    <div className="absolute bottom-0 w-full bg-blue-500 rounded-t-lg transition-all duration-500" style={{ height: `${Math.max(10, h.score)}%` }}></div>
                                                </div>
                                            </div>
                                        ))}
                                    </div>
                                ) : (
                                    <div className="h-32 flex items-center justify-center text-slate-400 text-xs italic border-2 border-dashed border-slate-200 rounded-2xl">
                                        Belum ada data.
                                    </div>
                                )}
                            </div>

                            <div className="bento-card">
                                <h3 className="font-bold text-slate-800 mb-4">Penguasaan Kompetensi</h3>
                                <div className="grid grid-cols-3 gap-y-6 gap-x-2">
                                    {[
                                        { label: "Math", val: competencyVals.math, color: "#3b82f6" },
                                        { label: "Science", val: competencyVals.science, color: "#10b981" },
                                        { label: "English", val: competencyVals.english, color: "#f43f5e" }
                                    ].map((item, i) => (
                                        <div key={i} className="flex flex-col items-center">
                                            <div className="relative w-16 h-16 rounded-full flex items-center justify-center mb-2 shadow-sm" style={{ background: `conic-gradient(${item.color} ${item.val}%, #f1f5f9 ${item.val}%)` }}>
                                                <div className="w-12 h-12 bg-white rounded-full flex items-center justify-center text-xs font-black text-slate-700">{item.val}%</div>
                                            </div>
                                            <span className="text-[11px] font-bold text-slate-600 text-center">{item.label}</span>
                                        </div>
                                    ))}
                                </div>
                            </div>
                        </div>
                    </div>
                );
            };

            return (
                <div className="min-h-screen bg-[#314a8f] p-2 sm:p-4 md:p-6 flex fade-in">
                    <div className="bg-white w-full rounded-[2rem] shadow-2xl flex overflow-hidden flex-col lg:flex-row">
                        
                        <aside className="w-full lg:w-64 bg-[#3b55a0] text-white p-6 flex flex-col lg:flex-shrink-0 relative">
                            <div className="flex items-center justify-between lg:justify-start gap-3 mb-6 lg:mb-10 text-white font-bold text-xl leading-tight">
                                <div className="flex items-center gap-3">
                                    <div className="w-9 h-9 bg-white text-[#3b55a0] rounded-xl flex items-center justify-center shadow-inner shrink-0"><i className="fa-solid fa-rocket w-5 h-5"></i></div>
                                    <div>
                                        <div className="text-base font-display">To The Mars</div>
                                        <div className="text-[9px] text-blue-200 font-medium uppercase tracking-widest">Tools Learning</div>
                                    </div>
                                </div>
                                <button onClick={onLogout} className="lg:hidden w-10 h-10 flex items-center justify-center bg-white/10 hover:bg-white/20 text-white rounded-xl transition shadow-sm" title="Keluar">
                                    <i className="fa-solid fa-right-from-bracket w-5 h-5"></i>
                                </button>
                            </div>
                            <nav className="space-y-2 flex-1 flex lg:flex-col overflow-x-auto pb-2 lg:pb-0 hide-scrollbar gap-2 lg:gap-0">
                                {menus.map(menu => (
                                    <button key={menu.id} onClick={() => setActiveMenu(menu.id)} 
                                        className={`w-auto lg:w-full text-left px-4 py-3 rounded-2xl text-sm font-semibold transition-all whitespace-nowrap flex items-center gap-3
                                        ${activeMenu === menu.id ? 'bg-white text-[#3b55a0] shadow-md' : 'text-blue-100 hover:bg-white/10'}`}>
                                        <i className={`${menu.icon} w-5 h-5`}></i>
                                        <span>{menu.id}</span>
                                    </button>
                                ))}
                            </nav>
                            <button onClick={onLogout} className="mt-auto hidden lg:flex px-4 py-3 text-left text-blue-200 hover:text-white items-center gap-3 text-sm font-semibold transition hover:bg-white/10 rounded-2xl">
                                <i className="fa-solid fa-right-from-bracket w-5 h-5"></i> Keluar
                            </button>
                        </aside>

                        <main className="flex-1 flex flex-col xl:flex-row overflow-y-auto">
                            {renderContent()}
                        </main>
                    </div>
                </div>
            );
        };

        // ==========================================
        // 6. MAIN APP ROUTER
        // ==========================================
        const App = () => {
            const [userRole, setUserRole] = useState(null);
            const [studentView, setStudentView] = useState('DASHBOARD');
            const [selectedSubject, setSelectedSubject] = useState('math'); 

            if (!userRole) {
                return (
                    <div className="min-h-screen flex items-center justify-center bg-[#f1f5f9] p-4 fade-in">
                        <div className="bg-white p-8 md:p-12 rounded-[2rem] shadow-xl max-w-md w-full text-center border border-slate-100">
                            <div className="w-16 h-16 bg-blue-600 rounded-2xl mx-auto mb-6 flex items-center justify-center text-white shadow-lg"><i className="fa-solid fa-rocket w-8 h-8"></i></div>
                            <h1 className="text-3xl font-display font-bold text-slate-800 mb-2">To The Mars</h1>
                            <p className="text-blue-600 font-bold text-xs tracking-widest uppercase mb-10">Tools Learning (v4.1 Complete)</p>
                            <div className="space-y-4">
                                <button onClick={() => setUserRole('STUDENT')} className="w-full bg-[#f4f7fc] hover:bg-blue-50 border border-blue-100 text-blue-900 font-bold py-4 rounded-2xl transition flex items-center justify-center gap-3"><i className="fa-solid fa-user w-5 h-5"></i> Masuk sebagai Siswa (Aqsa)</button>
                                <button onClick={() => setUserRole('ADMIN')} className="w-full bg-slate-800 hover:bg-slate-900 text-white font-bold py-4 rounded-2xl transition flex items-center justify-center gap-3"><i className="fa-solid fa-shield w-5 h-5"></i> Masuk sebagai Admin (Orang Tua)</button>
                            </div>
                        </div>
                    </div>
                );
            }

            if (userRole === 'ADMIN') {
                return (
                    <div className="min-h-screen flex items-center justify-center bg-slate-100 p-4">
                        <div className="bg-white p-12 rounded-3xl shadow-lg text-center max-w-sm">
                            <i className="fa-solid fa-tools text-5xl text-slate-300 mb-4"></i>
                            <h2 className="text-xl font-bold text-slate-700">Admin Dashboard</h2>
                            <p className="text-sm text-slate-500 mb-6">Modul Admin dipindahkan ke service terpisah sesuai arsitektur.</p>
                            <button onClick={() => setUserRole(null)} className="px-6 py-2 bg-slate-800 text-white rounded-xl">Kembali</button>
                        </div>
                    </div>
                );
            }

            if (studentView === 'QUIZ') return <QuizEngine subject={selectedSubject} onExit={() => setStudentView('DASHBOARD')} />;
            if (studentView === 'LEARNING') return <LearningModule subject={selectedSubject} onExit={() => setStudentView('DASHBOARD')} />;

            return <StudentDashboard 
                onStartQuiz={(subj) => { setSelectedSubject(subj); setStudentView('QUIZ'); }} 
                onStartLearning={(subj) => { setSelectedSubject(subj); setStudentView('LEARNING'); }}
                onLogout={() => setUserRole(null)} 
            />;
        };

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
