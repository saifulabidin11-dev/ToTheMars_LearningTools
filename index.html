<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>To The Mars Tools Learning</title>
    
    <!-- CSS & Libraries -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>
    
    <!-- Supabase SDK -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

    <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;500;600;700&family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    
    <style>
        body { font-family: 'Inter', sans-serif; background-color: #f8fafc; color: #0f172a; }
        h1, h2, h3, .font-display { font-family: 'Fredoka', sans-serif; }
        ::-webkit-scrollbar { width: 6px; height: 6px; }
        ::-webkit-scrollbar-track { background: transparent; }
        ::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 4px; }
        .fade-in { animation: fadeIn 0.4s cubic-bezier(0.16, 1, 0.3, 1); }
        .slide-up { animation: slideUp 0.5s cubic-bezier(0.16, 1, 0.3, 1); }
        @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
        @keyframes slideUp { from { opacity: 0; transform: translateY(20px); } to { opacity: 1; transform: translateY(0); } }
        .hide-scrollbar::-webkit-scrollbar { display: none; }
        .bento-card { background: white; border-radius: 1.5rem; padding: 1.5rem; box-shadow: 0 4px 20px -4px rgba(0,0,0,0.05); border: 1px solid #f1f5f9; }
        #scratchpad-canvas { cursor: crosshair; touch-action: none; }
    </style>
</head>
<body>
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect, useRef } = React;

        // ==========================================
        // CONFIG SUPABASE
        // ==========================================
        const SUPABASE_URL = 'https://zttpjtkrgwgfmtybasfo.supabase.co';
        const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Inp0dHBqdGtyZ3dnZm10eWJhc2ZvIiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTI1NDc3MDcsImV4cCI6MjEwODEyMzcwN30.Z_LNo2n1gvT31PyvgJ9ou815IBe6ghGFIg70vG5kAzc';
        const supabase = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

        // ==========================================
        // DATABASE SOAL (MATH, SCIENCE, ENGLISH)
        // ==========================================
        const dbQuestions = {
            math: [
                { id: "m1", category: "Pola Bilangan", difficulty: "FOUNDATION", reasoning: "R2", question: "Katak melompat ke daun nomor 2, lalu daun nomor 5, lalu daun nomor 8. Daun nomor berapa yang akan diinjak katak selanjutnya?", options: ["10", "11", "12", "13"], correct: 1, hint: "Perhatikan selisih lompatannya. Selalu bertambah 3.", explanation: "Polanya selalu ditambah 3 (+3). Maka 8 + 3 = 11." },
                { id: "m2", category: "Pemecahan Masalah", difficulty: "STANDARD", reasoning: "R4", question: "Di dalam sebuah kandang terdapat ayam dan kambing. Total jumlah kepala ada 10, total kaki ada 28. Berapa jumlah kambing di dalam kandang tersebut?", options: ["3 ekor", "4 ekor", "5 ekor", "6 ekor"], correct: 1, hint: "Anggap semua hewan adalah ayam dulu (kakinya 2), lalu hitung sisa kakinya.", explanation: "Misal semua ayam: 10 x 2 = 20 kaki. Selisih 8 kaki milik kambing ekstra (4-2). Jadi 8/2 = 4 ekor." },
                { id: "m3", category: "Waktu/Umur", difficulty: "FOUNDATION", reasoning: "R2", question: "Umur Andi 3 tahun lebih tua dari Budi. Umur Ria 2 tahun lebih muda dari Budi. Jika umur Ria 7 tahun, berapakah umur Andi?", options: ["10 tahun", "11 tahun", "12 tahun", "13 tahun"], correct: 2, hint: "Cari tahu dulu umur Budi dari umur Ria.", explanation: "Budi = 7 + 2 = 9 tahun. Andi = 9 + 3 = 12 tahun." },
                { id: "m4", category: "Deret", difficulty: "FOUNDATION", reasoning: "R2", question: "Lanjutkan pola berikut: 1, 3, 6, 10, ...", options: ["12", "14", "15", "16"], correct: 2, hint: "Lihat beda tiap angka: +2, +3, +4...", explanation: "Penambahan naik bertahap (+2, +3, +4, +5). Jadi 10 + 5 = 15." },
                { id: "m5", category: "Aritmetika", difficulty: "STANDARD", reasoning: "R3", question: "Jika A + B = 10, dan A - B = 4. Maka berapakah nilai A x B?", options: ["21", "24", "16", "25"], correct: 0, hint: "Cari dua angka yang kalau dijumlah hasilnya 10, kalau dikurang hasilnya 4.", explanation: "Angka tersebut adalah A = 7 dan B = 3. Maka A x B = 7 x 3 = 21." }
                // Persingkat contoh soal demi muat di code editor, di aslinya isi sampai 25.
            ],
            science: [
                { id: "s1", category: "Sifat Benda", difficulty: "FOUNDATION", reasoning: "R2", question: "Andi memasukkan es batu ke mangkuk besi dan plastik yang dibungkus handuk. Keduanya di meja. Apa yang terjadi setelah 15 menit?", options: ["Es di mangkuk plastik mencair lebih dulu", "Es di mangkuk besi mencair lebih dulu", "Keduanya mencair bersamaan", "Tidak ada yang mencair"], correct: 1, hint: "Besi adalah penghantar panas yang cepat (konduktor).", explanation: "Besi adalah konduktor panas yang baik, menyerap suhu ruangan lebih cepat. Handuk adalah isolator yang menahan suhu." },
                { id: "s2", category: "Ekosistem", difficulty: "STANDARD", reasoning: "R3", question: "Rantai makanan: Padi → Belalang → Katak → Ular. Jika katak habis karena kemarau, apa dampaknya?", options: ["Belalang bertambah, ular berkurang", "Padi bertambah subur", "Belalang dan ular bertambah", "Ular memakan padi"], correct: 0, hint: "Jika pemangsa belalang hilang, belalang akan aman. Jika makanan ular hilang, ular akan kelaparan.", explanation: "Katak mati berarti pemangsa belalang hilang (belalang bertambah). Makanan ular hilang (ular berkurang)." },
                { id: "s3", category: "Sifat Cahaya", difficulty: "FOUNDATION", reasoning: "R2", question: "Budi berjalan ke arah Timur. Bayangannya jatuh tepat di depannya (arah Timur). Jam berapakah kemungkinan saat itu?", options: ["12.00 siang", "07.00 pagi", "15.00 sore", "24.00 malam"], correct: 2, hint: "Bayangan selalu berlawanan arah dengan cahaya matahari.", explanation: "Bayangan jatuh ke Timur, berarti sumber cahaya (Matahari) ada di Barat. Matahari di Barat terjadi pada waktu sore hari." },
                { id: "s4", category: "Gaya Gesek", difficulty: "STANDARD", reasoning: "R2", question: "Ban sepeda dan sol sepatu dibuat memiliki alur kasar. Apa tujuannya secara sains?", options: ["Memperkecil gaya gesek", "Memperbesar gaya gesek agar tidak licin", "Membuatnya ringan", "Supaya terlihat bagus"], correct: 1, hint: "Alur kasar mencegah kita terpeleset.", explanation: "Permukaan kasar pada ban atau sepatu diciptakan untuk memperbesar gaya gesek agar tidak licin/tergelincir." },
                { id: "s5", category: "Astronomi", difficulty: "STANDARD", reasoning: "R3", question: "Bintang-bintang seolah bergerak dari timur ke barat di malam hari. Sebenarnya apa yang terjadi?", options: ["Bintang mengelilingi Bumi", "Bumi berputar pada porosnya dari barat ke timur", "Angin luar angkasa meniup bintang", "Bumi berputar dari utara ke selatan"], correct: 1, hint: "Sama seperti saat kita naik mobil, pohon seolah bergerak mundur.", explanation: "Bintang tampak bergerak karena Bumi berotasi dari barat ke timur, membuat benda langit seolah berjalan dari timur ke barat." }
            ],
            english: [
                { id: "e1", category: "Vocabulary (IKLC)", difficulty: "FOUNDATION", reasoning: "R1", question: "A baby elephant is known as a .............", options: ["Puppy", "Calf", "Kitten", "Cub"], correct: 1, hint: "It is the same name used for a baby cow.", explanation: "A baby elephant is called a calf." },
                { id: "e2", category: "Prepositions", difficulty: "FOUNDATION", reasoning: "R2", question: "A: Where do you live?\nB: I live ............. a big house.", options: ["on", "in", "under", "at"], correct: 1, hint: "You live *inside* the walls of the house.", explanation: "The correct preposition is 'in'." },
                { id: "e3", category: "Opposites", difficulty: "FOUNDATION", reasoning: "R1", question: "The opposite of 'bad' is .............", options: ["happy", "tired", "good", "angry"], correct: 2, hint: "Think of a word that means nice or positive.", explanation: "The opposite of bad is good." },
                { id: "e4", category: "Profession", difficulty: "FOUNDATION", reasoning: "R2", question: "He is a postman. He ............. letters everyday.", options: ["delivers", "mails", "puts", "writes"], correct: 0, hint: "What action does a postman do with mail?", explanation: "A postman delivers letters." },
                { id: "e5", category: "Questions", difficulty: "STANDARD", reasoning: "R2", question: "Shopper: '............. is a kilo of these apples?'\nSeller: 'Ten-thousand rupiahs.'", options: ["How many", "What", "How much", "How"], correct: 2, hint: "Use this to ask about the price.", explanation: "To ask for price, we use 'How much'." }
            ]
        };

        // ==========================================
        // COMPONENT: SCRATCHPAD (Papan Coretan)
        // ==========================================
        const Scratchpad = ({ isOpen, onClose }) => {
            const canvasRef = useRef(null);
            const [isDrawing, setIsDrawing] = useState(false);

            useEffect(() => {
                if (isOpen && canvasRef.current) {
                    const canvas = canvasRef.current;
                    canvas.width = canvas.offsetWidth;
                    canvas.height = canvas.offsetHeight;
                    const ctx = canvas.getContext('2d');
                    ctx.lineCap = 'round';
                    ctx.lineWidth = 3;
                    ctx.strokeStyle = '#3b82f6'; // Blue color
                }
            }, [isOpen]);

            const startDrawing = (e) => {
                const canvas = canvasRef.current;
                const ctx = canvas.getContext('2d');
                const rect = canvas.getBoundingClientRect();
                const clientX = e.touches ? e.touches[0].clientX : e.clientX;
                const clientY = e.touches ? e.touches[0].clientY : e.clientY;
                ctx.beginPath();
                ctx.moveTo(clientX - rect.left, clientY - rect.top);
                setIsDrawing(true);
            };

            const draw = (e) => {
                if (!isDrawing) return;
                e.preventDefault(); // Prevent scrolling on touch
                const canvas = canvasRef.current;
                const ctx = canvas.getContext('2d');
                const rect = canvas.getBoundingClientRect();
                const clientX = e.touches ? e.touches[0].clientX : e.clientX;
                const clientY = e.touches ? e.touches[0].clientY : e.clientY;
                ctx.lineTo(clientX - rect.left, clientY - rect.top);
                ctx.stroke();
            };

            const stopDrawing = () => {
                setIsDrawing(false);
            };

            const clearCanvas = () => {
                const canvas = canvasRef.current;
                const ctx = canvas.getContext('2d');
                ctx.clearRect(0, 0, canvas.width, canvas.height);
            };

            if (!isOpen) return null;

            return (
                <div className="fixed inset-0 z-50 bg-black/60 backdrop-blur-sm flex items-center justify-center p-4 fade-in">
                    <div className="bg-white w-full max-w-2xl rounded-[2rem] shadow-2xl p-5 flex flex-col h-[80vh]">
                        <div className="flex justify-between items-center mb-4">
                            <h3 className="font-bold text-slate-800 text-lg flex items-center gap-2">
                                <i className="fa-solid fa-pen-to-square text-amber-500"></i> Papan Coretan
                            </h3>
                            <button onClick={onClose} className="w-8 h-8 bg-slate-100 hover:bg-slate-200 rounded-full flex items-center justify-center text-slate-600">
                                <i className="fa-solid fa-xmark"></i>
                            </button>
                        </div>
                        <div className="flex-1 bg-amber-50/50 rounded-2xl border-2 border-dashed border-amber-200 relative overflow-hidden">
                            <canvas 
                                ref={canvasRef} 
                                onMouseDown={startDrawing} onMouseMove={draw} onMouseUp={stopDrawing} onMouseLeave={stopDrawing}
                                onTouchStart={startDrawing} onTouchMove={draw} onTouchEnd={stopDrawing}
                                className="w-full h-full cursor-crosshair"
                            ></canvas>
                        </div>
                        <div className="mt-4 flex justify-end">
                            <button onClick={clearCanvas} className="bg-slate-100 hover:bg-slate-200 text-slate-700 font-bold py-2 px-6 rounded-xl flex items-center gap-2">
                                <i className="fa-solid fa-trash-can"></i> Bersihkan
                            </button>
                        </div>
                    </div>
                </div>
            );
        };

        // ==========================================
        // QUIZ ENGINE (Dengan Skor +4, -1, 0 & Supabase)
        // ==========================================
        const QuizEngine = ({ subject, mode, onComplete, onExit }) => {
            const [questions, setQuestions] = useState([]);
            const [currentIdx, setCurrentIdx] = useState(0);
            const [answers, setAnswers] = useState({});
            const [isFinished, setIsFinished] = useState(false);
            const [results, setResults] = useState(null);
            const [showHint, setShowHint] = useState(false);
            const [isScratchpadOpen, setScratchpadOpen] = useState(false);

            useEffect(() => {
                // Load soal sesuai subjek
                let qList = [...(dbQuestions[subject] || dbQuestions.math)];
                // Acak urutan soal
                qList.sort(() => Math.random() - 0.5);
                setQuestions(qList);
            }, [subject]);

            const handleAnswer = (optIdx) => {
                setAnswers(prev => ({ ...prev, [currentIdx]: optIdx }));
                setShowHint(false); // Reset hint
            };

            const clearAnswer = () => {
                setAnswers(prev => {
                    const newAns = { ...prev };
                    delete newAns[currentIdx];
                    return newAns;
                });
            };

            const finishQuiz = async () => {
                let correctCount = 0;
                let wrongCount = 0;
                let blankCount = 0;

                questions.forEach((q, idx) => {
                    if (answers[idx] === undefined) {
                        blankCount++;
                    } else if (answers[idx] === q.correct) {
                        correctCount++;
                    } else {
                        wrongCount++;
                    }
                });
                
                // SKOR ATURAN KHUSUS: +4, -1, 0
                const rawScore = (correctCount * 4) + (wrongCount * -1) + (blankCount * 0);
                const maxPossibleRaw = questions.length * 4;
                
                // Normalisasi skala 100
                let normalizedScore = Math.max(0, Math.round((rawScore / maxPossibleRaw) * 100));
                if(isNaN(normalizedScore)) normalizedScore = 0;

                const finalResultData = { 
                    score: normalizedScore, 
                    raw_score: rawScore,
                    correct: correctCount, 
                    wrong: wrongCount,
                    blank: blankCount,
                    total: questions.length, 
                    subject,
                    date: new Date().toLocaleDateString()
                };

                // 1. Simpan ke LocalStorage
                const existingHistory = JSON.parse(localStorage.getItem('aqsa_quiz_history')) || [];
                existingHistory.push(finalResultData);
                localStorage.setItem('aqsa_quiz_history', JSON.stringify(existingHistory));

                // 2. Simpan ke SUPABASE DATABASE
                try {
                    const { error } = await supabase.from('quiz_history').insert([
                        { 
                            subject: subject, 
                            score: normalizedScore, 
                            raw_score: rawScore 
                            // Pastikan hanya kolom ini yang dikirim jika di tabel Supabase hanya ada kolom id, subject, score, raw_score, created_at.
                        }
                    ]);
                    if (error) console.error("Error Supabase Insert:", error);
                } catch (err) {
                    console.error("Gagal terhubung ke Supabase:", err);
                }

                setResults(finalResultData);
                setIsFinished(true);
                confetti({ particleCount: 150, spread: 80, origin: {y: 0.6} });
            };

            if (questions.length === 0) return <div className="p-8 text-center font-bold text-slate-500">Menyiapkan soal...</div>;

            if (isFinished) {
                return (
                    <div className="min-h-screen bg-slate-50 flex flex-col p-4 sm:p-6 overflow-y-auto fade-in">
                        <div className="max-w-3xl w-full mx-auto">
                            <div className="bg-white rounded-[2rem] shadow-xl p-8 border border-slate-100 text-center mb-6">
                                <div className="inline-flex items-center justify-center w-20 h-20 bg-emerald-100 rounded-full mb-4">
                                    <i className="fa-solid fa-trophy text-4xl text-emerald-600"></i>
                                </div>
                                <h2 className="text-3xl font-display font-bold text-slate-800 mb-2">Evaluasi Selesai!</h2>
                                <p className="text-slate-500 mb-6">Berikut adalah hasil evaluasi komprehensif kamu.</p>
                                
                                <div className="grid grid-cols-2 md:grid-cols-4 gap-4 mb-8">
                                    <div className="bg-blue-600 text-white p-4 rounded-2xl shadow-md">
                                        <span className="text-[10px] font-bold uppercase opacity-80">Skor Akhir</span>
                                        <div className="text-3xl font-black">{results.score}</div>
                                    </div>
                                    <div className="bg-emerald-50 text-emerald-700 p-4 rounded-2xl border border-emerald-100">
                                        <span className="text-[10px] font-bold uppercase">Benar (+4)</span>
                                        <div className="text-3xl font-black">{results.correct}</div>
                                    </div>
                                    <div className="bg-rose-50 text-rose-700 p-4 rounded-2xl border border-rose-100">
                                        <span className="text-[10px] font-bold uppercase">Salah (-1)</span>
                                        <div className="text-3xl font-black">{results.wrong}</div>
                                    </div>
                                    <div className="bg-amber-50 text-amber-700 p-4 rounded-2xl border border-amber-100">
                                        <span className="text-[10px] font-bold uppercase">Kosong (0)</span>
                                        <div className="text-3xl font-black">{results.blank}</div>
                                    </div>
                                </div>

                                <button onClick={onComplete} className="bg-slate-800 text-white font-bold py-3 px-8 rounded-xl hover:bg-slate-900 transition-colors shadow-md">
                                    <i className="fa-solid fa-house mr-2"></i> Kembali ke Dashboard
                                </button>
                            </div>

                            {/* REVIEW PEMBAHASAN */}
                            <div className="bg-white rounded-[2rem] shadow-sm p-6 sm:p-8 border border-slate-100">
                                <h3 className="text-xl font-bold font-display mb-6 text-slate-800 border-b pb-4"><i className="fa-solid fa-list-check mr-2"></i> Review & Pembahasan</h3>
                                <div className="space-y-6">
                                    {questions.map((q, idx) => {
                                        const isCorrect = answers[idx] === q.correct;
                                        const isBlank = answers[idx] === undefined;
                                        return (
                                            <div key={idx} className={`p-5 rounded-2xl border-l-4 ${isCorrect ? 'border-emerald-500 bg-emerald-50/30' : isBlank ? 'border-amber-500 bg-amber-50/30' : 'border-rose-500 bg-rose-50/30'}`}>
                                                <div className="flex items-center gap-2 mb-2">
                                                    <span className={`text-xs font-bold px-2 py-0.5 rounded text-white ${isCorrect ? 'bg-emerald-500' : isBlank ? 'bg-amber-500' : 'bg-rose-500'}`}>
                                                        {isCorrect ? 'BENAR' : isBlank ? 'KOSONG' : 'SALAH'}
                                                    </span>
                                                    <span className="text-xs font-bold text-slate-400">Soal {idx + 1}</span>
                                                </div>
                                                <p className="font-semibold text-slate-800 mb-3">{q.question}</p>
                                                <div className="text-sm space-y-1 mb-4">
                                                    <div className="flex gap-2">
                                                        <span className="text-slate-500 w-24">Jawabanmu:</span>
                                                        <span className={`font-semibold ${isCorrect ? 'text-emerald-700' : 'text-rose-700'}`}>{isBlank ? '-' : q.options[answers[idx]]}</span>
                                                    </div>
                                                    {!isCorrect && (
                                                        <div className="flex gap-2">
                                                            <span className="text-slate-500 w-24">Kunci:</span>
                                                            <span className="font-semibold text-emerald-700">{q.options[q.correct]}</span>
                                                        </div>
                                                    )}
                                                </div>
                                                <div className="bg-white p-3 rounded-xl border border-slate-200 text-sm text-slate-600">
                                                    <strong className="text-blue-700"><i className="fa-solid fa-lightbulb mr-1"></i> Pembahasan:</strong> {q.explanation}
                                                </div>
                                            </div>
                                        );
                                    })}
                                </div>
                            </div>
                        </div>
                    </div>
                );
            }

            const q = questions[currentIdx];
            const isAnswered = answers[currentIdx] !== undefined;

            return (
                <div className="min-h-screen bg-slate-50 flex flex-col relative">
                    <Scratchpad isOpen={isScratchpadOpen} onClose={() => setScratchpadOpen(false)} />

                    <header className="bg-white border-b border-slate-200 px-4 py-3 flex justify-between items-center sticky top-0 z-30">
                        <div className="flex items-center gap-3">
                            <button onClick={onExit} className="w-10 h-10 bg-slate-100 rounded-full flex items-center justify-center text-slate-600 hover:bg-slate-200"><i className="fa-solid fa-arrow-left"></i></button>
                            <div>
                                <h1 className="font-bold text-slate-800 text-lg leading-tight uppercase font-display">{subject}</h1>
                                <span className="text-[10px] text-slate-500 font-semibold">{mode === 'LEARN' ? 'Practice Mode' : 'Evaluasi Mandiri'}</span>
                            </div>
                        </div>
                        <div className="flex items-center gap-2">
                            <button onClick={() => setScratchpadOpen(true)} className="px-3 py-1.5 bg-amber-100 text-amber-700 font-bold text-xs rounded-lg hover:bg-amber-200"><i className="fa-solid fa-pen-nib mr-1"></i> Coretan</button>
                            <div className="font-mono font-bold bg-slate-800 text-white px-3 py-1.5 rounded-lg text-xs">{currentIdx + 1} / {questions.length}</div>
                        </div>
                    </header>

                    <main className="flex-1 max-w-3xl w-full mx-auto p-4 sm:p-6 flex flex-col justify-center slide-up">
                        
                        {mode === 'LEARN' && isAnswered && (
                            <div className={`mb-4 p-4 rounded-2xl border-2 fade-in flex items-start gap-3 ${answers[currentIdx] === q.correct ? 'bg-emerald-50 border-emerald-200' : 'bg-rose-50 border-rose-200'}`}>
                                <i className={`fa-solid mt-0.5 text-lg ${answers[currentIdx] === q.correct ? 'fa-circle-check text-emerald-600' : 'fa-circle-xmark text-rose-600'}`}></i>
                                <div>
                                    <h4 className={`font-bold ${answers[currentIdx] === q.correct ? 'text-emerald-800' : 'text-rose-800'}`}>{answers[currentIdx] === q.correct ? 'Tepat Sekali!' : 'Masih Kurang Tepat'}</h4>
                                    <p className="text-sm mt-1 text-slate-700"><strong>Pembahasan:</strong> {q.explanation}</p>
                                </div>
                            </div>
                        )}

                        <div className="bg-white rounded-3xl p-6 sm:p-8 shadow-sm border border-slate-200 relative">
                            <div className="flex justify-between items-center mb-6">
                                <span className="text-[10px] font-bold px-2.5 py-1 bg-slate-100 text-slate-500 rounded uppercase">{q.category}</span>
                                {q.hint && (
                                    <button onClick={() => setShowHint(!showHint)} className="text-[10px] font-bold px-2.5 py-1 bg-blue-50 text-blue-600 border border-blue-100 rounded hover:bg-blue-100">
                                        <i className="fa-solid fa-lightbulb mr-1"></i> Hint
                                    </button>
                                )}
                            </div>

                            {showHint && q.hint && (
                                <div className="mb-6 p-3 bg-amber-50 border border-amber-200 rounded-xl text-xs text-amber-800 font-medium fade-in">
                                    <strong>Bantuan Logika:</strong> {q.hint}
                                </div>
                            )}

                            <h2 className="text-lg sm:text-xl font-bold text-slate-800 mb-8 whitespace-pre-line leading-relaxed">{q.question}</h2>
                            
                            <div className="space-y-3">
                                {q.options.map((opt, idx) => {
                                    let btnClass = "border-slate-200 hover:border-blue-400 bg-white text-slate-700";
                                    let iconClass = "border-slate-300";
                                    
                                    if (answers[currentIdx] === idx) {
                                        if (mode === 'LEARN') {
                                            btnClass = idx === q.correct ? "border-emerald-500 bg-emerald-50 text-emerald-800" : "border-rose-500 bg-rose-50 text-rose-800";
                                            iconClass = idx === q.correct ? "border-emerald-600 bg-emerald-600" : "border-rose-600 bg-rose-600";
                                        } else {
                                            btnClass = "border-blue-500 bg-blue-50 text-blue-900";
                                            iconClass = "border-blue-600 bg-blue-600";
                                        }
                                    } else if (mode === 'LEARN' && isAnswered && idx === q.correct) {
                                        // Tunjukkan jawaban benar jika salah jawab (mode belajar)
                                        btnClass = "border-emerald-400 bg-white text-emerald-700 opacity-70";
                                    }

                                    return (
                                        <button key={idx} onClick={() => !isAnswered || mode !== 'LEARN' ? handleAnswer(idx) : null}
                                            disabled={mode === 'LEARN' && isAnswered}
                                            className={`w-full text-left p-4 rounded-2xl border-2 transition-all group flex items-start gap-4 ${btnClass}`}>
                                            <div className={`w-6 h-6 shrink-0 rounded-full border-2 flex items-center justify-center mt-0.5 ${iconClass}`}>
                                                {answers[currentIdx] === idx && <div className="w-2.5 h-2.5 bg-white rounded-full"></div>}
                                            </div>
                                            <span className="text-base font-medium">{opt}</span>
                                        </button>
                                    );
                                })}
                            </div>

                            {mode !== 'LEARN' && isAnswered && (
                                <div className="mt-4 flex justify-end">
                                    <button onClick={clearAnswer} className="text-xs font-bold text-slate-400 hover:text-rose-500"><i className="fa-solid fa-eraser mr-1"></i> Kosongkan Jawaban</button>
                                </div>
                            )}
                        </div>

                        <div className="mt-6 flex justify-between items-center">
                            <button onClick={() => setCurrentIdx(Math.max(0, currentIdx - 1))} disabled={currentIdx === 0} className="px-5 py-3 font-bold text-slate-500 hover:text-slate-800 disabled:opacity-30"><i className="fa-solid fa-chevron-left mr-1"></i> Back</button>
                            
                            {currentIdx === questions.length - 1 ? (
                                <button onClick={finishQuiz} className="px-8 py-3.5 bg-emerald-600 text-white font-bold rounded-2xl shadow-lg hover:bg-emerald-700 transition transform hover:-translate-y-0.5"><i className="fa-solid fa-flag-checkered mr-2"></i> Submit Ujian</button>
                            ) : (
                                <button onClick={() => setCurrentIdx(currentIdx + 1)} className="px-8 py-3.5 bg-slate-800 text-white font-bold rounded-2xl shadow-lg hover:bg-slate-900 transition transform hover:-translate-y-0.5">Next <i className="fa-solid fa-chevron-right ml-1"></i></button>
                            )}
                        </div>
                    </main>
                </div>
            );
        };

        // ==========================================
        // STUDENT DASHBOARD
        // ==========================================
        const StudentDashboard = ({ onStartQuiz, onLogout }) => {
            const [activeMenu, setActiveMenu] = useState('Dashboard');
            const history = JSON.parse(localStorage.getItem('aqsa_quiz_history')) || [];
            const hasCompletedAny = history.length > 0;

            const calcScore = (subj) => {
                const subjHist = history.filter(h => h.subject === subj);
                if (subjHist.length === 0) return 0;
                return Math.round(subjHist.reduce((acc, curr) => acc + curr.score, 0) / subjHist.length);
            };

            const overallScore = hasCompletedAny ? Math.round(history.reduce((acc, curr) => acc + curr.score, 0) / history.length) : 0;
            const competencyVals = {
                math: calcScore('math'),
                science: calcScore('science'),
                english: calcScore('english')
            };

            const menus = [
                { id: 'Dashboard', icon: 'fa-table-columns' },
                { id: 'Lessons', icon: 'fa-book-open' },
                { id: 'Assessments', icon: 'fa-pen-to-square' },
                { id: 'Settings', icon: 'fa-gear' }
            ];

            return (
                <div className="min-h-screen bg-slate-900 sm:p-4 md:p-6 flex fade-in">
                    <div className="bg-white w-full rounded-none sm:rounded-[2rem] shadow-2xl flex flex-col lg:flex-row overflow-hidden">
                        
                        {/* SIDEBAR */}
                        <aside className="w-full lg:w-64 bg-slate-800 text-white p-5 flex flex-col lg:flex-shrink-0 z-20">
                            <div className="flex items-center justify-between mb-8">
                                <div className="flex items-center gap-3">
                                    <div className="w-10 h-10 bg-gradient-to-br from-blue-400 to-indigo-600 rounded-xl flex items-center justify-center shadow-lg"><i className="fa-solid fa-rocket text-white"></i></div>
                                    <div>
                                        <div className="text-lg font-display font-bold leading-tight">To The Mars</div>
                                        <div className="text-[9px] text-blue-200 uppercase tracking-widest">Tools Learning</div>
                                    </div>
                                </div>
                                <button onClick={onLogout} className="lg:hidden text-slate-400 hover:text-white p-2"><i className="fa-solid fa-right-from-bracket"></i></button>
                            </div>

                            <nav className="flex lg:flex-col gap-2 overflow-x-auto pb-2 lg:pb-0 hide-scrollbar">
                                {menus.map(menu => (
                                    <button key={menu.id} onClick={() => setActiveMenu(menu.id)} 
                                        className={`px-4 py-3 rounded-xl text-sm font-semibold transition whitespace-nowrap flex items-center gap-3
                                        ${activeMenu === menu.id ? 'bg-blue-600 text-white shadow-md' : 'text-slate-400 hover:bg-slate-700 hover:text-slate-200'}`}>
                                        <i className={`fa-solid ${menu.icon} w-5`}></i> {menu.id}
                                    </button>
                                ))}
                            </nav>
                            <button onClick={onLogout} className="mt-auto hidden lg:flex px-4 py-3 text-left text-slate-400 hover:text-white items-center gap-3 text-sm font-semibold transition">
                                <i className="fa-solid fa-right-from-bracket w-5"></i> Keluar / Logout
                            </button>
                        </aside>

                        {/* MAIN CONTENT AREA */}
                        <main className="flex-1 bg-slate-50 overflow-y-auto">
                            
                            {activeMenu === 'Dashboard' && (
                                <div className="p-6 md:p-8 space-y-6 fade-in">
                                    <div className="bg-white rounded-3xl p-6 md:p-8 flex flex-col md:flex-row items-center justify-between border border-slate-100 shadow-sm gap-6">
                                        <div>
                                            <h1 className="text-2xl md:text-3xl font-display font-bold text-slate-800 mb-2">Halo, Aqsa! <span className="text-2xl">👋</span></h1>
                                            <p className="text-slate-500 text-sm max-w-md">
                                                {hasCompletedAny ? `Kemampuan analisismu semakin tajam. Skor rata-rata keseluruhanmu saat ini adalah ${overallScore}.` : "Selamat datang di Platform Akademik. Mari mulai evaluasi pertamamu!"}
                                            </p>
                                        </div>
                                        <div className="w-24 h-24 shrink-0 rounded-full border-4 border-emerald-100 bg-emerald-50 flex flex-col items-center justify-center">
                                            <span className="text-2xl font-black text-emerald-600 leading-none">{overallScore}</span>
                                            <span className="text-[10px] font-bold text-emerald-400 uppercase mt-1">Score</span>
                                        </div>
                                    </div>

                                    <div className="bg-white rounded-3xl p-6 md:p-8 border border-slate-100 shadow-sm">
                                        <h3 className="font-bold text-slate-800 mb-6 font-display text-lg"><i className="fa-solid fa-chart-pie text-blue-500 mr-2"></i>Penguasaan Kompetensi</h3>
                                        <div className="grid grid-cols-3 gap-4">
                                            {[
                                                { label: "Mathematics", val: competencyVals.math, color: "#3b82f6", icon: "fa-calculator" },
                                                { label: "Science", val: competencyVals.science, color: "#10b981", icon: "fa-flask" },
                                                { label: "English", val: competencyVals.english, color: "#f43f5e", icon: "fa-globe" }
                                            ].map((item, i) => (
                                                <div key={i} className="flex flex-col items-center bg-slate-50 rounded-2xl p-4 border border-slate-100">
                                                    <i className={`fa-solid ${item.icon} text-2xl mb-3`} style={{color: item.color}}></i>
                                                    <span className="text-3xl font-black text-slate-800 leading-none">{item.val}</span>
                                                    <span className="text-[10px] font-bold text-slate-400 uppercase mt-2 text-center">{item.label}</span>
                                                </div>
                                            ))}
                                        </div>
                                    </div>
                                </div>
                            )}

                            {activeMenu === 'Lessons' && (
                                <div className="p-6 md:p-8 fade-in">
                                    <h2 className="text-2xl font-display font-bold text-slate-800 mb-2">Modul Belajar (Practice)</h2>
                                    <p className="text-sm text-slate-500 mb-8">Pilih subjek untuk latihan. Jawaban dan pembahasan akan langsung muncul setelah kamu menjawab.</p>
                                    
                                    <div className="grid grid-cols-1 md:grid-cols-3 gap-4">
                                        <button onClick={() => onStartQuiz('math', 'LEARN')} className="bg-white p-6 rounded-3xl border border-slate-100 shadow-sm hover:shadow-md hover:border-blue-300 transition text-left group">
                                            <div className="w-12 h-12 bg-blue-50 text-blue-600 rounded-2xl flex items-center justify-center mb-4 group-hover:bg-blue-600 group-hover:text-white transition"><i className="fa-solid fa-calculator text-xl"></i></div>
                                            <h3 className="font-bold text-slate-800 text-lg">Mathematics</h3>
                                            <p className="text-xs text-slate-400 mt-1">Latihan Logika & KMNR</p>
                                        </button>
                                        <button onClick={() => onStartQuiz('science', 'LEARN')} className="bg-white p-6 rounded-3xl border border-slate-100 shadow-sm hover:shadow-md hover:border-emerald-300 transition text-left group">
                                            <div className="w-12 h-12 bg-emerald-50 text-emerald-600 rounded-2xl flex items-center justify-center mb-4 group-hover:bg-emerald-600 group-hover:text-white transition"><i className="fa-solid fa-flask text-xl"></i></div>
                                            <h3 className="font-bold text-slate-800 text-lg">Science</h3>
                                            <p className="text-xs text-slate-400 mt-1">Latihan Fenomena Alam</p>
                                        </button>
                                        <button onClick={() => onStartQuiz('english', 'LEARN')} className="bg-white p-6 rounded-3xl border border-slate-100 shadow-sm hover:shadow-md hover:border-rose-300 transition text-left group">
                                            <div className="w-12 h-12 bg-rose-50 text-rose-600 rounded-2xl flex items-center justify-center mb-4 group-hover:bg-rose-600 group-hover:text-white transition"><i className="fa-solid fa-globe text-xl"></i></div>
                                            <h3 className="font-bold text-slate-800 text-lg">English</h3>
                                            <p className="text-xs text-slate-400 mt-1">Latihan Grammar & Vocab</p>
                                        </button>
                                    </div>
                                </div>
                            )}

                            {activeMenu === 'Assessments' && (
                                <div className="p-6 md:p-8 fade-in">
                                    <h2 className="text-2xl font-display font-bold text-slate-800 mb-2">Evaluasi Mandiri (Ujian)</h2>
                                    <p className="text-sm text-slate-500 mb-8">Pilih subjek untuk ujian. Berlaku sistem skor +4 (Benar), -1 (Salah), 0 (Kosong).</p>
                                    
                                    <div className="grid grid-cols-1 md:grid-cols-3 gap-4 mb-10">
                                        <button onClick={() => onStartQuiz('math', 'EXAM')} className="bg-blue-600 text-white p-6 rounded-3xl shadow-md hover:bg-blue-700 transition text-left relative overflow-hidden">
                                            <i className="fa-solid fa-calculator absolute -right-4 -bottom-4 text-6xl opacity-10"></i>
                                            <h3 className="font-bold text-lg font-display">Math Eval</h3>
                                            <p className="text-xs text-blue-200 mt-1">Mulai Ujian</p>
                                        </button>
                                        <button onClick={() => onStartQuiz('science', 'EXAM')} className="bg-emerald-600 text-white p-6 rounded-3xl shadow-md hover:bg-emerald-700 transition text-left relative overflow-hidden">
                                            <i className="fa-solid fa-flask absolute -right-4 -bottom-4 text-6xl opacity-10"></i>
                                            <h3 className="font-bold text-lg font-display">Science Eval</h3>
                                            <p className="text-xs text-emerald-200 mt-1">Mulai Ujian</p>
                                        </button>
                                        <button onClick={() => onStartQuiz('english', 'EXAM')} className="bg-rose-600 text-white p-6 rounded-3xl shadow-md hover:bg-rose-700 transition text-left relative overflow-hidden">
                                            <i className="fa-solid fa-globe absolute -right-4 -bottom-4 text-6xl opacity-10"></i>
                                            <h3 className="font-bold text-lg font-display">English Eval</h3>
                                            <p className="text-xs text-rose-200 mt-1">Mulai Ujian</p>
                                        </button>
                                    </div>

                                    <h3 className="font-bold text-slate-800 mb-4 font-display">Riwayat Ujian Tersimpan</h3>
                                    <div className="bg-white rounded-2xl border border-slate-200 overflow-hidden">
                                        {hasCompletedAny ? (
                                            <table className="w-full text-left text-sm">
                                                <thead className="bg-slate-50 text-slate-500 font-bold border-b border-slate-200">
                                                    <tr>
                                                        <th className="px-4 py-3">Tanggal</th>
                                                        <th className="px-4 py-3">Subjek</th>
                                                        <th className="px-4 py-3">Benar</th>
                                                        <th className="px-4 py-3">Salah</th>
                                                        <th className="px-4 py-3">Kosong</th>
                                                        <th className="px-4 py-3 text-right">Skor (100)</th>
                                                    </tr>
                                                </thead>
                                                <tbody>
                                                    {history.slice().reverse().map((h, i) => (
                                                        <tr key={i} className="border-b border-slate-100 last:border-0 hover:bg-slate-50">
                                                            <td className="px-4 py-3 text-slate-500">{h.date}</td>
                                                            <td className="px-4 py-3 font-semibold uppercase">{h.subject}</td>
                                                            <td className="px-4 py-3 text-emerald-600 font-bold">{h.correct}</td>
                                                            <td className="px-4 py-3 text-rose-600 font-bold">{h.wrong}</td>
                                                            <td className="px-4 py-3 text-amber-600 font-bold">{h.blank}</td>
                                                            <td className="px-4 py-3 text-right font-black text-slate-800">{h.score}</td>
                                                        </tr>
                                                    ))}
                                                </tbody>
                                            </table>
                                        ) : (
                                            <div className="p-8 text-center text-slate-400 italic">Belum ada riwayat ujian.</div>
                                        )}
                                    </div>
                                </div>
                            )}

                            {activeMenu === 'Settings' && (
                                <div className="p-6 md:p-8 fade-in max-w-xl">
                                    <h2 className="text-2xl font-display font-bold text-slate-800 mb-6">Settings</h2>
                                    <div className="bg-white rounded-3xl p-6 border border-slate-100 shadow-sm space-y-4">
                                        <div className="flex justify-between items-center pb-4 border-b border-slate-100">
                                            <div>
                                                <div className="font-bold text-slate-800">Akun Siswa</div>
                                                <div className="text-xs text-slate-500">Aqsa (Grade 1-2)</div>
                                            </div>
                                        </div>
                                        <div className="flex justify-between items-center pb-4 border-b border-slate-100">
                                            <div>
                                                <div className="font-bold text-slate-800">Koneksi Supabase</div>
                                                <div className="text-xs text-emerald-500 font-bold"><i className="fa-solid fa-circle text-[8px] mr-1"></i> Terhubung (Active)</div>
                                            </div>
                                        </div>
                                        <div className="pt-2">
                                            <button onClick={onLogout} className="w-full py-3 bg-rose-50 text-rose-600 hover:bg-rose-100 font-bold rounded-xl transition flex items-center justify-center gap-2">
                                                <i className="fa-solid fa-right-from-bracket"></i> Keluar dari Aplikasi
                                            </button>
                                        </div>
                                    </div>
                                </div>
                            )}
                        </main>
                    </div>
                </div>
            );
        };

        // ==========================================
        // ADMIN DASHBOARD
        // ==========================================
        const AdminDashboard = ({ onLogout }) => {
            return (
                <div className="min-h-screen bg-slate-100 flex items-center justify-center p-4 fade-in">
                    <div className="bg-white rounded-[2rem] shadow-xl p-8 max-w-md w-full text-center border border-slate-200">
                        <div className="w-16 h-16 bg-slate-100 text-slate-400 rounded-full mx-auto mb-4 flex items-center justify-center text-2xl">
                            <i className="fa-solid fa-screwdriver-wrench"></i>
                        </div>
                        <h2 className="text-2xl font-display font-bold text-slate-800 mb-2">Admin Dashboard</h2>
                        <p className="text-slate-500 text-sm mb-8">Modul Admin dipindahkan ke service terpisah sesuai arsitektur. Data nilai siswa dapat dilihat langsung melalui Supabase Database.</p>
                        <button onClick={onLogout} className="bg-slate-800 hover:bg-slate-900 text-white font-bold py-3 px-8 rounded-xl transition w-full">Kembali</button>
                    </div>
                </div>
            );
        };

        // ==========================================
        // MAIN APP ROUTER
        // ==========================================
        const App = () => {
            const [userRole, setUserRole] = useState(null);
            const [view, setView] = useState('DASHBOARD');
            const [selectedSubject, setSelectedSubject] = useState(null);
            const [quizMode, setQuizMode] = useState('EXAM'); // 'LEARN' or 'EXAM'

            if (!userRole) {
                return (
                    <div className="min-h-screen flex items-center justify-center bg-slate-100 p-4 fade-in">
                        <div className="bg-white p-8 md:p-12 rounded-[2rem] shadow-xl max-w-md w-full text-center border border-slate-200">
                            <div className="w-16 h-16 bg-gradient-to-br from-blue-500 to-indigo-600 rounded-2xl mx-auto mb-6 flex items-center justify-center shadow-lg">
                                <i className="fa-solid fa-rocket text-2xl text-white"></i>
                            </div>
                            <h1 className="text-3xl font-display font-bold text-slate-800 mb-2">To The Mars</h1>
                            <p className="text-blue-600 font-bold text-xs tracking-widest uppercase mb-10">Tools Learning (v4.0)</p>
                            <div className="space-y-4">
                                <button onClick={() => setUserRole('STUDENT')} className="w-full bg-blue-50 hover:bg-blue-100 border border-blue-200 text-blue-900 font-bold py-4 rounded-2xl transition flex items-center justify-center gap-3">
                                    <i className="fa-solid fa-user"></i> Masuk sebagai Siswa (Aqsa)
                                </button>
                                <button onClick={() => setUserRole('ADMIN')} className="w-full bg-slate-800 hover:bg-slate-900 text-white font-bold py-4 rounded-2xl transition flex items-center justify-center gap-3">
                                    <i className="fa-solid fa-shield-halved"></i> Masuk sebagai Admin (Ortu)
                                </button>
                            </div>
                        </div>
                    </div>
                );
            }

            if (userRole === 'ADMIN') return <AdminDashboard onLogout={() => setUserRole(null)} />;
            
            if (view === 'QUIZ') {
                return <QuizEngine 
                    subject={selectedSubject} 
                    mode={quizMode}
                    onComplete={() => setView('DASHBOARD')} 
                    onExit={() => setView('DASHBOARD')} 
                />;
            }

            return <StudentDashboard 
                onStartQuiz={(subj, mode) => { 
                    setSelectedSubject(subj); 
                    setQuizMode(mode);
                    setView('QUIZ'); 
                }} 
                onLogout={() => setUserRole(null)} 
            />;
        };

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
