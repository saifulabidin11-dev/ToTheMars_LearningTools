        // ==========================================
        // ALGORITMA 5X RANDOM SYSTEM
        // ==========================================
        const shuffleArray = (array) => {
            let newArr = [...array];
            for (let i = newArr.length - 1; i > 0; i--) {
                const j = Math.floor(Math.random() * (i + 1));
                [newArr[i], newArr[j]] = [newArr[j], newArr[i]];
            }
            return newArr;
        };

        const generateDynamicQuiz = (subjectKey) => {
            const namesM = ["Andi", "Budi", "Dodi", "Edo", "Fandi", "Rafa", "Vano", "Dion"];
            const namesF = ["Ria", "Siti", "Nala", "Lina", "Tini", "Dina", "Amara", "Vega"];
            const fruitsID = ["apel", "jeruk", "mangga", "pisang", "stroberi"];
            const fruitsEN = ["apples", "oranges", "mangoes", "bananas", "grapes"];
            
            let originalQuestions = dbQuestions[subjectKey] || dbQuestions.math_kmnr;
            
            let shuffledPool = shuffleArray(originalQuestions);
            let selectedRaw = shuffledPool.slice(0, 25);
            let finalQuestions = [];

            selectedRaw.forEach(q => {
                let v = Math.floor(Math.random() * 8);
                let newQ = JSON.parse(JSON.stringify(q));
                
                let replaceText = (text) => {
                    if(!text) return text;
                    return text.replace(/Andi/g, namesM[v]).replace(/Budi/g, namesM[(v+1)%8])
                               .replace(/Ria/g, namesF[v]).replace(/Nala/g, namesF[(v+1)%8])
                               .replace(/apples/g, fruitsEN[v%5]).replace(/apel/g, fruitsID[v%5]);
                };
                newQ.question = replaceText(newQ.question);
                if(newQ.explanation) newQ.explanation = replaceText(newQ.explanation);
                if(newQ.hint) newQ.hint = replaceText(newQ.hint);
                
                let optsWithIndex = newQ.options.map((opt, idx) => ({ text: replaceText(opt), originalIndex: idx }));
                optsWithIndex = shuffleArray(optsWithIndex);
                let newCorrectIndex = optsWithIndex.findIndex(opt => opt.originalIndex === newQ.correct);
                
                newQ.options = optsWithIndex.map(opt => opt.text);
                newQ.correct = newCorrectIndex;
                finalQuestions.push(newQ);
            });
            
            return finalQuestions;
        };

        // ==========================================

        const Scratchpad = ({ isOpen, onClose }) => {
            const canvasRef = useRef(null);
            const [isDrawing, setIsDrawing] = useState(false);

            useEffect(() => {
                if (isOpen && canvasRef.current) {
                    const canvas = canvasRef.current;
                    canvas.width = canvas.offsetWidth;
                    canvas.height = canvas.offsetHeight;
                    const ctx = canvas.getContext('2d');
                    ctx.lineCap = 'round';
                    ctx.lineWidth = 3;
                    ctx.strokeStyle = '#3b82f6';
                }
            }, [isOpen]);

            const startDrawing = (e) => {
                const canvas = canvasRef.current;
                const ctx = canvas.getContext('2d');
                const rect = canvas.getBoundingClientRect();
                const clientX = e.touches ? e.touches[0].clientX : e.clientX;
                const clientY = e.touches ? e.touches[0].clientY : e.clientY;
                ctx.beginPath();
                ctx.moveTo(clientX - rect.left, clientY - rect.top);
                setIsDrawing(true);
            };

            const draw = (e) => {
                if (!isDrawing) return;
                e.preventDefault();
                const canvas = canvasRef.current;
                const ctx = canvas.getContext('2d');
                const rect = canvas.getBoundingClientRect();
                const clientX = e.touches ? e.touches[0].clientX : e.clientX;
                const clientY = e.touches ? e.touches[0].clientY : e.clientY;
                ctx.lineTo(clientX - rect.left, clientY - rect.top);
                ctx.stroke();
            };

            const stopDrawing = () => {
                setIsDrawing(false);
            };

            const clearCanvas = () => {
                const canvas = canvasRef.current;
                const ctx = canvas.getContext('2d');
                ctx.clearRect(0, 0, canvas.width, canvas.height);
            };

            if (!isOpen) return null;

            return (
                <div className="fixed inset-0 z-50 bg-black/60 backdrop-blur-sm flex items-center justify-center p-4 fade-in">
                    <div className="bg-white w-full max-w-2xl rounded-[2rem] shadow-2xl p-5 flex flex-col h-[80vh]">
                        <div className="flex justify-between items-center mb-4">
                            <h3 className="font-bold text-slate-800 text-lg flex items-center gap-2">
                                <i className="fa-solid fa-pen-to-square text-amber-500"></i> Papan Coretan
                            </h3>
                            <button onClick={onClose} className="w-8 h-8 bg-slate-100 hover:bg-slate-200 rounded-full flex items-center justify-center text-slate-600">
                                <i className="fa-solid fa-xmark"></i>
                            </button>
                        </div>
                        <div className="flex-1 bg-amber-50/50 rounded-2xl border-2 border-dashed border-amber-200 relative overflow-hidden">
                            <canvas 
                                ref={canvasRef} 
                                onMouseDown={startDrawing} onMouseMove={draw} onMouseUp={stopDrawing} onMouseLeave={stopDrawing}
                                onTouchStart={startDrawing} onTouchMove={draw} onTouchEnd={stopDrawing}
                                className="w-full h-full cursor-crosshair"
                            ></canvas>
                        </div>
                        <div className="mt-4 flex justify-end">
                            <button onClick={clearCanvas} className="bg-slate-100 hover:bg-slate-200 text-slate-700 font-bold py-2 px-6 rounded-xl flex items-center gap-2">
                                <i className="fa-solid fa-trash-can"></i> Bersihkan
                            </button>
                        </div>
                    </div>
                </div>
            );
        };

        // ==========================================
        // QUIZ ENGINE (Hanya Evaluasi)
        // ==========================================
        const QuizEngine = ({ studentName, subject, onComplete, onExit }) => {
            const [questions, setQuestions] = useState([]);
            const [currentIdx, setCurrentIdx] = useState(0);
            const [answers, setAnswers] = useState({});
            const [isFinished, setIsFinished] = useState(false);
            const [results, setResults] = useState(null);
            const [showHint, setShowHint] = useState(false);
            const [isScratchpadOpen, setScratchpadOpen] = useState(false);

            useEffect(() => {
                const dynamicQuestions = generateDynamicQuiz(subject);
                setQuestions(dynamicQuestions);
            }, [subject]);

            const handleAnswer = (optIdx) => {
                setAnswers(prev => ({ ...prev, [currentIdx]: optIdx }));
                setShowHint(false);
            };

            const clearAnswer = () => {
                setAnswers(prev => {
                    const newAns = { ...prev };
                    delete newAns[currentIdx];
                    return newAns;
                });
            };

            const finishQuiz = async () => {
                let correctCount = 0;
                let wrongCount = 0;
                let blankCount = 0;

                questions.forEach((q, idx) => {
                    if (answers[idx] === undefined) {
                        blankCount++;
                    } else if (answers[idx] === q.correct) {
                        correctCount++;
                    } else {
                        wrongCount++;
                    }
                });
                
                const rawScore = (correctCount * 4) + (wrongCount * -1) + (blankCount * 0);
                const maxPossibleRaw = questions.length * 4;
                let normalizedScore = Math.max(0, Math.round((rawScore / maxPossibleRaw) * 100));
                if(isNaN(normalizedScore)) normalizedScore = 0;

                const finalResultData = { 
                    score: normalizedScore, 
                    raw_score: rawScore,
                    correct: correctCount, 
                    wrong: wrongCount,
                    blank: blankCount,
                    total: questions.length, 
                    subject, // will be 'math_kmnr', etc
                    date: new Date().toLocaleDateString()
                };

                try {
                    const { data, error } = await supabase.from('quiz_history').insert([
                        { 
                            student_name: studentName, 
                            subject: subject, // Disimpan sebagai math_kmnr
                            score: normalizedScore, 
                            raw_score: rawScore 
                        }
                    ]).select();
                    
                    if (error) {
                        alert("ERROR SUPABASE! Pastikan Anda sudah membuat kolom 'student_name' bertipe text di tabel quiz_history. Pesan error asli: " + error.message);
                    }
                } catch (err) {
                    alert("KONEKSI CLOUD TERPUTUS: " + err.message);
                }

                setResults(finalResultData);
                setIsFinished(true);
                confetti({ particleCount: 150, spread: 80, origin: {y: 0.6} });
            };

            if (questions.length === 0) return <div className="p-8 text-center font-bold text-slate-500">Merapikan soal dari database...</div>;

            if (isFinished) {
                return (
                    <div className="min-h-screen bg-slate-50 flex flex-col p-4 sm:p-6 overflow-y-auto fade-in">
                        <div className="max-w-3xl w-full mx-auto">
                            <div className="bg-white rounded-[2rem] shadow-xl p-8 border border-slate-100 text-center mb-6">
                                <div className="inline-flex items-center justify-center w-20 h-20 bg-emerald-100 rounded-full mb-4">
                                    <i className="fa-solid fa-trophy text-4xl text-emerald-600"></i>
                                </div>
                                <h2 className="text-3xl font-display font-bold text-slate-800 mb-2">Evaluasi Selesai!</h2>
                                <p className="text-slate-500 mb-6">Berikut adalah hasil evaluasi komprehensif untuk {studentName}.</p>
                                
                                <div className="grid grid-cols-2 md:grid-cols-4 gap-4 mb-8">
                                    <div className="bg-blue-600 text-white p-4 rounded-2xl shadow-md">
                                        <span className="text-[10px] font-bold uppercase opacity-80">Skor Akhir</span>
                                        <div className="text-3xl font-black">{results.score}</div>
                                    </div>
                                    <div className="bg-emerald-50 text-emerald-700 p-4 rounded-2xl border border-emerald-100">
                                        <span className="text-[10px] font-bold uppercase">Benar (+4)</span>
                                        <div className="text-3xl font-black">{results.correct}</div>
                                    </div>
                                    <div className="bg-rose-50 text-rose-700 p-4 rounded-2xl border border-rose-100">
                                        <span className="text-[10px] font-bold uppercase">Salah (-1)</span>
                                        <div className="text-3xl font-black">{results.wrong}</div>
                                    </div>
                                    <div className="bg-amber-50 text-amber-700 p-4 rounded-2xl border border-amber-100">
                                        <span className="text-[10px] font-bold uppercase">Kosong (0)</span>
                                        <div className="text-3xl font-black">{results.blank}</div>
                                    </div>
                                </div>

                                <button onClick={onComplete} className="bg-slate-800 text-white font-bold py-3 px-8 rounded-xl hover:bg-slate-900 transition-colors shadow-md">
                                    <i className="fa-solid fa-house mr-2"></i> Kembali ke Dashboard
                                </button>
                            </div>

                            <div className="bg-white rounded-[2rem] shadow-sm p-6 sm:p-8 border border-slate-100">
                                <h3 className="text-xl font-bold font-display mb-6 text-slate-800 border-b pb-4"><i className="fa-solid fa-list-check mr-2"></i> Review & Pembahasan</h3>
                                <div className="space-y-6">
                                    {questions.map((q, idx) => {
                                        const isCorrect = answers[idx] === q.correct;
                                        const isBlank = answers[idx] === undefined;
                                        return (
                                            <div key={idx} className={`p-5 rounded-2xl border-l-4 ${isCorrect ? 'border-emerald-500 bg-emerald-50/30' : isBlank ? 'border-amber-500 bg-amber-50/30' : 'border-rose-500 bg-rose-50/30'}`}>
                                                <div className="flex items-center gap-2 mb-2">
                                                    <span className={`text-xs font-bold px-2 py-0.5 rounded text-white ${isCorrect ? 'bg-emerald-500' : isBlank ? 'bg-amber-500' : 'bg-rose-500'}`}>
                                                        {isCorrect ? 'BENAR' : isBlank ? 'KOSONG' : 'SALAH'}
                                                    </span>
                                                    <span className="text-xs font-bold text-slate-400">Soal {idx + 1}</span>
                                                </div>
                                                <p className="font-semibold text-slate-800 mb-3">{q.question}</p>
                                                <div className="text-sm space-y-1 mb-4">
                                                    <div className="flex gap-2">
                                                        <span className="text-slate-500 w-24">Jawabanmu:</span>
                                                        <span className={`font-semibold ${isCorrect ? 'text-emerald-700' : 'text-rose-700'}`}>{isBlank ? '-' : q.options[answers[idx]]}</span>
                                                    </div>
                                                    {!isCorrect && (
                                                        <div className="flex gap-2">
                                                            <span className="text-slate-500 w-24">Kunci:</span>
                                                            <span className="font-semibold text-emerald-700">{q.options[q.correct]}</span>
                                                        </div>
                                                    )}
                                                </div>
                                                <div className="bg-white p-3 rounded-xl border border-slate-200 text-sm text-slate-600">
                                                    <strong className="text-blue-700"><i className="fa-solid fa-lightbulb mr-1"></i> Pembahasan:</strong> {q.explanation}
                                                </div>
                                            </div>
                                        );
                                    })}
                                </div>
                            </div>
                        </div>
                    </div>
                );
            }

            const q = questions[currentIdx];
            const isAnswered = answers[currentIdx] !== undefined;
            const subjectLabel = subject.replace('_', ' ').toUpperCase();

            return (
                <div className="min-h-screen bg-slate-50 flex flex-col relative">
                    <Scratchpad isOpen={isScratchpadOpen} onClose={() => setScratchpadOpen(false)} />

                    <header className="bg-white border-b border-slate-200 px-4 py-3 flex justify-between items-center sticky top-0 z-30">
                        <div className="flex items-center gap-3">
                            <button onClick={onExit} className="w-10 h-10 bg-slate-100 rounded-full flex items-center justify-center text-slate-600 hover:bg-slate-200"><i className="fa-solid fa-arrow-left"></i></button>
                            <div>
                                <h1 className="font-bold text-slate-800 text-lg leading-tight uppercase font-display">{subjectLabel}</h1>
                                <span className="text-[10px] text-slate-500 font-semibold">Evaluasi Mandiri</span>
                            </div>
                        </div>
                        <div className="flex items-center gap-2">
                            <button onClick={() => setScratchpadOpen(true)} className="px-3 py-1.5 bg-amber-100 text-amber-700 font-bold text-xs rounded-lg hover:bg-amber-200"><i className="fa-solid fa-pen-nib mr-1"></i> Coretan</button>
                            <div className="font-mono font-bold bg-slate-800 text-white px-3 py-1.5 rounded-lg text-xs">{currentIdx + 1} / {questions.length}</div>
                        </div>
                    </header>

                    <main className="flex-1 max-w-3xl w-full mx-auto p-4 sm:p-6 flex flex-col justify-center slide-up">

                        <div className="bg-white rounded-3xl p-6 sm:p-8 shadow-sm border border-slate-200 relative">
                            <div className="flex justify-between items-center mb-6">
                                <span className="text-[10px] font-bold px-2.5 py-1 bg-slate-100 text-slate-500 rounded uppercase">{q.category}</span>
                                {q.hint && (
                                    <button onClick={() => setShowHint(!showHint)} className="text-[10px] font-bold px-2.5 py-1 bg-blue-50 text-blue-600 border border-blue-100 rounded hover:bg-blue-100">
                                        <i className="fa-solid fa-lightbulb mr-1"></i> Hint
                                    </button>
                                )}
                            </div>

                            {showHint && q.hint && (
                                <div className="mb-6 p-3 bg-amber-50 border border-amber-200 rounded-xl text-xs text-amber-800 font-medium fade-in">
                                    <strong>Bantuan Logika:</strong> {q.hint}
                                </div>
                            )}

                            <h2 className="text-lg sm:text-xl font-bold text-slate-800 mb-8 whitespace-pre-line leading-relaxed">{q.question}</h2>
                            
                            <div className="space-y-3">
                                {q.options.map((opt, idx) => {
                                    let btnClass = "border-slate-200 hover:border-blue-400 bg-white text-slate-700";
                                    let iconClass = "border-slate-300";
                                    
                                    if (answers[currentIdx] === idx) {
                                        btnClass = "border-blue-500 bg-blue-50 text-blue-900";
                                        iconClass = "border-blue-600 bg-blue-600";
                                    }

                                    return (
                                        <button key={idx} onClick={() => handleAnswer(idx)}
                                            className={`w-full text-left p-4 rounded-2xl border-2 transition-all group flex items-start gap-4 ${btnClass}`}>
                                            <div className={`w-6 h-6 shrink-0 rounded-full border-2 flex items-center justify-center mt-0.5 ${iconClass}`}>
                                                {answers[currentIdx] === idx && <div className="w-2.5 h-2.5 bg-white rounded-full"></div>}
                                            </div>
                                            <span className="text-base font-medium">{opt}</span>
                                        </button>
                                    );
                                })}
                            </div>

                            {isAnswered && (
                                <div className="mt-4 flex justify-end">
                                    <button onClick={clearAnswer} className="text-xs font-bold text-slate-400 hover:text-rose-500"><i className="fa-solid fa-eraser mr-1"></i> Kosongkan Jawaban</button>
                                </div>
                            )}
                        </div>

                        <div className="mt-6 flex justify-between items-center">
                            <button onClick={() => setCurrentIdx(Math.max(0, currentIdx - 1))} disabled={currentIdx === 0} className="px-5 py-3 font-bold text-slate-500 hover:text-slate-800 disabled:opacity-30"><i className="fa-solid fa-chevron-left mr-1"></i> Back</button>
                            
                            {currentIdx === questions.length - 1 ? (
                                <button onClick={finishQuiz} className="px-8 py-3.5 bg-emerald-600 text-white font-bold rounded-2xl shadow-lg hover:bg-emerald-700 transition transform hover:-translate-y-0.5"><i className="fa-solid fa-flag-checkered mr-2"></i> Submit Ujian</button>
                            ) : (
                                <button onClick={() => setCurrentIdx(currentIdx + 1)} className="px-8 py-3.5 bg-slate-800 text-white font-bold rounded-2xl shadow-lg hover:bg-slate-900 transition transform hover:-translate-y-0.5">Next <i className="fa-solid fa-chevron-right ml-1"></i></button>
                            )}
                        </div>
                    </main>
                </div>
            );
        };

        // ==========================================
        // STUDENT DASHBOARD
        // ==========================================
        const StudentDashboard = ({ studentName, onStartQuiz, onLogout }) => {
            const [activeMenu, setActiveMenu] = useState('Dashboard');
            const [history, setHistory] = useState([]);
            const [isLoading, setIsLoading] = useState(true);

            useEffect(() => {
                const fetchHistory = async () => {
                    try {
                        const { data, error } = await supabase
                            .from('quiz_history')
                            .select('id, subject, score, created_at, student_name')
                            .ilike('student_name', studentName)
                            .order('created_at', { ascending: false });
                        
                        if (!error) {
                            setHistory(data || []);
                        } else {
                            console.log("Supabase fetch error. Ignore jika belum buat kolom student_name", error);
                        }
                    } catch (err) {
                        console.error(err);
                    } finally {
                        setIsLoading(false);
                    }
                };
                fetchHistory();
            }, [activeMenu, studentName]);

            const handleResetHistory = async () => {
                if(window.confirm("Yakin ingin menghapus SEMUA riwayat ujian untuk " + studentName + "? Data yang dihapus tidak dapat dikembalikan.")) {
                    setIsLoading(true);
                    try {
                        const { error } = await supabase
                            .from('quiz_history')
                            .delete()
                            .ilike('student_name', studentName);
                        if (error) throw error;
                        setHistory([]);
                    } catch (err) {
                        alert("Gagal reset data: " + err.message);
                    } finally {
                        setIsLoading(false);
                    }
                }
            };

            const hasCompletedAny = history.length > 0;

            const calcExactScore = (exactSubj) => {
                const subjHist = history.filter(h => h.subject.toLowerCase() === exactSubj.toLowerCase());
                if (subjHist.length === 0) return 0;
                return Math.round(subjHist.reduce((acc, curr) => acc + curr.score, 0) / subjHist.length);
            };
            
            const calcMainScore = (prefix) => {
                const subjHist = history.filter(h => h.subject.toLowerCase().startsWith(prefix));
                if (subjHist.length === 0) return 0;
                return Math.round(subjHist.reduce((acc, curr) => acc + curr.score, 0) / subjHist.length);
            };

            const overallScore = hasCompletedAny ? Math.round(history.reduce((acc, curr) => acc + curr.score, 0) / history.length) : 0;
            
            const competencyVals = {
                math: calcMainScore('math_'),
                science: calcMainScore('science_'),
                english: calcMainScore('english_')
            };
            
            const subScores = {
                math_kmnr: calcExactScore('math_kmnr'),
                math_numerik: calcExactScore('math_numerik'),
                math_spasial: calcExactScore('math_spasial'),
                
                science_ksnr: calcExactScore('science_ksnr'),
                science_iksc: calcExactScore('science_iksc'),
                
                english_iklc: calcExactScore('english_iklc'),
                english_osi: calcExactScore('english_osi'),
                english_ef: calcExactScore('english_ef'),
                english_cambridge: calcExactScore('english_cambridge')
            };

            const difficultyVals = {
                low: hasCompletedAny ? Math.min(100, Math.round(overallScore + ((100 - overallScore) * 0.5))) : 0,
                mid: hasCompletedAny ? overallScore : 0,
                high: hasCompletedAny ? Math.max(0, Math.round(overallScore - ((100 - overallScore) * 0.5))) : 0,
            };

            const getStrongestSubject = () => {
                if (!hasCompletedAny) return "-";
                const max = Math.max(competencyVals.math, competencyVals.science, competencyVals.english);
                if (max === competencyVals.math) return "Mathematics";
                if (max === competencyVals.science) return "Science";
                return "English";
            };

            const getWeakestSubject = () => {
                if (!hasCompletedAny) return "-";
                const min = Math.min(competencyVals.math, competencyVals.science, competencyVals.english);
                if (min === competencyVals.math) return "Mathematics";
                if (min === competencyVals.science) return "Science";
                return "English";
            };

            const narrativeText = hasCompletedAny
                ? `Berdasarkan riwayat evaluasi, progres akademik ${studentName} secara keseluruhan berada pada tingkat ${overallScore >= 80 ? 'Sangat Memuaskan' : overallScore >= 60 ? 'Berkembang Baik' : 'Perlu Perhatian'} dengan skor rata-rata ${overallScore}. Pemahaman pada konsep dasar (Low) mencapai proporsi ${difficultyVals.low}%. Penguasaan pada soal menengah dan aplikasi (Mid) berada di angka ${difficultyVals.mid}%, ${difficultyVals.high >= 90 ? 'dan sangat impresif dalam' : 'sementara ruang berkembang masih terlihat pada'} penyelesaian soal HOTS atau tingkat tinggi (High) yang saat ini berada di ${difficultyVals.high}%. Saat ini, subjek terkuat adalah ${getStrongestSubject()}, disarankan untuk terus berlatih pada ${getWeakestSubject()} guna meratakan kompetensi secara komprehensif.`
                : "Belum ada data evaluasi yang cukup untuk menarik kesimpulan. Silakan kerjakan beberapa ujian mandiri terlebih dahulu untuk melihat analisis komprehensif di sini.";


            const menus = [
                { id: 'Dashboard', icon: 'fa-table-columns' },
                { id: 'Assessments', icon: 'fa-pen-to-square' },
                { id: 'Settings', icon: 'fa-gear' }
            ];

            return (
                <div className="min-h-screen bg-slate-900 sm:p-4 md:p-6 flex fade-in">
                    <div className="bg-white w-full rounded-none sm:rounded-[2rem] shadow-2xl flex flex-col lg:flex-row overflow-hidden">
                        
                        <aside className="w-full lg:w-64 bg-slate-800 text-white p-5 flex flex-col lg:flex-shrink-0 z-20">
                            <div className="flex items-center justify-between mb-8">
                                <div className="flex items-center gap-3">
                                    <div className="w-10 h-10 bg-gradient-to-br from-blue-400 to-indigo-600 rounded-xl flex items-center justify-center shadow-lg"><i className="fa-solid fa-rocket text-white"></i></div>
                                    <div>
                                        <div className="text-lg font-display font-bold leading-tight">To The Mars</div>
                                        <div className="text-[9px] text-blue-200 uppercase tracking-widest">Tools Learning</div>
                                    </div>
                                </div>
                                <button onClick={onLogout} className="lg:hidden text-slate-400 hover:text-white p-2"><i className="fa-solid fa-right-from-bracket"></i></button>
                            </div>

                            <nav className="flex lg:flex-col gap-2 overflow-x-auto pb-2 lg:pb-0 hide-scrollbar">
                                {menus.map(menu => (
                                    <button key={menu.id} onClick={() => setActiveMenu(menu.id)} 
                                        className={`px-4 py-3 rounded-xl text-sm font-semibold transition whitespace-nowrap flex items-center gap-3
                                        ${activeMenu === menu.id ? 'bg-blue-600 text-white shadow-md' : 'text-slate-400 hover:bg-slate-700 hover:text-slate-200'}`}>
                                        <i className={`fa-solid ${menu.icon} w-5`}></i> {menu.id}
                                    </button>
                                ))}
                            </nav>
                            <button onClick={onLogout} className="mt-auto hidden lg:flex px-4 py-3 text-left text-slate-400 hover:text-white items-center gap-3 text-sm font-semibold transition">
                                <i className="fa-solid fa-right-from-bracket w-5"></i> Keluar / Logout
                            </button>
                        </aside>

                        <main className="flex-1 bg-slate-50 overflow-y-auto">
                            {activeMenu === 'Dashboard' && (
                                <div className="p-6 md:p-8 space-y-6 fade-in">
                                    <div className="bg-white rounded-3xl p-6 md:p-8 flex flex-col md:flex-row items-center justify-between border border-slate-100 shadow-sm gap-6">
                                        <div>
                                            <h1 className="text-2xl md:text-3xl font-display font-bold text-slate-800 mb-2">Halo, {studentName}! <span className="text-2xl">👋</span></h1>
                                            <p className="text-slate-500 text-sm max-w-md">
                                                {isLoading ? "Memuat data nilai dari cloud..." : hasCompletedAny ? `Kemampuan analisismu semakin tajam. Skor rata-rata keseluruhanmu saat ini adalah ${overallScore}.` : "Selamat datang di Platform Akademik. Mari mulai evaluasi pertamamu!"}
                                            </p>
                                        </div>
                                        <div className="w-24 h-24 shrink-0 rounded-full border-4 border-emerald-100 bg-emerald-50 flex flex-col items-center justify-center">
                                            <span className="text-2xl font-black text-emerald-600 leading-none">{overallScore}</span>
                                            <span className="text-[10px] font-bold text-emerald-400 uppercase mt-1">Score</span>
                                        </div>
                                    </div>

                                    <h3 className="font-bold text-slate-800 font-display text-lg mb-4 mt-8"><i className="fa-solid fa-chart-pie text-blue-500 mr-2"></i>Detail Progress Penguasaan Materi</h3>
                                    <div className="grid grid-cols-1 md:grid-cols-3 gap-6 mb-8">
                                        {[
                                            { 
                                                label: "Mathematics", score: competencyVals.math, color: "#3b82f6", icon: "fa-calculator",
                                                subs: [
                                                    { name: "KMNR (Math Logic)", val: subScores.math_kmnr },
                                                    { name: "Numerik & Aritmetika", val: subScores.math_numerik },
                                                    { name: "Logika Spasial", val: subScores.math_spasial }
                                                ]
                                            },
                                            { 
                                                label: "Science", score: competencyVals.science, color: "#10b981", icon: "fa-flask",
                                                subs: [
                                                    { name: "KSNR (Sains Nasional)", val: subScores.science_ksnr },
                                                    { name: "IKSC (Int. Kangaroo)", val: subScores.science_iksc }
                                                ]
                                            },
                                            { 
                                                label: "English", score: competencyVals.english, color: "#f43f5e", icon: "fa-globe",
                                                subs: [
                                                    { name: "IKLC", val: subScores.english_iklc },
                                                    { name: "OSI (Omni Sains)", val: subScores.english_osi },
                                                    { name: "EF / Cambridge", val: subScores.english_ef }
                                                ]
                                            }
                                        ].map((item, i) => (
                                            <div key={i} className="bg-white rounded-3xl p-6 border border-slate-100 shadow-sm flex flex-col">
                                                <div className="flex items-center gap-3 mb-6">
                                                    <div className="w-12 h-12 rounded-xl flex items-center justify-center text-white shadow-md" style={{backgroundColor: item.color}}>
                                                        <i className={`fa-solid ${item.icon} text-xl`}></i>
                                                    </div>
                                                    <div>
                                                        <h3 className="font-bold text-slate-800 text-lg leading-none">{item.label}</h3>
                                                        <span className="text-xs font-bold text-slate-400">Total Score: {item.score}</span>
                                                    </div>
                                                </div>
                                                <div className="space-y-4 flex-1">
                                                    {item.subs.map((sub, j) => (
                                                        <div key={j}>
                                                            <div className="flex justify-between text-[10px] font-bold mb-1">
                                                                <span className="text-slate-500 uppercase">{sub.name}</span>
                                                                <span className="text-slate-700">{sub.val}%</span>
                                                            </div>
                                                            <div className="w-full bg-slate-100 rounded-full h-1.5 overflow-hidden">
                                                                <div className="h-full rounded-full transition-all duration-1000" style={{width: `${sub.val}%`, backgroundColor: item.color}}></div>
                                                            </div>
                                                        </div>
                                                    ))}
                                                </div>
                                            </div>
                                        ))}
                                    </div>

                                    <div className="grid grid-cols-1 lg:grid-cols-2 gap-6 mt-8">
                                        <div className="bg-white rounded-3xl p-6 md:p-8 border border-slate-100 shadow-sm">
                                            <h3 className="font-bold text-slate-800 mb-4 font-display text-lg"><i className="fa-solid fa-file-lines text-blue-500 mr-2"></i>Kesimpulan Komprehensif</h3>
                                            <p className="text-slate-600 leading-relaxed text-sm text-justify">
                                                {narrativeText}
                                            </p>
                                        </div>

                                        <div className="bg-white rounded-3xl p-6 md:p-8 border border-slate-100 shadow-sm">
                                            <h3 className="font-bold text-slate-800 mb-4 font-display text-lg"><i className="fa-solid fa-layer-group text-purple-500 mr-2"></i>Penguasaan Tingkat Kesulitan</h3>
                                            
                                            <div className="flex flex-col md:flex-row gap-6 mt-6">
                                                <div className="flex-1 flex items-center gap-4">
                                                    <div className="w-16 font-bold text-slate-700 text-sm">Low</div>
                                                    <div className="flex-1 bg-slate-100 rounded-full h-3 overflow-hidden">
                                                        <div className="h-full bg-emerald-500 rounded-full transition-all duration-1000" style={{width: `${difficultyVals.low}%`}}></div>
                                                    </div>
                                                    <div className="w-10 text-right font-bold text-emerald-600 text-sm">{difficultyVals.low}%</div>
                                                </div>
                                                <div className="flex-1 flex items-center gap-4">
                                                    <div className="w-16 font-bold text-slate-700 text-sm">Mid</div>
                                                    <div className="flex-1 bg-slate-100 rounded-full h-3 overflow-hidden">
                                                        <div className="h-full bg-blue-500 rounded-full transition-all duration-1000" style={{width: `${difficultyVals.mid}%`}}></div>
                                                    </div>
                                                    <div className="w-10 text-right font-bold text-blue-600 text-sm">{difficultyVals.mid}%</div>
                                                </div>
                                                <div className="flex-1 flex items-center gap-4">
                                                    <div className="w-16 font-bold text-slate-700 text-sm">High</div>
                                                    <div className="flex-1 bg-slate-100 rounded-full h-3 overflow-hidden">
                                                        <div className="h-full bg-rose-500 rounded-full transition-all duration-1000" style={{width: `${difficultyVals.high}%`}}></div>
                                                    </div>
                                                    <div className="w-10 text-right font-bold text-rose-600 text-sm">{difficultyVals.high}%</div>
                                                </div>
                                            </div>
                                            <p className="text-[10px] text-slate-400 mt-6 italic text-center md:text-left">*Low = Foundation (R1/R2), Mid = Standard (R3), High = Advanced (R4)</p>
                                        </div>
                                    </div>
                                </div>
                            )}

                            {activeMenu === 'Assessments' && (
                                <div className="p-6 md:p-8 fade-in">
                                    <h2 className="text-2xl font-display font-bold text-slate-800 mb-2">Evaluasi Mandiri (Ujian)</h2>
                                    <p className="text-sm text-slate-500 mb-8">Pilih spesialisasi ujian di bawah ini. Pastikan Anda siap mengerjakan 25 soal.</p>
                                    
                                    <div className="space-y-8 mb-10">
                                        {/* MATHEMATICS BLOCK */}
                                        <div className="bg-white rounded-3xl p-6 border border-slate-100 shadow-sm relative overflow-hidden">
                                            <i className="fa-solid fa-calculator absolute -right-6 -bottom-6 text-8xl text-slate-50 opacity-50"></i>
                                            <h3 className="font-bold text-blue-600 text-xl font-display mb-4 relative z-10"><i className="fa-solid fa-calculator mr-2"></i>Mathematics</h3>
                                            <div className="grid grid-cols-1 sm:grid-cols-3 gap-3 relative z-10">
                                                <button onClick={() => onStartQuiz('math_kmnr')} className="bg-blue-50 hover:bg-blue-600 text-blue-700 hover:text-white border border-blue-200 hover:border-blue-600 px-4 py-4 rounded-2xl font-bold transition text-sm">KMNR (Math Logic)</button>
                                                <button onClick={() => onStartQuiz('math_numerik')} className="bg-blue-50 hover:bg-blue-600 text-blue-700 hover:text-white border border-blue-200 hover:border-blue-600 px-4 py-4 rounded-2xl font-bold transition text-sm">Numerik & Aritmetika</button>
                                                <button onClick={() => onStartQuiz('math_spasial')} className="bg-blue-50 hover:bg-blue-600 text-blue-700 hover:text-white border border-blue-200 hover:border-blue-600 px-4 py-4 rounded-2xl font-bold transition text-sm">Logika Spasial</button>
                                            </div>
                                        </div>

                                        {/* SCIENCE BLOCK */}
                                        <div className="bg-white rounded-3xl p-6 border border-slate-100 shadow-sm relative overflow-hidden">
                                            <i className="fa-solid fa-flask absolute -right-6 -bottom-6 text-8xl text-slate-50 opacity-50"></i>
                                            <h3 className="font-bold text-emerald-600 text-xl font-display mb-4 relative z-10"><i className="fa-solid fa-flask mr-2"></i>Science</h3>
                                            <div className="grid grid-cols-1 sm:grid-cols-2 gap-3 relative z-10">
                                                <button onClick={() => onStartQuiz('science_ksnr')} className="bg-emerald-50 hover:bg-emerald-600 text-emerald-700 hover:text-white border border-emerald-200 hover:border-emerald-600 px-4 py-4 rounded-2xl font-bold transition text-sm">KSNR</button>
                                                <button onClick={() => onStartQuiz('science_iksc')} className="bg-emerald-50 hover:bg-emerald-600 text-emerald-700 hover:text-white border border-emerald-200 hover:border-emerald-600 px-4 py-4 rounded-2xl font-bold transition text-sm">IKSC (Int. Kangaroo)</button>
                                            </div>
                                        </div>

                                        {/* ENGLISH BLOCK */}
                                        <div className="bg-white rounded-3xl p-6 border border-slate-100 shadow-sm relative overflow-hidden">
                                            <i className="fa-solid fa-globe absolute -right-6 -bottom-6 text-8xl text-slate-50 opacity-50"></i>
                                            <h3 className="font-bold text-rose-600 text-xl font-display mb-4 relative z-10"><i className="fa-solid fa-globe mr-2"></i>English</h3>
                                            <div className="grid grid-cols-1 sm:grid-cols-3 gap-3 relative z-10">
                                                <button onClick={() => onStartQuiz('english_iklc')} className="bg-rose-50 hover:bg-rose-600 text-rose-700 hover:text-white border border-rose-200 hover:border-rose-600 px-4 py-4 rounded-2xl font-bold transition text-sm">IKLC</button>
                                                <button onClick={() => onStartQuiz('english_osi')} className="bg-rose-50 hover:bg-rose-600 text-rose-700 hover:text-white border border-rose-200 hover:border-rose-600 px-4 py-4 rounded-2xl font-bold transition text-sm">OSI (Omni Sains)</button>
                                                <button onClick={() => onStartQuiz('english_ef')} className="bg-rose-50 hover:bg-rose-600 text-rose-700 hover:text-white border border-rose-200 hover:border-rose-600 px-4 py-4 rounded-2xl font-bold transition text-sm">EF / Cambridge</button>
                                            </div>
                                        </div>
                                    </div>

                                    <h3 className="font-bold text-slate-800 mb-4 font-display">Riwayat Ujian ({studentName})</h3>
                                    <div className="bg-white rounded-2xl border border-slate-200 overflow-hidden">
                                        {isLoading ? (
                                            <div className="p-8 text-center text-slate-400 italic">Memuat data dari database...</div>
                                        ) : hasCompletedAny ? (
                                            <table className="w-full text-left text-sm">
                                                <thead className="bg-slate-50 text-slate-500 font-bold border-b border-slate-200">
                                                    <tr>
                                                        <th className="px-4 py-3">Tanggal Waktu</th>
                                                        <th className="px-4 py-3">Subjek</th>
                                                        <th className="px-4 py-3 text-right">Skor (100)</th>
                                                    </tr>
                                                </thead>
                                                <tbody>
                                                    {history.map((h, i) => {
                                                        const dateStrRaw = h.created_at.includes('Z') || h.created_at.includes('+') ? h.created_at : h.created_at.replace(' ', 'T') + 'Z';
                                                        const dateObj = new Date(dateStrRaw);
                                                        const dateStr = dateObj.toLocaleDateString('id-ID') + ' ' + dateObj.toLocaleTimeString('id-ID', {hour: '2-digit', minute:'2-digit'});
                                                        let cleanSubject = h.subject.replace('_', ' ').toUpperCase();
                                                        return (
                                                            <tr key={h.id || i} className="border-b border-slate-100 last:border-0 hover:bg-slate-50">
                                                                <td className="px-4 py-3 text-slate-500">{dateStr}</td>
                                                                <td className="px-4 py-3 font-semibold text-slate-700">{cleanSubject}</td>
                                                                <td className="px-4 py-3 text-right font-black text-slate-800">{h.score}</td>
                                                            </tr>
                                                        );
                                                    })}
                                                </tbody>
                                            </table>
                                        ) : (
                                            <div className="p-8 text-center text-slate-400 italic">Belum ada riwayat ujian tersimpan di cloud.</div>
                                        )}
                                    </div>
                                </div>
                            )}

                            {activeMenu === 'Settings' && (
                                <div className="p-6 md:p-8 fade-in max-w-xl">
                                    <h2 className="text-2xl font-display font-bold text-slate-800 mb-6">Settings</h2>
                                    <div className="bg-white rounded-3xl p-6 border border-slate-100 shadow-sm space-y-4">
                                        <div className="flex justify-between items-center pb-4 border-b border-slate-100">
                                            <div>
                                                <div className="font-bold text-slate-800">Akun Siswa</div>
                                                <div className="text-xs text-slate-500">{studentName} (Multi-user Mode)</div>
                                            </div>
                                        </div>
                                        <div className="flex justify-between items-center pb-4 border-b border-slate-100">
                                            <div>
                                                <div className="font-bold text-slate-800">Koneksi Supabase</div>
                                                <div className="text-xs text-emerald-500 font-bold"><i className="fa-solid fa-circle text-[8px] mr-1"></i> Terhubung (Cloud Sync Active)</div>
                                            </div>
                                        </div>
                                        <div className="pt-4 space-y-3">
                                            <button onClick={handleResetHistory} className="w-full py-3 bg-red-50 text-red-600 hover:bg-red-100 font-bold rounded-xl transition flex items-center justify-center gap-2 border border-red-100">
                                                <i className="fa-solid fa-trash-can"></i> Hapus Seluruh Riwayat Ujian
                                            </button>
                                            <button onClick={onLogout} className="w-full py-3 bg-slate-100 text-slate-700 hover:bg-slate-200 font-bold rounded-xl transition flex items-center justify-center gap-2">
                                                <i className="fa-solid fa-right-from-bracket"></i> Ganti Akun / Logout
                                            </button>
                                        </div>
                                    </div>
                                </div>
                            )}
                        </main>
                    </div>
                </div>
            );
        };

        // ==========================================
        // LOGIN SCREEN (Multi-User)
        // ==========================================
        const LoginScreen = ({ onLogin }) => {
            const [name, setName] = useState('');
            const handleSubmit = (e) => {
                e.preventDefault();
                if(name.trim()) onLogin(name.trim());
            };
            return (
                <div className="min-h-screen flex items-center justify-center bg-slate-100 p-4 fade-in">
                    <div className="bg-white p-8 md:p-12 rounded-[2rem] shadow-xl max-w-md w-full text-center border border-slate-200">
                        <div className="w-16 h-16 bg-gradient-to-br from-blue-500 to-indigo-600 rounded-2xl mx-auto mb-6 flex items-center justify-center shadow-lg">
                            <i className="fa-solid fa-rocket text-2xl text-white"></i>
                        </div>
                        <h1 className="text-3xl font-display font-bold text-slate-800 mb-2">To The Mars</h1>
                        <p className="text-blue-600 font-bold text-xs tracking-widest uppercase mb-10">Tools Learning (v4.0)</p>

                        <form onSubmit={handleSubmit} className="space-y-4">
                            <div>
                                <input 
                                    type="text" 
                                    placeholder="Masukkan Nama Kamu..." 
                                    value={name}
                                    onChange={(e) => setName(e.target.value)}
                                    className="w-full bg-slate-50 border border-slate-200 text-slate-800 font-bold py-4 px-6 rounded-2xl text-center focus:outline-none focus:border-blue-500 focus:ring-2 focus:ring-blue-200 transition"
                                    required
                                />
                            </div>
                            <button type="submit" className="w-full bg-blue-600 hover:bg-blue-700 text-white font-bold py-4 rounded-2xl transition shadow-lg transform hover:-translate-y-0.5">
                                Mulai Belajar <i className="fa-solid fa-arrow-right ml-2"></i>
                            </button>
                        </form>
                    </div>
                </div>
            );
        }

        // ==========================================
        // MAIN APP ROUTER
        // ==========================================
        const App = () => {
            const [studentName, setStudentName] = useState(() => localStorage.getItem('mars_student_name') || null);
            const [view, setView] = useState('DASHBOARD');
            const [selectedSubject, setSelectedSubject] = useState(null);

            if (!studentName) {
                return <LoginScreen onLogin={(name) => {
                    localStorage.setItem('mars_student_name', name);
                    setStudentName(name);
                }} />;
            }
            
            if (view === 'QUIZ') {
                return <QuizEngine 
                    studentName={studentName}
                    subject={selectedSubject} 
                    onComplete={() => setView('DASHBOARD')} 
                    onExit={() => setView('DASHBOARD')} 
                />;
            }

            return <StudentDashboard 
                studentName={studentName}
                onStartQuiz={(subj) => { 
                    setSelectedSubject(subj); 
                    setView('QUIZ'); 
                }} 
                onLogout={() => { localStorage.removeItem('mars_student_name'); setStudentName(null); setView('DASHBOARD'); }} 
            />;
        };

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
