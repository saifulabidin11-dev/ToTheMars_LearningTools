        // HELPER FUNGSI
        const shuffleArray = (array) => {
            let newArr = [...array];
            for (let i = newArr.length - 1; i > 0; i--) {
                const j = Math.floor(Math.random() * (i + 1));
                [newArr[i], newArr[j]] = [newArr[j], newArr[i]];
            }
            return newArr;
        };

        const formatDate = (isoString) => {
            const date = new Date(isoString);
            return date.toLocaleDateString('id-ID', {
                day: 'numeric', month: 'short', year: 'numeric',
                hour: '2-digit', minute: '2-digit'
            });
        };

        // GENERATOR KUIS DENGAN LOGIKA SESI IKSC (20x5)
        const generateDynamicQuiz = (subjectKey, studentName) => {
            const historyKey = `used_qs_${studentName}_${subjectKey}`;
            let usedIds = JSON.parse(localStorage.getItem(historyKey) || "[]");
            const namesM = ["Andi", "Budi", "Dodi", "Edo", "Fandi", "Rafa", "Vano", "Dion"];
            const namesF = ["Ria", "Siti", "Nala", "Lina", "Tini", "Dina", "Amara", "Vega"];
            
            let rawPool = dbQuestions[subjectKey] || [];
            if(rawPool.length === 0) return [];

            let uniquePool = [];
            let seenQuestions = new Set();
            for (let q of rawPool) {
                let cleanQuestionKey = q.question.trim().toLowerCase();
                if (!seenQuestions.has(cleanQuestionKey)) {
                    seenQuestions.add(cleanQuestionKey);
                    uniquePool.push(q);
                }
            }
            
            let availableQuestions = uniquePool.filter(q => !usedIds.includes(q.id));
            let selectedRaw = [];
            let takeCount = subjectKey.includes('iksc') ? 20 : 25;
            
            if (availableQuestions.length >= takeCount) {
                // LOGIKA ADAPTIF IKSC KHUSUS
                if (subjectKey === "science_iksc" && uniquePool.length === 100) {
                     let sessionIndex = Math.floor(usedIds.length / 20);
                     if (sessionIndex >= 5) sessionIndex = 0; // fallback bug
                     
                     for (let i = 0; i < 20; i++) {
                          let indexToPick = (i * 5) + sessionIndex;
                          if (indexToPick < uniquePool.length) {
                              selectedRaw.push(uniquePool[indexToPick]);
                          }
                     }
                     selectedRaw = shuffleArray(selectedRaw);
                } else {
                     selectedRaw = shuffleArray(availableQuestions).slice(0, takeCount);
                }
                
                let newUsedIds = [...usedIds, ...selectedRaw.map(q => q.id)];
                localStorage.setItem(historyKey, JSON.stringify(newUsedIds));
            } else {
                // RESET JIKA HABIS 100 SOAL
                let remainingFresh = shuffleArray(availableQuestions);
                let neededCount = takeCount - remainingFresh.length;
                let freshIds = new Set(remainingFresh.map(q => q.id));
                let recycledPool = uniquePool.filter(q => !freshIds.has(q.id));
                let fillers = shuffleArray(recycledPool).slice(0, neededCount);
                
                selectedRaw = shuffleArray([...remainingFresh, ...fillers]);
                localStorage.setItem(historyKey, JSON.stringify(selectedRaw.map(q => q.id)));
            }

            let finalQuestions = [];
            selectedRaw.forEach(q => {
                let v = Math.floor(Math.random() * 8);
                let newQ = JSON.parse(JSON.stringify(q));
                
                let replaceText = (text) => {
                    if(!text) return text;
                    return text.replace(/Andi/g, namesM[v]).replace(/Budi/g, namesM[(v+1)%8])
                               .replace(/Ria/g, namesF[v]).replace(/Nala/g, namesF[(v+1)%8]);
                };
                newQ.question = replaceText(newQ.question);
                if(newQ.explanation) newQ.explanation = replaceText(newQ.explanation);
                
                let optsWithIndex = newQ.options.map((opt, idx) => ({ text: replaceText(opt), originalIndex: idx }));
                optsWithIndex = shuffleArray(optsWithIndex);
                let newCorrectIndex = optsWithIndex.findIndex(opt => opt.originalIndex === newQ.correct);
                
                newQ.options = optsWithIndex.map(opt => opt.text);
                newQ.correct = newCorrectIndex;
                finalQuestions.push(newQ);
            });
            
            return finalQuestions;
        };

                    const canvas = canvasRef.current;
                    canvas.width = canvas.offsetWidth;
                    canvas.height = canvas.offsetHeight;
                    const ctx = canvas.getContext('2d');
                    ctx.lineCap = 'round';
                    ctx.lineJoin = 'round';
                    ctx.lineWidth = 3;
                    ctx.strokeStyle = '#3b82f6';
                }
            }, [isOpen]);

            const onDragStart = (e) => {
                if (headerRef.current) headerRef.current.setPointerCapture(e.pointerId);
                setIsDragging(true);
                setDragStart({ x: e.clientX - position.x, y: e.clientY - position.y });
            };
            const onDragMove = (e) => {
                if (!isDragging) return;
                if(e.cancelable) e.preventDefault();
                setPosition({ x: e.clientX - dragStart.x, y: e.clientY - dragStart.y });
            };
            const onDragEnd = (e) => {
                setIsDragging(false);
                if (headerRef.current && e.pointerId) {
                    try { headerRef.current.releasePointerCapture(e.pointerId); } catch(err) {}
                }
            };
            const startDrawing = (e) => {
                const canvas = canvasRef.current;
                if(e.pointerId) canvas.setPointerCapture(e.pointerId);
                const ctx = canvas.getContext('2d');
                const rect = canvas.getBoundingClientRect();
                ctx.beginPath();
                ctx.moveTo(e.clientX - rect.left, e.clientY - rect.top);
                setIsDrawing(true);
            };
            const draw = (e) => {
                if (!isDrawing) return;
                if(e.cancelable) e.preventDefault();
                const canvas = canvasRef.current;
                const ctx = canvas.getContext('2d');
                const rect = canvas.getBoundingClientRect();
                ctx.lineTo(e.clientX - rect.left, e.clientY - rect.top);
                ctx.stroke();
            };
            const stopDrawing = (e) => {
                if (isDrawing && canvasRef.current && e.pointerId) {
                    try { canvasRef.current.releasePointerCapture(e.pointerId); } catch(err) {}
                }
                setIsDrawing(false);
            };
            const clearCanvas = () => {
                const canvas = canvasRef.current;
                const ctx = canvas.getContext('2d');
                ctx.clearRect(0, 0, canvas.width, canvas.height);
            };

            if (!isOpen) return null;
            return (
                <div className="fixed z-40 bg-white rounded-3xl shadow-[0_10px_40px_rgba(0,0,0,0.15)] flex flex-col border-2 border-slate-200 fade-in" style={{ left: `${position.x}px`, top: `${position.y}px`, width: '320px', height: '400px', touchAction: 'none' }}>
                    <div ref={headerRef} className="flex justify-between items-center m-2 p-2 px-3 bg-slate-100 hover:bg-slate-200 rounded-2xl cursor-move transition-colors select-none touch-none border border-slate-200/60" onPointerDown={onDragStart} onPointerMove={onDragMove} onPointerUp={onDragEnd} onPointerCancel={onDragEnd}>
                        <h3 className="font-bold text-slate-700 text-xs flex items-center gap-2 pointer-events-none"><i className="fa-solid fa-arrows-up-down-left-right text-slate-400"></i> Papan Coretan</h3>
                        <button onPointerDown={(e) => e.stopPropagation()} onClick={(e) => { e.stopPropagation(); onClose(); }} className="w-7 h-7 bg-white hover:bg-rose-100 hover:text-rose-600 rounded-full flex items-center justify-center text-slate-500 transition-colors shadow-sm"><i className="fa-solid fa-xmark"></i></button>
                    </div>
                    <div className="flex-1 mx-3 mb-2 bg-amber-50/50 rounded-2xl border-2 border-dashed border-amber-200 relative overflow-hidden">
                        <canvas ref={canvasRef} onPointerDown={startDrawing} onPointerMove={draw} onPointerUp={stopDrawing} onPointerCancel={stopDrawing} onPointerOut={stopDrawing} className="w-full h-full cursor-crosshair" style={{ touchAction: 'none' }}></canvas>
                    </div>
                    <div className="mx-3 mb-3 flex justify-end">
                        <button onClick={clearCanvas} className="w-full bg-slate-100 hover:bg-slate-200 text-slate-700 font-bold py-2 px-4 rounded-xl flex items-center justify-center gap-2 text-sm transition-colors border border-slate-200"><i className="fa-solid fa-eraser"></i> Bersihkan Layar</button>
                    </div>
                </div>
            );
        };

        // KOMPONEN UTAMA KUIS (Mesin Soal)
        const QuizEngine = ({ studentName, subject, onComplete, onExit }) => {
            const [questions, setQuestions] = useState([]);
            const [currentIdx, setCurrentIdx] = useState(0);
            const [answers, setAnswers] = useState({});
            const [isFinished, setIsFinished] = useState(false);
            const [results, setResults] = useState(null);
            const [showHint, setShowHint] = useState(false);
            const [isScratchpadOpen, setScratchpadOpen] = useState(false);

            useEffect(() => {
                const dynamicQuestions = generateDynamicQuiz(subject, studentName);
                setQuestions(dynamicQuestions);
            }, [subject, studentName]);

            const handleAnswer = (optIdx) => {
                setAnswers(prev => ({ ...prev, [currentIdx]: optIdx }));
                setShowHint(false);
            };

            const clearAnswer = () => {
                setAnswers(prev => {
                    const newAns = { ...prev };
                    delete newAns[currentIdx];
                    return newAns;
                });
            };

            const finishQuiz = async () => {
                let correctCount = 0;
                let wrongCount = 0;
                let blankCount = 0;

                questions.forEach((q, idx) => {
                    if (answers[idx] === undefined) {
                        blankCount++;
                    } else if (answers[idx] === q.correct) {
                        correctCount++;
                    } else {
                        wrongCount++;
                    }
                });

                const total = questions.length;
                const score = total > 0 ? Math.round((correctCount / total) * 100) : 0;

                setResults({ total, correct: correctCount, wrong: wrongCount, blank: blankCount, score });
                setIsFinished(true);

                if (score >= 80) {
                    confetti({ particleCount: 150, spread: 80, origin: { y: 0.6 }, colors: ['#fbbf24', '#f87171', '#60a5fa', '#34d399'] });
                }

                try {
                    await supabase.from('quiz_history').insert([{
                        student_name: studentName,
                        subject: subject,
                        score: score,
                        total_questions: total,
                        correct_answers: correctCount
                    }]);
                } catch (err) {
                    console.error('Failed to save score:', err);
                }
            };

            if (questions.length === 0) {
                return (
                    <div className="min-h-screen flex flex-col items-center justify-center gap-4 bg-slate-50">
                        <div className="animate-spin rounded-full h-12 w-12 border-4 border-indigo-200 border-t-indigo-600"></div>
                        <p className="text-slate-500 font-medium">Wah, soalnya belum tersedia nih. Nanti di-update ya!</p>
                        <button onClick={onExit} className="px-6 py-2 bg-slate-200 text-slate-700 font-bold rounded-xl mt-4">Kembali</button>
                    </div>
                );
            }

            if (isFinished) {
                return (
                    <div className="min-h-screen flex flex-col items-center justify-center p-6 bg-slate-50 fade-in">
                        <div className="bg-white p-10 rounded-[2rem] shadow-xl w-full max-w-lg text-center border-2 border-slate-100 relative overflow-hidden">
                            <div className="absolute top-0 left-0 w-full h-3 bg-gradient-to-r from-indigo-500 via-purple-500 to-pink-500"></div>
                            
                            <div className="mb-6 inline-flex items-center justify-center w-24 h-24 rounded-full bg-gradient-to-tr from-indigo-100 to-purple-100 text-indigo-600 text-4xl shadow-inner transform rotate-12">
                                {results.score >= 80 ? '🚀' : results.score >= 60 ? '👍' : '💪'}
                            </div>

                            <h2 className="text-3xl font-display font-bold text-slate-800 mb-2">Misi Selesai, {studentName}!</h2>
                            <p className="text-slate-500 mb-8 font-medium">Ini dia hasil analisis petualangan belajarmu hari ini.</p>
                            
                            <div className="grid grid-cols-2 gap-4 mb-8">
                                <div className="bg-slate-50 p-4 rounded-2xl border border-slate-100 flex flex-col items-center">
                                    <span className="text-sm text-slate-500 font-semibold mb-1">Skor Akhir</span>
                                    <span className={`text-4xl font-display font-bold ${results.score >= 80 ? 'text-green-500' : results.score >= 60 ? 'text-amber-500' : 'text-rose-500'}`}>
                                        {results.score}
                                    </span>
                                </div>
                                <div className="bg-slate-50 p-4 rounded-2xl border border-slate-100 flex flex-col items-center">
                                    <span className="text-sm text-slate-500 font-semibold mb-1">Benar</span>
                                    <span className="text-4xl font-display font-bold text-indigo-600">{results.correct}</span>
                                </div>
                            </div>
                            
                            <div className="flex gap-4">
                                <button onClick={onExit} className="flex-1 px-6 py-3 rounded-xl font-bold text-slate-600 bg-slate-100 hover:bg-slate-200 transition-colors">
                                    Kembali ke Dashboard
                                </button>
                                <button onClick={() => window.location.reload()} className="flex-1 px-6 py-3 rounded-xl font-bold text-white bg-indigo-600 hover:bg-indigo-700 shadow-lg shadow-indigo-200 transition-all hover:-translate-y-0.5">
                                    Main Lagi
                                </button>
                            </div>
                        </div>
                    </div>
                );
            }

            const q = questions[currentIdx];
            const hasAnswered = answers[currentIdx] !== undefined;

            return (
                <div className="min-h-screen flex flex-col bg-slate-50">
                    <div className="bg-white px-6 py-4 border-b border-slate-200 sticky top-0 z-20 shadow-sm flex items-center justify-between">
                        <div className="flex items-center gap-4">
                            <button onClick={onExit} className="w-10 h-10 flex items-center justify-center rounded-full bg-slate-100 text-slate-600 hover:bg-slate-200 transition-colors">
                                <i className="fa-solid fa-arrow-left"></i>
                            </button>
                            <div>
                                <div className="text-xs font-bold text-indigo-600 tracking-wider uppercase">{subject.replace('_', ' ')}</div>
                                <div className="text-sm font-semibold text-slate-500">Soal {currentIdx + 1} dari {questions.length}</div>
                            </div>
                        </div>
                        
                        <div className="hidden md:flex flex-1 max-w-md mx-8 items-center gap-3">
                            <div className="h-2 flex-1 bg-slate-100 rounded-full overflow-hidden">
                                <div 
                                    className="h-full bg-indigo-500 rounded-full transition-all duration-500"
                                    style={{ width: `${((currentIdx + 1) / questions.length) * 100}%` }}
                                ></div>
                            </div>
                            <span className="text-xs font-bold text-slate-400">{Math.round(((currentIdx + 1) / questions.length) * 100)}%</span>
                        </div>

                        <div className="flex items-center gap-3">
                            <button 
                                onClick={() => setScratchpadOpen(!isScratchpadOpen)}
                                className={`px-4 py-2 rounded-xl font-semibold text-sm transition-colors flex items-center gap-2 ${isScratchpadOpen ? 'bg-amber-100 text-amber-700 border border-amber-200' : 'bg-white border border-slate-200 text-slate-600 hover:bg-slate-50'}`}
                            >
                                <i className="fa-solid fa-pen-nib"></i> <span className="hidden sm:inline">Coretan</span>
                            </button>
                            <button onClick={finishQuiz} className="px-5 py-2 rounded-xl font-bold text-sm bg-rose-50 text-rose-600 hover:bg-rose-100 transition-colors">
                                Akhiri
                            </button>
                        </div>
                    </div>

                    <Scratchpad isOpen={isScratchpadOpen} onClose={() => setScratchpadOpen(false)} />

                    <div className="flex-1 flex flex-col items-center w-full max-w-3xl mx-auto px-4 py-8 slide-up">
                        <div className="w-full bg-white rounded-3xl shadow-sm border border-slate-200 overflow-hidden mb-6 relative">
                            <div className="absolute top-0 left-0 w-1 bg-indigo-500 h-full"></div>
                            <div className="p-6 md:p-8">
                                <div className="flex items-center gap-2 mb-4">
                                    <span className="px-3 py-1 bg-indigo-50 text-indigo-600 text-xs font-bold rounded-lg border border-indigo-100">
                                        {q.category}
                                    </span>
                                    {q.difficulty === 'ADVANCED' && (
                                        <span className="px-3 py-1 bg-rose-50 text-rose-600 text-xs font-bold rounded-lg border border-rose-100 flex items-center gap-1">
                                            <i className="fa-solid fa-fire text-[10px]"></i> HOTS
                                        </span>
                                    )}
                                </div>
                                <h2 className="text-xl md:text-2xl font-semibold text-slate-800 leading-relaxed">
                                    {q.question}
                                </h2>
                            </div>
                        </div>

                        <div className="w-full grid gap-3 mb-8">
                            {q.options.map((opt, idx) => {
                                const isSelected = answers[currentIdx] === idx;
                                const letters = ['A', 'B', 'C', 'D'];
                                
                                return (
                                    <button
                                        key={idx}
                                        onClick={() => handleAnswer(idx)}
                                        className={`group relative w-full text-left p-4 rounded-2xl border-2 transition-all duration-200 flex items-center gap-4
                                            ${isSelected 
                                                ? 'bg-indigo-50 border-indigo-500 shadow-[0_4px_12px_rgba(99,102,241,0.15)] transform scale-[1.01]' 
                                                : 'bg-white border-slate-200 hover:border-indigo-300 hover:bg-slate-50 hover:shadow-sm'
                                            }`}
                                    >
                                        <div className={`w-10 h-10 shrink-0 rounded-xl flex items-center justify-center font-bold text-lg transition-colors
                                            ${isSelected ? 'bg-indigo-500 text-white' : 'bg-slate-100 text-slate-500 group-hover:bg-indigo-100 group-hover:text-indigo-600'}`}>
                                            {letters[idx]}
                                        </div>
                                        <span className={`text-base md:text-lg font-medium ${isSelected ? 'text-indigo-900' : 'text-slate-700'}`}>
                                            {opt}
                                        </span>
                                        {isSelected && (
                                            <div className="absolute right-4 text-indigo-500 text-xl fade-in">
                                                <i className="fa-solid fa-circle-check"></i>
                                            </div>
                                        )}
                                    </button>
                                );
                            })}
                        </div>

                        {/* Hint Box (Moved ABOVE navigation) */}
                        {showHint && (
                            <div className="w-full mb-6 p-4 bg-amber-50 border border-amber-200 rounded-2xl flex items-start gap-3 slide-up">
                                <i className="fa-solid fa-circle-info text-amber-500 mt-1"></i>
                                <p className="text-amber-800 text-sm font-medium leading-relaxed">{q.hint}</p>
                            </div>
                        )}

                        {/* Bottom Navigation */}
                        <div className="w-full flex items-center justify-between gap-4 mt-auto">
                            <div className="flex gap-2">
                                <button 
                                    onClick={() => {
                                        setShowHint(false);
                                        setCurrentIdx(p => Math.max(0, p - 1));
                                    }}
                                    disabled={currentIdx === 0}
                                    className="w-14 h-14 rounded-2xl flex items-center justify-center bg-white border border-slate-200 text-slate-600 hover:bg-slate-50 disabled:opacity-50 disabled:cursor-not-allowed shadow-sm transition-all active:scale-95"
                                >
                                    <i className="fa-solid fa-chevron-left text-xl"></i>
                                </button>
                                
                                {hasAnswered && (
                                    <button 
                                        onClick={clearAnswer}
                                        className="h-14 px-4 rounded-2xl flex items-center justify-center bg-white border border-slate-200 text-slate-400 hover:text-rose-500 hover:bg-rose-50 transition-all shadow-sm active:scale-95"
                                        title="Hapus Jawaban"
                                    >
                                        <i className="fa-solid fa-rotate-left"></i>
                                    </button>
                                )}
                            </div>

                            <div className="flex gap-2">
                                <button 
                                    onClick={() => setShowHint(!showHint)}
                                    className={`h-14 px-6 rounded-2xl flex items-center justify-center gap-2 font-bold text-sm transition-all shadow-sm active:scale-95
                                        ${showHint ? 'bg-amber-100 text-amber-700 border border-amber-200' : 'bg-white border border-slate-200 text-amber-500 hover:bg-amber-50'}`}
                                >
                                    <i className={`fa-solid fa-lightbulb ${showHint ? 'animate-pulse' : ''}`}></i>
                                    <span className="hidden sm:inline">Petunjuk</span>
                                </button>
                            </div>

                            <button 
                                onClick={() => {
                                    setShowHint(false);
                                    if (currentIdx === questions.length - 1) finishQuiz();
                                    else setCurrentIdx(p => p + 1);
                                }}
                                className={`h-14 px-8 rounded-2xl flex items-center justify-center gap-3 font-bold text-white shadow-lg transition-all active:scale-95
                                    ${currentIdx === questions.length - 1 
                                        ? 'bg-gradient-to-r from-emerald-400 to-emerald-500 hover:from-emerald-500 hover:to-emerald-600 shadow-emerald-200' 
                                        : 'bg-gradient-to-r from-indigo-500 to-purple-500 hover:from-indigo-600 hover:to-purple-600 shadow-indigo-200'}`}
                            >
                                <span>{currentIdx === questions.length - 1 ? 'Selesai' : 'Lanjut'}</span>
                                {currentIdx !== questions.length - 1 && <i className="fa-solid fa-arrow-right"></i>}
                            </button>
                        </div>
                    </div>
                </div>
            );
        };

        // ==========================================
        // APP COMPONENT (Dashboard Lengkap dengan Activity Log & Bento)
        // ==========================================
        const App = () => {
            const [activeSubject, setActiveSubject] = useState(null);
            const [studentName, setStudentName] = useState("");
            const [nameInput, setNameInput] = useState("");
            const [historyLogs, setHistoryLogs] = useState([]);

            useEffect(() => {
                const savedName = localStorage.getItem("student_name");
                if (savedName) {
                    setStudentName(savedName);
                    setNameInput(savedName);
                    fetchHistory(savedName);
                }
            }, []);

            const fetchHistory = async (name) => {
                try {
                    const { data, error } = await supabase
                        .from('quiz_history')
                        .select('*')
                        .eq('student_name', name)
                        .order('created_at', { ascending: false })
                        .limit(5);
                    
                    if (error) throw error;
                    if (data) setHistoryLogs(data);
                } catch (err) {
                    console.error("Gagal mengambil history:", err);
                }
            };

            const saveName = (e) => {
                e.preventDefault();
                if (nameInput.trim()) {
                    const newName = nameInput.trim();
                    setStudentName(newName);
                    localStorage.setItem("student_name", newName);
                    fetchHistory(newName);
                }
            };

            const logout = () => {
                setStudentName("");
                setNameInput("");
                setHistoryLogs([]);
                localStorage.removeItem("student_name");
            };

            if (activeSubject) {
                return (
                    <QuizEngine 
                        studentName={studentName}
                        subject={activeSubject} 
                        onExit={() => {
                            setActiveSubject(null);
                            fetchHistory(studentName); 
                        }} 
                    />
                );
            }

            if (!studentName) {
                return (
                    <div className="min-h-screen flex items-center justify-center p-4 bg-gradient-to-br from-indigo-500 via-purple-500 to-pink-500">
                        <div className="bg-white p-8 rounded-[2rem] shadow-2xl w-full max-w-md text-center slide-up">
                            <div className="w-20 h-20 bg-indigo-100 text-indigo-600 rounded-3xl mx-auto flex items-center justify-center text-4xl mb-6 shadow-inner transform -rotate-6">
                                🚀
                            </div>
                            <h1 className="text-3xl font-display font-bold text-slate-800 mb-2">To The Mars</h1>
                            <p className="text-slate-500 mb-8 font-medium">Siap memulai petualangan belajarmu?</p>
                            <form onSubmit={saveName} className="space-y-4">
                                <input
                                    type="text"
                                    placeholder="Masukkan namamu..."
                                    value={nameInput}
                                    onChange={(e) => setNameInput(e.target.value)}
                                    className="w-full px-5 py-4 border-2 border-slate-200 rounded-2xl focus:outline-none focus:border-indigo-500 focus:ring-4 focus:ring-indigo-50 text-center font-semibold text-lg transition-all"
                                    required
                                    autoFocus
                                />
                                <button type="submit" className="w-full py-4 bg-slate-900 text-white font-bold rounded-2xl hover:bg-indigo-600 transition-colors shadow-lg active:scale-95">
                                    Mulai Sekarang
                                </button>
                            </form>
                        </div>
                    </div>
                );
            }

            const subjects = [
                { id: 'math_kmnr', title: 'Math KMNR', icon: 'fa-calculator', color: 'from-blue-400 to-blue-600', count: dbQuestions.math_kmnr.length },
                { id: 'math_numerik', title: 'Math Numerik', icon: 'fa-cubes', color: 'from-emerald-400 to-emerald-600', count: dbQuestions.math_numerik.length },
                { id: 'math_spasial', title: 'Math Spasial', icon: 'fa-shapes', color: 'from-amber-400 to-orange-500', count: dbQuestions.math_spasial.length },
                { id: 'science_ksnr', title: 'Science KSNR', icon: 'fa-flask', color: 'from-purple-400 to-purple-600', count: dbQuestions.science_ksnr.length },
                { id: 'science_iksc', title: 'Science IKSC', icon: 'fa-microscope', color: 'from-pink-400 to-rose-500', count: dbQuestions.science_iksc.length },
                { id: 'english_iklc', title: 'English IKLC', icon: 'fa-book-open', color: 'from-cyan-400 to-cyan-600', count: dbQuestions.english_iklc.length },
                { id: 'english_osi', title: 'English OSI', icon: 'fa-language', color: 'from-indigo-400 to-indigo-600', count: dbQuestions.english_osi.length },
                { id: 'english_ef', title: 'English EF', icon: 'fa-spell-check', color: 'from-teal-400 to-teal-600', count: dbQuestions.english_ef.length }
            ];

            return (
                <div className="min-h-screen bg-slate-50 pb-20">
                    <div className="bg-slate-900 text-white rounded-b-[3rem] px-6 pt-12 pb-24 shadow-xl relative overflow-hidden">
                        <div className="absolute top-0 right-0 w-64 h-64 bg-white opacity-5 rounded-full blur-3xl transform translate-x-1/2 -translate-y-1/2"></div>
                        <div className="absolute bottom-0 left-0 w-40 h-40 bg-indigo-500 opacity-20 rounded-full blur-2xl transform -translate-x-1/2 translate-y-1/2"></div>
                        
                        <div className="max-w-6xl mx-auto relative z-10 flex justify-between items-start">
                            <div>
                                <h1 className="text-3xl md:text-4xl font-display font-bold mb-2">Halo, {studentName}! 👋</h1>
                                <p className="text-slate-400 font-medium">Pilih misi belajarmu hari ini</p>
                            </div>
                            <button onClick={logout} className="p-3 bg-slate-800 hover:bg-rose-500 hover:text-white text-slate-300 rounded-2xl transition-all shadow-inner">
                                <i className="fa-solid fa-arrow-right-from-bracket"></i>
                            </button>
                        </div>
                    </div>

                    <div className="max-w-6xl mx-auto px-6 -mt-12 relative z-20">
                        <div className="grid grid-cols-1 lg:grid-cols-3 gap-6">
                            
                            {/* Area Utama: Bento Card Subjek */}
                            <div className="lg:col-span-2 grid grid-cols-1 sm:grid-cols-2 gap-5">
                                {subjects.map(sub => (
                                    <button
                                        key={sub.id}
                                        onClick={() => setActiveSubject(sub.id)}
                                        className="bento-card group text-left transition-all duration-300 relative overflow-hidden flex flex-col"
                                    >
                                        <div className="flex justify-between items-start mb-6 relative z-10">
                                            <div className={`w-12 h-12 rounded-2xl flex items-center justify-center bg-gradient-to-br ${sub.color} text-white shadow-lg group-hover:scale-110 transition-transform`}>
                                                <i className={`fa-solid ${sub.icon} text-xl`}></i>
                                            </div>
                                            <div className="w-8 h-8 rounded-full bg-slate-50 border border-slate-100 flex items-center justify-center text-slate-400 group-hover:bg-indigo-50 group-hover:text-indigo-600 group-hover:border-indigo-100 transition-colors">
                                                <i className="fa-solid fa-play text-xs ml-0.5"></i>
                                            </div>
                                        </div>
                                        <div className="relative z-10 mt-auto">
                                            <h3 className="font-bold text-slate-800 text-lg mb-1 group-hover:text-indigo-600 transition-colors">{sub.title}</h3>
                                            <p className="text-sm text-slate-500 font-medium">{sub.count} Bank Soal Tersedia</p>
                                        </div>
                                        
                                        <div className="absolute -bottom-4 -right-4 text-slate-50 opacity-[0.04] group-hover:opacity-[0.08] transition-opacity transform group-hover:scale-110">
                                            <i className={`fa-solid ${sub.icon} text-9xl`}></i>
                                        </div>
                                    </button>
                                ))}
                            </div>

                            {/* Sidebar: Activity Log */}
                            <div className="bg-white rounded-3xl p-6 border border-slate-200 shadow-[0_4px_20px_-4px_rgba(0,0,0,0.05)] h-fit flex flex-col">
                                <h2 className="font-display font-bold text-xl text-slate-800 mb-6 flex items-center gap-3">
                                    <i className="fa-solid fa-chart-line text-indigo-500"></i>
                                    Aktivitas Terakhir
                                </h2>
                                
                                <div className="space-y-4">
                                    {historyLogs.length === 0 ? (
                                        <div className="text-center py-8 text-slate-400">
                                            <i className="fa-solid fa-ghost text-4xl mb-3 opacity-20"></i>
                                            <p className="text-sm font-medium">Belum ada riwayat kuis.</p>
                                        </div>
                                    ) : (
                                        historyLogs.map((log, idx) => (
                                            <div key={idx} className="flex items-center justify-between p-4 rounded-2xl bg-slate-50 border border-slate-100 hover:border-indigo-100 hover:bg-indigo-50/50 transition-colors">
                                                <div>
                                                    <p className="font-bold text-slate-700 text-sm mb-1 uppercase tracking-wide">
                                                        {log.subject.replace('_', ' ')}
                                                    </p>
                                                    <p className="text-xs text-slate-400 font-medium">
                                                        {formatDate(log.created_at)}
                                                    </p>
                                                </div>
                                                <div className="text-right flex flex-col items-end">
                                                    <span className={`font-black text-lg ${log.score >= 80 ? 'text-green-500' : log.score >= 60 ? 'text-amber-500' : 'text-rose-500'}`}>
                                                        {log.score}
                                                    </span>
                                                    <span className="text-[10px] font-bold text-slate-400 uppercase">
                                                        Skor
                                                    </span>
                                                </div>
                                            </div>
                                        ))
                                    )}
                                </div>
                            </div>

                        </div>
                    </div>
                </div>
            );
        };

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
